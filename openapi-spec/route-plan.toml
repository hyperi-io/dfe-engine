[notes]
protocol = "Protocol surface: token issue, OIDC or SCIM (RFC 7644) fixes its shape."
sigma = "Inert for 2.2.1 and hidden from the CLI and MCP. Placed when sigma returns."
apply-creates = "One PUT creates (`If-None-Match: *`) and replaces (`If-Match`)."
patch-apply = "PATCH folds into the apply, which takes the whole desired state."
validate-dry-run = "Validation is the apply with `dry_run=true`."
tasks-operations = "Background tasks are operations (AIP-151)."
auto-merge-setting = "Auto-merge is one of the governance settings."
gitops-log = "The gitops log is the change history."
contract = "One contract per app image, so a singleton under the app."
accounts-me = "The caller's own account: an `identity/accounts/me` alias, or an `identity/me` singleton beside the frozen `auth/me`."
groups-scope = "A group is system- or org-scoped, so `orgs/{org}/groups` cannot own a system group: one `identity/groups/{group}` collection with the scope as a field, or split between the two."
catalogue-entry = "Creating from a catalogue entry: a collection action `sources/from-catalogue` with the entry in the body, or catalogue entries as a resource of their own."
source-schema-overlap = "Overlaps the sources router's own route for the same source: merge into it, or keep both."
services-overlap = "ServiceConfigRegistry overlaps the apps router's instance config: merge into `deployment/apps/{app}/instances/{instance}`, or retire."
fieldmap-defaults = "Default field maps belong to no source: an `ingest/field-maps/{field_map}` collection, or another root."
detection-rules = "Detection rules (hunt SQL and CEL): `rules` is kept for routing rules under `sources` and `ingest`, so these need a place of their own."
alert-destinations = "Alert destinations are deployment-wide, optionally bound to a hunt: under `orgs/{org}` with alerts, or deployment-wide."
deployment-facts = "What this deployment runs: the `deployment` singleton's own read, kept for the Big Dial, or a read beside it."
defaults-apply = "The action's name is the apply verb, which `PUT /system/defaults` takes."
clickhouse-cloud = "ClickHouse Cloud status, start and stop: actions on `deployment/backing-services/{service}`, or a singleton of their own."
compute-helpers = "A compute-only helper that owns no resource: an action on the resource it serves, or a shared root for helpers."
hunts-orgs = "A hunt can target several customer orgs, so `orgs/{org}/hunts` cannot own every hunt."
queries = "No root holds queries: parameterised views, raw SQL and the cost leaderboard."
samples = "Sample tasks: fold into `system/operations/{operation}` with the result inline, or keep a collection of their own."
synthetic-data = "No root holds synthetic data."
pipeline-templates = "Whether these Vector templates are what the `pipelines/{pipeline}` root holds."
usage-scope = "Usage reads the whole deployment or one org, and `orgs/{org}/usage` covers only the second."
derived-schemas = "A derived schema's base is not in its path today, and nesting under `schemas/{schema}/derived` needs it there."
helm-vars = "Generic overlay-var CRUD: under `governance/settings`, under `deployment`, or retired once apps and backing services cover it."
overlays = "Backing-service overlay files: under `deployment/backing-services/{service}`, which needs each overlay's service, or a collection of their own."
apps-depth = "An instance's children sit 4 levels deep under the `deployment` root: drop `deployment` from the apps path, or raise the depth limit to 4."
gitops-classes = "The resource-class enumeration generated clients build their selects from: no root holds it."
lifecycle = "Lifecycle state covers apps and backing services: an action on each, or a collection of its own."
client-config = "The console's runtime bootstrap: `system/client-config`, or where the console first reads it."
hyperdx = "The HyperDX fork's reads for the caller's org: under `orgs/{org}`, or a root of their own."
repository = "Console preferences and small objects scoped system, org or user: no root holds them."
