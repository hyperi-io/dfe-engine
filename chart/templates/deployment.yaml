apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-engine.fullname" . }}
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dfe-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Scrape the observability port (#106 P2.4). scalo serves /metrics on
        # 9090; the API port 8000 no longer exposes it (P1.3).
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dfe-engine.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dfe-engine.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container-level hardening (#106 P3.4). readOnlyRootFilesystem is NOT set
          # yet: the engine writes the minted JWT key under DFE_SECRETS_PATH on the
          # image rootfs -- that lands with the shared-signing-key follow-up (P1.1).
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            # Observability (health + /metrics), served by scalo on 9090.
            - name: obs
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            # API traffic. The ingress + in-cluster consumers target this.
            - name: http
              containerPort: {{ .Values.config.api.port }}
              protocol: TCP
          # Probes hit the observability port (#106 P2.4), not the API port.
          livenessProbe:
            httpGet:
              path: /health/live
              port: obs
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: obs
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup reuses the liveness path -- there is no /startupz (#106 P2.7).
          # The generous failureThreshold gives the long startup budget; liveness
          # stays tight and is suspended until this passes.
          startupProbe:
            httpGet:
              path: /health/live
              port: obs
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # ClickHouse connection
            - name: DFE_CLICKHOUSE_HOST
              value: {{ .Values.config.clickhouse.host | quote }}
            - name: DFE_CLICKHOUSE_PORT
              value: {{ .Values.config.clickhouse.port | quote }}
            - name: DFE_CLICKHOUSE_USERNAME
              value: {{ .Values.config.clickhouse.username | quote }}
            - name: DFE_CLICKHOUSE_DATABASE
              value: {{ .Values.config.clickhouse.database | quote }}
            - name: DFE_CLICKHOUSE_SECURE
              value: {{ .Values.config.clickhouse.secure | quote }}
            - name: DFE_CLICKHOUSE_VERIFY
              value: {{ .Values.config.clickhouse.verify | quote }}
            - name: DFE_CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.clickhouseSecretName" . }}
                  key: {{ .Values.clickhouse.secretKeys.password }}
            # API server
            - name: DFE_API_HOST
              value: {{ .Values.config.api.host | quote }}
            - name: DFE_API_PORT
              value: {{ .Values.config.api.port | quote }}
            - name: DFE_API_JWT_EXPIRE_MINUTES
              value: {{ .Values.config.api.jwt_expire_minutes | quote }}
            {{- if .Values.config.api.cors_origins }}
            - name: DFE_API_CORS_ORIGINS
              value: {{ .Values.config.api.cors_origins | quote }}
            {{- end }}
            - name: DFE_API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.jwtSecretName" . }}
                  key: {{ .Values.jwt.secretKeys.secret }}
            # Deployment posture - "production" rejects the placeholder jwt secret
            - name: DFE_ENV
              value: {{ .Values.env | quote }}
            # Auth
            - name: DFE_AUTH_ENABLED
              value: {{ .Values.config.auth.enabled | quote }}
            - name: DFE_AUTH_LOCAL_ENABLED
              value: {{ .Values.config.auth.local.enabled | quote }}
            - name: DFE_AUTH_LOCAL_ORG_ID
              value: {{ .Values.config.auth.local.org_id | quote }}
            - name: DFE_AUTH_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.authSecretName" . }}
                  key: {{ .Values.auth.admin.secretKeys.password }}
            - name: DFE_AUTH_LOCAL_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.authSecretName" . }}
                  key: {{ .Values.auth.operator.secretKeys.password }}
            - name: DFE_AUTH_LOCAL_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.authSecretName" . }}
                  key: {{ .Values.auth.viewer.secretKeys.password }}
            {{- if .Values.config.config_dir }}
            - name: DFE_CONFIG_DIR
              value: {{ .Values.config.config_dir | quote }}
            {{- else if .Values.configVolume.enabled }}
            - name: DFE_CONFIG_DIR
              value: {{ .Values.configVolume.mountPath | quote }}
            {{- end }}
            # scalo.secrets root (#106 P1.1). Image default is /app/secrets; set here
            # so it is surfaced/overridable (e.g. a shared-key mount for >1 replica).
            {{- if .Values.config.secrets.path }}
            - name: DFE_SECRETS_PATH
              value: {{ .Values.config.secrets.path | quote }}
            {{- end }}
          {{- if .Values.configVolume.enabled }}
          volumeMounts:
            - name: config
              mountPath: {{ .Values.configVolume.mountPath }}
          {{- end }}
      {{- if .Values.configVolume.enabled }}
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: {{ if .Values.configVolume.existingClaim }}{{ .Values.configVolume.existingClaim }}{{ else }}{{ include "dfe-engine.fullname" . }}-config{{ end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
