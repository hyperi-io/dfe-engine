apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "dfe-engine.fullname" . }}
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "dfe-engine.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Scrape the observability port (#106). scalo serves /metrics on
        # 9090; the API port 8000 no longer exposes it.
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.service.port | quote }}
        prometheus.io/path: "/metrics"
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "dfe-engine.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "dfe-engine.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # Container-level hardening (#106). readOnlyRootFilesystem is an
          # opt-in (security.readOnlyRootFilesystem): safe only with a mounted
          # jwt.signingKey (no per-pod key mint to the rootfs) AND no runtime
          # secret minting to the local FS -- see values.yaml (dfe-engine#109).
          securityContext:
            allowPrivilegeEscalation: false
            {{- if .Values.security.readOnlyRootFilesystem }}
            readOnlyRootFilesystem: true
            {{- end }}
            capabilities:
              drop:
                - ALL
          ports:
            # Observability (health + /metrics), served by scalo on 9090.
            - name: obs
              containerPort: {{ .Values.service.port }}
              protocol: TCP
            # API traffic. The ingress + in-cluster consumers target this.
            - name: http
              containerPort: {{ .Values.config.api.port }}
              protocol: TCP
          # Probes hit the observability port (#106), not the API port -- kubelet
          # must still get an answer when the API is saturated or not yet serving.
          livenessProbe:
            httpGet:
              path: /livez
              port: obs
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: obs
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Startup reuses the liveness path -- there is no /startupz (#106).
          # The generous failureThreshold gives the long startup budget; liveness
          # stays tight and is suspended until this passes.
          startupProbe:
            httpGet:
              path: /livez
              port: obs
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          env:
            # ClickHouse connection. The SAME include the hunt-runner and the
            # materialise Job use -- the API reads effective_data_database on
            # nearly every route (sources, schemas, hunts, queries, repository),
            # so an inlined copy that drops data_database silently split the API
            # off onto a different database from the runner it coordinates with.
            {{- include "dfe-engine.clickhouseEnv" . | nindent 12 }}
            # API server
            - name: DFE_API_HOST
              value: {{ .Values.config.api.host | quote }}
            - name: DFE_API_PORT
              value: {{ .Values.config.api.port | quote }}
            - name: DFE_API_JWT_EXPIRE_MINUTES
              value: {{ .Values.config.api.jwt_expire_minutes | quote }}
            {{- if ne (toString .Values.config.api.max_session_minutes) "" }}
            - name: DFE_API_MAX_SESSION_MINUTES
              value: {{ toString .Values.config.api.max_session_minutes | quote }}
            {{- end }}
            {{- if .Values.config.api.cors_origins }}
            - name: DFE_API_CORS_ORIGINS
              value: {{ .Values.config.api.cors_origins | quote }}
            {{- end }}
            {{- if .Values.config.api.forwarded_allow_ips }}
            - name: DFE_API_FORWARDED_ALLOW_IPS
              value: {{ .Values.config.api.forwarded_allow_ips | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.api.docs_enabled) "" }}
            - name: DFE_API_DOCS_ENABLED
              value: {{ toString .Values.config.api.docs_enabled | quote }}
            {{- end }}
            - name: DFE_API_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.jwtSecretName" . }}
                  key: {{ .Values.jwt.secretKeys.secret }}
            # Deployment posture - "production" rejects the placeholder jwt secret
            - name: DFE_ENV
              value: {{ .Values.env | quote }}
            # Auth
            - name: DFE_AUTH_ENABLED
              value: {{ .Values.config.auth.enabled | quote }}
            {{- if ne (toString .Values.config.auth.api_key_default_ttl_days) "" }}
            - name: DFE_AUTH_API_KEY_DEFAULT_TTL_DAYS
              value: {{ toString .Values.config.auth.api_key_default_ttl_days | quote }}
            {{- end }}
            - name: DFE_AUTH_LOCAL_ENABLED
              value: {{ .Values.config.auth.local.enabled | quote }}
            - name: DFE_AUTH_LOCAL_ORG_ID
              value: {{ .Values.config.auth.local.org_id | quote }}
            {{- with .Values.config.auth.login_throttle }}
            {{- if ne (toString .enabled) "" }}
            - name: DFE_AUTH_LOGIN_THROTTLE_ENABLED
              value: {{ toString .enabled | quote }}
            {{- end }}
            {{- if ne (toString .username_failures) "" }}
            - name: DFE_AUTH_LOGIN_THROTTLE_USERNAME_FAILURES
              value: {{ toString .username_failures | quote }}
            {{- end }}
            {{- if ne (toString .client_failures) "" }}
            - name: DFE_AUTH_LOGIN_THROTTLE_CLIENT_FAILURES
              value: {{ toString .client_failures | quote }}
            {{- end }}
            {{- if ne (toString .max_delay_seconds) "" }}
            - name: DFE_AUTH_LOGIN_THROTTLE_MAX_DELAY_SECONDS
              value: {{ toString .max_delay_seconds | quote }}
            {{- end }}
            {{- end }}
            # The minted admin password. The engine reasserts it on every boot and
            # refuses to start on "changeme" unless env is a dev posture.
            - name: DFE_AUTH_LOCAL_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.authSecretName" . }}
                  key: {{ .Values.auth.admin.secretKeys.password }}
            # Names the secret in the credential-fetch command the login page shows.
            - name: DFE_AUTH_LOCAL_ADMIN_SECRET_NAME
              value: {{ include "dfe-engine.authSecretName" . | quote }}
            - name: DFE_AUTH_LOCAL_ADMIN_SECRET_KEY
              value: {{ .Values.auth.admin.secretKeys.password | quote }}
            - name: DFE_DEPLOYMENT_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            {{- if .Values.auth.breakglass.existingSecret }}
            # First-boot break-glass password: hashed into the deploy repo once, then ignored.
            - name: DFE_AUTH_BREAKGLASS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.breakglass.existingSecret }}
                  key: {{ .Values.auth.breakglass.secretKeys.password }}
            {{- end }}
            {{- with .Values.auth.admin.secretPath }}
            # Set = the rotate-password endpoint writes through the scalo secrets seam.
            - name: DFE_AUTH_LOCAL_ADMIN_PASSWORD_SECRET_PATH
              value: {{ . | quote }}
            {{- end }}
            - name: DFE_AUTH_LOCAL_OPERATOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.authSecretName" . }}
                  key: {{ .Values.auth.operator.secretKeys.password }}
            - name: DFE_AUTH_LOCAL_VIEWER_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "dfe-engine.authSecretName" . }}
                  key: {{ .Values.auth.viewer.secretKeys.password }}
            {{- with .Values.config.synthetic_data }}
            {{- if .autostart_schemas }}
            # Standing synthetic demo streams (default off)
            - name: DFE_SYNTHETIC_DATA_AUTOSTART_SCHEMAS
              value: {{ .autostart_schemas | quote }}
            - name: DFE_SYNTHETIC_DATA_AUTOSTART_RECEIVER_URL
              value: {{ .autostart_receiver_url | quote }}
            - name: DFE_SYNTHETIC_DATA_AUTOSTART_RATE_EPS
              value: {{ .autostart_rate_eps | quote }}
            {{- if .autostart_seed }}
            - name: DFE_SYNTHETIC_DATA_AUTOSTART_SEED
              value: {{ .autostart_seed | quote }}
            {{- end }}
            {{- end }}
            {{- end }}
            {{- with .Values.config.kafka }}
            {{- if .bootstrap_servers }}
            # Kafka topic creation on source deploy
            - name: DFE_KAFKA_BOOTSTRAP_SERVERS
              value: {{ .bootstrap_servers | quote }}
            {{- if .provider }}
            - name: DFE_KAFKA_PROVIDER
              value: {{ .provider | quote }}
            {{- end }}
            - name: DFE_KAFKA_ENSURE_TOPICS
              value: {{ .ensure_topics | quote }}
            - name: DFE_KAFKA_TOPIC_PARTITIONS
              value: {{ .topic_partitions | quote }}
            - name: DFE_KAFKA_TOPIC_REPLICATION_FACTOR
              value: {{ .topic_replication_factor | quote }}
            {{- if .topic_retention_ms }}
            - name: DFE_KAFKA_TOPIC_RETENTION_MS
              value: {{ .topic_retention_ms | quote }}
            {{- end }}
            {{- if .topic_cleanup_policy }}
            - name: DFE_KAFKA_TOPIC_CLEANUP_POLICY
              value: {{ .topic_cleanup_policy | quote }}
            {{- end }}
            {{- if .topic_compression_type }}
            - name: DFE_KAFKA_TOPIC_COMPRESSION_TYPE
              value: {{ .topic_compression_type | quote }}
            {{- end }}
            {{- else }}
            # No broker address configured, so there is nothing for the deploy hook
            # to reach; left on it would spend the admin timeout on every source
            # deploy before giving up. Set config.kafka.bootstrap_servers to enable.
            - name: DFE_KAFKA_ENSURE_TOPICS
              value: "false"
            {{- end }}
            {{- end }}
            {{- if .Values.config.config_dir }}
            - name: DFE_CONFIG_DIR
              value: {{ .Values.config.config_dir | quote }}
            {{- else if .Values.configVolume.enabled }}
            - name: DFE_CONFIG_DIR
              value: {{ .Values.configVolume.mountPath | quote }}
            {{- end }}
            # scalo.secrets root (#106). Image default is /app/secrets; set here
            # so it is surfaced/overridable (e.g. a shared-key mount for >1 replica).
            {{- if .Values.config.secrets.path }}
            - name: DFE_SECRETS_PATH
              value: {{ .Values.config.secrets.path | quote }}
            {{- end }}
          {{- if or .Values.configVolume.enabled .Values.jwt.signingKey.existingSecret }}
          volumeMounts:
            {{- if .Values.configVolume.enabled }}
            - name: config
              mountPath: {{ .Values.configVolume.mountPath }}
            {{- end }}
            {{- if .Values.jwt.signingKey.existingSecret }}
            # Shared ES384 signing key (#106, dfe-engine#109), read-only, so
            # every replica loads the SAME key -> cross-pod JWKS verification holds.
            # scalo.secrets (file provider) reads it raw at jwt/signing-key. Mounted
            # as a DIRECTORY (not subPath) to stay readOnlyRootFilesystem-safe: the
            # mount point's parent (config.secrets.path) exists in the image, so the
            # runtime never has to mkdir on a read-only rootfs.
            - name: jwt-signing-key
              mountPath: {{ .Values.config.secrets.path }}/jwt
              readOnly: true
            {{- end }}
          {{- end }}
      {{- if or .Values.configVolume.enabled .Values.jwt.signingKey.existingSecret }}
      volumes:
        {{- if .Values.configVolume.enabled }}
        - name: config
          persistentVolumeClaim:
            claimName: {{ if .Values.configVolume.existingClaim }}{{ .Values.configVolume.existingClaim }}{{ else }}{{ include "dfe-engine.fullname" . }}-config{{ end }}
        {{- end }}
        {{- if .Values.jwt.signingKey.existingSecret }}
        - name: jwt-signing-key
          secret:
            secretName: {{ .Values.jwt.signingKey.existingSecret }}
            # The Secret's key ({{ .Values.jwt.signingKey.key }}) is projected to the
            # file `signing-key` -- what scalo.secrets reads at jwt/signing-key.
            items:
              - key: {{ .Values.jwt.signingKey.key }}
                path: signing-key
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
