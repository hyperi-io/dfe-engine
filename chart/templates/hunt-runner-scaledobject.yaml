{{- if and .Values.huntRunner.enabled .Values.huntRunner.keda.enabled }}
# KEDA scales the hunt runner on the deterministic-due backlog.
#
# KEDA has NO native ClickHouse scaler. Rather than open a CH wire port
# (mysql_port / postgresql_port) purely so KEDA can count rows - a shared-infra +
# security-surface change for one workload - we use KEDA's stock metrics-api scaler
# against the engine's own /api/v1/system/hunts-due endpoint: the engine ALREADY
# holds the CH connection and is the authority on what is due, so it runs the
# deterministic due-query (schedule.due_query(db) - a unit test pins its clauses)
# and returns {"due": N}. No CH port, no Prometheus, no custom scaler.
#
# Auth: KEDA sends an engine API key (scope hunt:read) as the X-API-Key header.
# Provision that key + store it in the referenced secret. Confirm the metrics-api
# apiKey `method`/`keyParamName` field names against the deployed KEDA version.
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "dfe-engine.fullname" . }}-hunt-runner-auth
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: apiKey
      name: {{ .Values.huntRunner.keda.apiKeySecretName | default (include "dfe-engine.fullname" .) }}
      key: {{ .Values.huntRunner.keda.apiKeySecretKey }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "dfe-engine.fullname" . }}-hunt-runner
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: hunt-runner
spec:
  scaleTargetRef:
    name: {{ include "dfe-engine.fullname" . }}-hunt-runner
  minReplicaCount: {{ .Values.huntRunner.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.huntRunner.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.huntRunner.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.huntRunner.keda.cooldownPeriod }}
  triggers:
    - type: metrics-api
      metadata:
        url: "http://{{ include "dfe-engine.fullname" . }}:{{ .Values.service.port }}/api/v1/system/hunts-due"
        # GJSON path into {"due": N}.
        valueLocation: "due"
        # Scale out when the due backlog reaches this many hunts;
        # desiredReplicas = ceil(due / targetValue), so this is "hunts per worker".
        targetValue: {{ .Values.huntRunner.keda.queryValue | quote }}
        # Activate from zero whenever due > 0. KEDA activates on metric >
        # activationTargetValue (STRICTLY), so this MUST be 0 - "1" would need
        # due >= 2 and a single due hunt would never wake a worker. Proven in the
        # Phase C scratch-cluster KEDA scale test (0 -> 1 -> 0).
        activationTargetValue: "0"
        authMode: "apiKey"
        method: "header"
        keyParamName: "X-API-Key"
      authenticationRef:
        name: {{ include "dfe-engine.fullname" . }}-hunt-runner-auth
{{- end }}
