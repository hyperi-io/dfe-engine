{{- if and .Values.huntRunner.enabled .Values.huntRunner.keda.enabled }}
{{- $db := .Values.config.clickhouse.data_database | default .Values.config.clickhouse.database }}
# KEDA scales the hunt runner on the deterministic-due backlog.
#
# NOTE: KEDA has NO native ClickHouse scaler, so we use the MySQL scaler against
# ClickHouse's MySQL-compatible interface (`mysql_port`, default 9004). The query is
# still ClickHouse SQL, executed by CH - this keeps KEDA reading CH DIRECTLY (no
# engine on the scaling path). Requirements + caveats:
#   - ClickHouse must have `mysql_port` enabled.
#   - `query` MUST match `schedule.due_query(db)` (a unit test pins its clauses;
#     keep the two in step).
#   - Confirm the MySQL-scaler metadata field names against the deployed KEDA
#     version when wiring this in dfe-infra (host/port/username/dbName are the
#     common set; some versions differ).
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: {{ include "dfe-engine.fullname" . }}-hunt-runner-auth
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
spec:
  secretTargetRef:
    - parameter: password
      name: {{ include "dfe-engine.clickhouseSecretName" . }}
      key: {{ .Values.clickhouse.secretKeys.password }}
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: {{ include "dfe-engine.fullname" . }}-hunt-runner
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
    app.kubernetes.io/component: hunt-runner
spec:
  scaleTargetRef:
    name: {{ include "dfe-engine.fullname" . }}-hunt-runner
  minReplicaCount: {{ .Values.huntRunner.keda.minReplicaCount }}
  maxReplicaCount: {{ .Values.huntRunner.keda.maxReplicaCount }}
  pollingInterval: {{ .Values.huntRunner.keda.pollingInterval }}
  cooldownPeriod: {{ .Values.huntRunner.keda.cooldownPeriod }}
  triggers:
    - type: mysql
      metadata:
        host: {{ .Values.config.clickhouse.host | quote }}
        port: {{ .Values.huntRunner.keda.mysqlPort | quote }}
        dbName: {{ $db | quote }}
        username: {{ .Values.config.clickhouse.username | quote }}
        # scale up when the due backlog reaches this many hunts; desiredReplicas =
        # ceil(due / queryValue), so this is also "hunts per worker".
        queryValue: {{ .Values.huntRunner.keda.queryValue | quote }}
        activationQueryValue: "1"
        query: >-
          SELECT count() AS due FROM (SELECT hunt_id, interval_seconds, phase_offset
          FROM (SELECT hunt_id, argMax(interval_seconds, updated) AS interval_seconds,
          argMax(phase_offset, updated) AS phase_offset, argMax(enabled, updated) AS
          enabled FROM `{{ $db }}`.hunt_schedule GROUP BY hunt_id) WHERE enabled = 1) s
          LEFT JOIN (SELECT hunt_id, argMax(watermark, updated) AS wm FROM
          `{{ $db }}`.hunt_watermark GROUP BY hunt_id) w USING (hunt_id) LEFT JOIN
          (SELECT hunt_id, argMax(lease_until, claimed) AS lu FROM `{{ $db }}`.hunt_lease
          GROUP BY hunt_id) l USING (hunt_id) WHERE toInt64(now()) >=
          (intDiv(toInt64(now()), s.interval_seconds) * s.interval_seconds +
          s.phase_offset) AND coalesce(w.wm, 0) < (intDiv(toInt64(now()),
          s.interval_seconds) * s.interval_seconds + s.phase_offset) AND
          coalesce(l.lu, 0) <= toInt64(now())
      authenticationRef:
        name: {{ include "dfe-engine.fullname" . }}-hunt-runner-auth
{{- end }}
