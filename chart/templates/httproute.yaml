{{- if .Values.httpRoute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "dfe-engine.fullname" . }}
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
spec:
  {{- with .Values.httpRoute.parentRefs }}
  parentRefs:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # Route to the API (http) port -- never the observability port.
    - backendRefs:
        - name: {{ include "dfe-engine.fullname" . }}
          port: {{ .Values.service.httpPort }}
{{- end }}
