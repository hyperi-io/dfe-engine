apiVersion: v1
kind: Service
metadata:
  name: {{ include "dfe-engine.fullname" . }}
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    # Observability (health + /metrics on 9090). Primary port -- matches the
    # deployment contract's metrics_port (#106 P2.4).
    - port: {{ .Values.service.port }}
      targetPort: obs
      protocol: TCP
      name: obs
    # API traffic. Consumers and the ingress reach the engine here, as before.
    - port: {{ .Values.service.httpPort }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "dfe-engine.selectorLabels" . | nindent 4 }}
