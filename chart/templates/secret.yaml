{{/*
  Managed secret — only created when no existingSecret is referenced.
  All engine credentials (ClickHouse, JWT, local auth) are consolidated here
  unless users supply their own pre-existing secrets.
*/}}
{{- $fullname := include "dfe-engine.fullname" . -}}
{{- $createSecret := or
    (not .Values.clickhouse.existingSecret)
    (not .Values.jwt.existingSecret)
    (not .Values.auth.admin.existingSecret) -}}
{{- if $createSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $fullname }}
  labels:
    {{- include "dfe-engine.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if not .Values.clickhouse.existingSecret }}
  {{ .Values.clickhouse.secretKeys.password }}: {{ .Values.clickhouse.password | quote }}
  {{- end }}
  {{- if not .Values.jwt.existingSecret }}
  {{ .Values.jwt.secretKeys.secret }}: {{ .Values.jwt.secret | quote }}
  {{- end }}
  {{- if not .Values.auth.admin.existingSecret }}
  {{ .Values.auth.admin.secretKeys.password }}: {{ .Values.auth.admin.password | quote }}
  {{- end }}
  {{- if not .Values.auth.operator.existingSecret }}
  {{ .Values.auth.operator.secretKeys.password }}: {{ .Values.auth.operator.password | quote }}
  {{- end }}
  {{- if not .Values.auth.viewer.existingSecret }}
  {{ .Values.auth.viewer.secretKeys.password }}: {{ .Values.auth.viewer.password | quote }}
  {{- end }}
{{- end }}
