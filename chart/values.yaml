# dfe-engine Helm chart values
#
# All configuration maps to DFESettings environment variables.
# See src/dfe_engine/settings.py for the full env var reference.

# -- Number of replicas (ignored when autoscaling.enabled is true)
replicaCount: 1

image:
  # -- Default registry/repository matches the deployment contract
  # (deployment.image_registry, default ghcr.io/hyperi-io). Override per
  # environment via Argo CD / Helm values; do not hardcode a deployment-specific
  # registry here (dfe-engine is a generic product, not a HyperI-only tool).
  repository: ghcr.io/hyperi-io/dfe-engine
  # -- Defaults to Chart appVersion
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

# -- Service. Two ports (#106): the primary `port` is the observability
# port (health + /metrics, served by scalo's ServiceApp on 9090); `httpPort` is
# the API traffic port the ingress targets. Consumers reach the API on 8000 as
# before -- it stays on the Service, just no longer the primary port.
service:
  type: ClusterIP
  port: 9090
  httpPort: 8000

# -- Ingress (disabled by default — use Envoy Gateway or existing ingress controller)
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: dfe-engine.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Gateway API HTTPRoute (#106). The Gateway-API alternative to `ingress`
# for mesh/Gateway deployments. Routes to the API (http) port, never the
# observability port. Disabled by default; set parentRefs to your Gateway.
httpRoute:
  enabled: false
  # -- Gateways to attach to, e.g. [{name: dfe-gateway, namespace: gateway}].
  parentRefs: []
  # -- Hostnames this route answers for (empty -> all on the parent Gateway).
  hostnames: []

# -- ClickHouse connection
config:
  clickhouse:
    host: clickhouse
    port: 9000
    username: default
    database: dfe
    # -- Data database for hunt coordination + schedule tables (effective_data_database).
    # Empty -> falls back to `database`. Set when data lives in a separate db.
    data_database: ""
    secure: true
    # Unset follows the code default (defaults.yaml: null -> the SCALO_TLS_VERIFY
    # escape valve, so verification is ON). The engine skips an empty value, so
    # this renders inert rather than disabling anything. Set false only for a
    # self-signed dev/test ClickHouse, which is the scope defaults.yaml states.
    verify: ""
  api:
    host: "0.0.0.0"
    port: 8000
    # -- Comma-separated list of allowed CORS origins
    cors_origins: ""
    jwt_expire_minutes: 60
  auth:
    enabled: true
    local:
      enabled: true
      org_id: "default"
  # -- Synthetic data standing demo streams. DEFAULT OFF: set autostart_schemas
  # (comma-separated pack refs, e.g. "meta/syslog,meta/otel/logs") plus the
  # receiver ingest URL and the engine keeps a live-tail synthetic stream
  # running - realistic inbound data for demos and testing, always tagged
  # tags.synthetic=true.
  synthetic_data:
    autostart_schemas: ""
    autostart_receiver_url: ""
    autostart_rate_eps: 2
    # -- Optional determinism seed for the standing streams
    autostart_seed: ""
  # -- Root config directory — maps to DFE_CONFIG_DIR.
  # Auto-resolves sources/, services/, hunts/, etc. subdirectories.
  # Set to the mount path of your config PVC or git-synced volume.
  config_dir: ""
  # -- scalo.secrets root (DFE_SECRETS_PATH) for the ES384 JWT signing key.
  # Defaults to the image's writable /app/secrets. At replicaCount 1 each pod mints
  # its own key here (fine for a single pod). For >1 replica, provide a shared key
  # via jwt.signingKey.existingSecret (mounted read-only at <path>/jwt/signing-key)
  # so every pod signs + verifies with the SAME key (#106, dfe-engine#109).
  secrets:
    path: /app/secrets

# -- ClickHouse credentials
clickhouse:
  # -- Name of an existing secret containing the ClickHouse password.
  # If set, the 'password' field below is ignored.
  existingSecret: ""
  secretKeys:
    password: clickhouse-password
  password: ""

# -- Deployment posture. "production" (default, secure) makes the engine REJECT
# the placeholder jwt.secret when auth is enabled - it will refuse to start.
# Set to "dev" (or development/local/test) for local/tyre-kicker deploys that
# run on the placeholder secret. Maps to DFE_ENV.
env: "production"

# -- JWT signing secret
jwt:
  # -- Name of an existing secret containing the JWT secret.
  existingSecret: ""
  secretKeys:
    secret: jwt-secret
  # -- Change this in production. Min 32 chars recommended.
  secret: "dev-secret-key-change-in-production"
  # -- Shared ES384 signing key for the JWT authority + JWKS (#106,
  # dfe-engine#109). REQUIRED for replicaCount > 1 (or autoscaling): without it
  # each pod mints its OWN key on first boot, so a token signed by pod A fails
  # verification against pod B's JWKS -- intermittent 401s behind the Service.
  # Provide a Secret holding the PKCS8 PEM private key; it is mounted read-only at
  # <config.secrets.path>/jwt/signing-key and every pod loads the same key. Leave
  # empty at replicaCount 1. Generate + create with:
  #   openssl genpkey -algorithm EC -pkeyopts ec_paramgen_curve:P-384 \
  #     -outform PEM -out signing-key.pem
  #   kubectl create secret generic dfe-engine-jwt-signing-key \
  #     --from-file=signing-key=signing-key.pem
  signingKey:
    existingSecret: ""
    # -- Key within the Secret that holds the PEM.
    key: signing-key

# -- Container filesystem hardening (#106).
security:
  # -- Mount the container root filesystem read-only. OPT-IN: enable only when
  # jwt.signingKey.existingSecret is set (no per-pod key mint to the rootfs) AND
  # nothing else mints secrets to the local FS at runtime -- i.e. the secrets
  # provider is external (openbao) OR org/OIDC provisioning is off. Otherwise a
  # runtime write to DFE_SECRETS_PATH fails. Off by default (deploy-specific).
  readOnlyRootFilesystem: false

# -- Local auth account passwords (admin / operator / viewer)
auth:
  admin:
    existingSecret: ""
    secretKeys:
      password: admin-password
    password: "changeme"
  operator:
    existingSecret: ""
    secretKeys:
      password: operator-password
    password: "changeme"
  viewer:
    existingSecret: ""
    secretKeys:
      password: viewer-password
    password: "changeme"

# -- Config directory volume (for YAML SSoT config files)
# Mount a PVC, NFS share, or git-sync volume at config.config_dir.
configVolume:
  enabled: false
  # -- Mount path inside the container (must match config.config_dir)
  mountPath: /etc/dfe/config
  # -- Use an existing PVC
  existingClaim: ""
  # -- Create a new PVC
  size: 1Gi
  storageClass: ""
  accessMode: ReadWriteOnce

# -- Standard HPA (for the API-server Deployment)
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 4
  targetCPUUtilizationPercentage: 80

# -- Pull-based hunt runner (dfe-hunt-runner): a background worker on the SAME
# image, coordinating entirely through ClickHouse. ON for docker/single/scale
# tiers, OFF for slim (see docs deployment tiers).
#
# ONE steady pod, always. This chart renders no ScaledObject: autoscaling on the
# due-hunt backlog is a BETA opt-in that ships in the dfe-infra chart
# (huntRunner.autoscaling + the dfe-keda-shim metrics-api trigger). Adding KEDA
# dials here without a ScaledObject to read them is how they came to do nothing.
# See docs/data-plane/hunt-runner-scaling.md.
huntRunner:
  enabled: false
  replicaCount: 1
  # -- `dfe-hunt-runner run` flags:
  poll: 15          # seconds between ticks
  cap: 8            # global cap on concurrent hunt runs (protects ClickHouse)
  reloadEvery: 20   # reload hunt specs (+ rebuild the runner) every N ticks
  # -- Drain grace for an in-flight hunt query on SIGTERM.
  terminationGracePeriodSeconds: 60
  # -- Optional DFE_HUNTS_DIR override (else derived from the config dir).
  huntsDir: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # -- Argo CD PostSync hook that materialises hunt_schedule on a config change.
  materialiseHook:
    enabled: true
    backoffLimit: 3
    ttlSecondsAfterFinished: 600
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}
