description: A catalogue entry compiles into an ordinary source whose records land in its own table.
origin: catalogue

# {entry} is the catalogue entry the suite picks at run time; a deployment that
# mounts no catalogue offers none, and the case reports an expected skip.
catalogue:
  intake: receiver

# The only app shipping a catalogue is dfe-transform-elastic (apps.yaml
# catalogue:), and it carries the bus alone, so every entry compiles onto a
# transform a direct source cannot name.
expected_skip:
  direct: the mounted catalogue belongs to dfe-transform-elastic, which carries the bus alone until its gRPC listener ships (dfe-transform-elastic#19)

expect:
  - source: "{entry}"
    table: "{entry}"
    topic: "{entry}_land"
    load_topic: "{entry}_load"
    marker: null
    destination: "dfe-transform-elastic-{entry}"
