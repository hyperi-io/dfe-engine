description: A catalogue entry compiles into an ordinary source whose records land in its own table.
origin: catalogue

# {entry} is the catalogue entry the suite picks at run time, one the deployed
# transform's contract does not refuse. An engine whose dfe-schemas ships no
# catalogue answers 502, which fails the case.
catalogue:
  intake: receiver

expect:
  - source: "{entry}"
    table: "{entry}"
    topic: "{entry}_land"
    load_topic: "{entry}_load"
    marker: null
    destination: "dfe-transform-elastic-{entry}"
