sources:
  - source: flowfetchvrl
    display_name: Flow e2e - fetcher with a VRL transform
    description: The fetched record reaches the loader only through the transform instance.
    fetcher:
      source_type: crates_io
      topic: own
      config:
        crates:
          - serde
        interval_secs: 60
    transform:
      engine: vrl
    header:
      type: common-header/timeseries
      version: 1.0.1
    schema:
      meta_schema: meta/syslog
      meta_schema_version: 1.0.0
