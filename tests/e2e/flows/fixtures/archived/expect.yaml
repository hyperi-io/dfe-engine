description: An archived source lands normally and the archiver keeps a copy of the raw record.
origin: receiver

# dfe-archiver carries both transports (apps.yaml transports: [bus, direct]), so
# the shape runs on either and neither is refused.

expect:
  - source: flowarchive
    table: flowarchive
    topic: flowarchive_land
    load_topic: null
    marker: null
    # Two names: on direct nothing holds the record, so the rule fans it out to
    # the archiver beside the stage that loads it.
    destination: [loader, dfe-archiver]
