description: An archived source lands normally and the archiver keeps the record off the landing topic.
origin: receiver

# dfe-archiver reads the landing topic and lists only the bus transport, so a
# direct source asking to be archived is refused at save. The suite asserts the
# refusal; the landing half of the case cannot run there.
refused:
  direct: archive
expected_skip:
  direct: dfe-archiver carries the bus transport only, so an archived direct source is refused at save until it grows a Push listener (WS-I/WS-T)

expect:
  - source: flowarchive
    table: flowarchive
    topic: flowarchive_land
    load_topic: null
    marker: null
    destination: loader
