global_settings:
  ingestion_template_s3_bucket: ghostburner-config-bucket
  schema_common_version: v001.001.007
  derived_schema_paths: ../_sample_xdr_config/sample_schemas/stable_schemas_testing
  schema_output_path: ../.xdr_schema_output/
  hunt_checkpoint_path: ../.xdr_hunt_checkpoint/
  output: ../.xdr_ingestion_pipelines_output
  schema_versioning_output_path: ../.migrations/xdr_schema_versioning
  default_target: integration
  target_path: ~/.xdr/xdr_targets.yaml

build_schemas:
  no_cluster_declarations_needed: true
  use_replicated_merge_tree: false
  use_shared_merge_tree: false

apply_schemas:
  do_add_roles: false
  do_add_columns: true

schemas:
  logs_alerts:
    name: logs_alerts
    meta_schema: logs_alerts.csv
    meta_schema_version: v100.000.000
  nx_log_windows_sub_ce:
    name: nx_log_windows_sub_ce
    meta_schema: logs_nxlog_windows.csv
    meta_schema_version: v100.000.000
    derived_schema_file_path: nx_log_windows_sub_ce/nx_log_windows_sub_ce.csv
    additional_fields_config: nx_log_windows_sub_ce/nx_log_windows_ce_add_fields.csv
    unified_schema_mapping: nx_log_windows_sub_ce/unified_schema_mapping.csv
    derived_schema_ttl: 90
  logs_nxlog_windows:
    name: logs_nxlog_windows
    meta_schema: logs_nxlog_windows.csv
    meta_schema_version: v100.000.002
    derived_schema_file_path: logs_nxlog_windows/logs_nxlog_windows_sub.csv
    additional_fields_config: logs_nxlog_windows/logs_nxlog_windows_add.csv
    derived_schema_ttl: 90
  
schema_versioning:
  - schema_name: logs_alerts
    database_name: org321
    unified_view: windows_audit
    actions:
      add_columns:
        - column_name: testing99
          alias: testing99_alias
          data_type: String CODEC(ZSTD(1))
      remove_columns:
        - column_name: rule_id
      modify_indexes:
        indexes: 
          - source_table
          - detection_time
          - timestamp
          - timestamp_load
      modify_ttl:
        ttl: 200 
        
hunt_scheduler:
  hunt_dir: ../.xdr_hunt_config/single_smd_rule/hunts/
  rule_repo_dir: ../.xdr_hunt_config/single_smd_rule/rules/
  checkpoint_destination: file  # file or clickhouse
  checkpoint_timestamp_field: timestamp_load
  num_threads: 2

