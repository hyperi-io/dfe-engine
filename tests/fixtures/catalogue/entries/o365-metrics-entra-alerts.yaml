# Catalogue source o365-metrics-entra-alerts: the POST /sources write body that creates it.
# See the Catalogue section of README.md.

source: o365-metrics-entra-alerts
display_name: o365_metrics.entra_alerts
description: The entra_alerts data stream of the Elastic o365_metrics integration.
match:
  field: data_stream.dataset
  operator: equals
  value: o365_metrics.entra_alerts
transform:
  engine: elastic
  variant: filebeat.o365_metrics_entra_alerts.default
catalogue:
  package: o365_metrics
  data_stream: entra_alerts
  intakes: [beats]
  variants:
    - filebeat.o365_metrics_entra_alerts.default
