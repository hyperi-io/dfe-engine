# nginx configuration for HyperDX with oauth2-proxy authentication
#
# This nginx config:
#   1. Serves HyperDX UI and API behind oauth2-proxy authentication
#   2. Passes OTLP ingestion ports (4317/4318) WITHOUT auth (cluster-internal)
#   3. Forwards OIDC identity headers to HyperDX API
#
# Deploy as: K8s Ingress controller config, or standalone nginx reverse proxy

upstream hyperdx-app {
    server hyperdx-app:8080;
}

upstream hyperdx-api {
    server hyperdx-api:8000;
}

upstream otel-collector {
    server otel-collector:4318;
}

upstream oauth2-proxy {
    server oauth2-proxy:4180;
}

# ---------------------------------------------------------------------------
# oauth2-proxy endpoints (login flow)
# ---------------------------------------------------------------------------
server {
    listen 80;
    server_name observability.hyperi.io;

    # Redirect to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name observability.hyperi.io;

    ssl_certificate     /etc/tls/tls.crt;
    ssl_certificate_key /etc/tls/tls.key;

    # -----------------------------------------------------------------------
    # oauth2-proxy handles login/callback/sign-out
    # -----------------------------------------------------------------------
    location /oauth2/ {
        proxy_pass http://oauth2-proxy;
        proxy_set_header Host             $host;
        proxy_set_header X-Real-IP        $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # -----------------------------------------------------------------------
    # Internal auth check endpoint (used by auth_request)
    # -----------------------------------------------------------------------
    location = /oauth2/auth {
        internal;
        proxy_pass http://oauth2-proxy;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # -----------------------------------------------------------------------
    # HyperDX API — authenticated, with OIDC identity headers
    # -----------------------------------------------------------------------
    location /api/ {
        auth_request /oauth2/auth;

        # Forward OIDC identity headers from oauth2-proxy to HyperDX API
        auth_request_set $auth_user   $upstream_http_x_auth_request_user;
        auth_request_set $auth_email  $upstream_http_x_auth_request_email;
        auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Email  $auth_email;
        proxy_set_header X-Forwarded-Groups $auth_groups;

        # Prevent clients from spoofing these headers
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Host               $host;

        # On auth failure, redirect to login
        error_page 401 =302 /oauth2/start?rd=$request_uri;

        proxy_pass http://hyperdx-api;
    }

    # -----------------------------------------------------------------------
    # ClickHouse proxy — authenticated, with OIDC identity headers
    # This is the critical path where the oidc-connection middleware reads
    # X-Forwarded-Groups to select the correct ClickHouse connection.
    # -----------------------------------------------------------------------
    location /clickhouse-proxy/ {
        auth_request /oauth2/auth;

        auth_request_set $auth_user   $upstream_http_x_auth_request_user;
        auth_request_set $auth_email  $upstream_http_x_auth_request_email;
        auth_request_set $auth_groups $upstream_http_x_auth_request_groups;

        proxy_set_header X-Forwarded-User   $auth_user;
        proxy_set_header X-Forwarded-Email  $auth_email;
        proxy_set_header X-Forwarded-Groups $auth_groups;
        proxy_set_header X-Real-IP          $remote_addr;
        proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header Host               $host;

        error_page 401 =302 /oauth2/start?rd=$request_uri;

        proxy_pass http://hyperdx-api;
    }

    # -----------------------------------------------------------------------
    # HyperDX UI — authenticated
    # -----------------------------------------------------------------------
    location / {
        auth_request /oauth2/auth;

        auth_request_set $auth_user  $upstream_http_x_auth_request_user;
        auth_request_set $auth_email $upstream_http_x_auth_request_email;

        proxy_set_header X-Forwarded-User  $auth_user;
        proxy_set_header X-Forwarded-Email $auth_email;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host              $host;

        error_page 401 =302 /oauth2/start?rd=$request_uri;

        proxy_pass http://hyperdx-app;
    }
}

# ---------------------------------------------------------------------------
# OTLP ingestion — NO authentication (cluster-internal only)
# ---------------------------------------------------------------------------
# These ports receive telemetry from pods on the internal cluster network.
# They must NOT be exposed externally or go through oauth2-proxy.
#
# In K8s, these are typically separate Services with ClusterIP (not Ingress).
# This nginx config is only needed if you're consolidating everything behind
# a single reverse proxy (e.g., docker-compose or bare metal).

server {
    listen 4318;
    server_name _;

    # OTLP HTTP ingestion — no auth
    location / {
        proxy_pass http://otel-collector;
        proxy_set_header Host $host;
    }
}
