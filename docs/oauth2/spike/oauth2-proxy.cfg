# oauth2-proxy configuration for HyperDX OIDC authentication
#
# This config sits in front of HyperDX and handles OIDC authentication
# via Entra ID, Okta, or Google. It injects identity headers that the
# oidc-connection middleware reads to resolve ClickHouse connections.
#
# Deploy as: K8s Deployment + Service, or Docker container
# Docs: https://oauth2-proxy.github.io/oauth2-proxy/

# ---------------------------------------------------------------------------
# Core settings
# ---------------------------------------------------------------------------
http_address        = "0.0.0.0:4180"
reverse_proxy       = true
real_client_ip_header = "X-Forwarded-For"

# Cookie settings
cookie_name     = "_hyperdx_oauth2"
cookie_secure   = true
cookie_httponly  = true
cookie_samesite = "lax"
cookie_secret   = ""  # REQUIRED: generate with `openssl rand -base64 32`

# Where to send authenticated requests
upstreams = ["http://hyperdx-api:8080"]

# Email domain restriction (optional)
# email_domains = ["hypersec.io"]

# ---------------------------------------------------------------------------
# Identity headers forwarded to upstream (HyperDX API)
# ---------------------------------------------------------------------------
set_xauthrequest    = true    # Sets X-Auth-Request-User, X-Auth-Request-Email
pass_user_headers   = true    # Sets X-Forwarded-User, X-Forwarded-Email, X-Forwarded-Groups
pass_access_token   = false   # Don't forward the raw token
pass_authorization_header = false

# ---------------------------------------------------------------------------
# Provider: Microsoft Entra ID
# ---------------------------------------------------------------------------
# Uncomment this block for Entra ID deployments
#
# provider          = "entra-id"
# client_id         = "<app-registration-client-id>"
# client_secret     = "<app-registration-client-secret>"
# oidc_issuer_url   = "https://login.microsoftonline.com/<tenant-id>/v2.0"
# scope             = "openid email profile"
#
# Entra ID notes:
#   - Groups appear as object IDs (GUIDs) in X-Forwarded-Groups
#   - Enable groups claim: App Registration > Token Configuration > Add groups claim
#   - For >200 groups, add User.Read scope for Graph API overage handling:
#     scope = "openid email profile User.Read"

# ---------------------------------------------------------------------------
# Provider: Okta
# ---------------------------------------------------------------------------
# Uncomment this block for Okta deployments
#
# provider          = "oidc"
# client_id         = "<okta-app-client-id>"
# client_secret     = "<okta-app-client-secret>"
# oidc_issuer_url   = "https://<org>.okta.com"
# scope             = "openid email profile groups"
#
# Okta notes:
#   - Groups appear as display names in X-Forwarded-Groups
#   - Configure groups claim: Admin > Security > API > Authorization Servers > Claims
#   - Add claim: name=groups, value=getFilteredGroups(...), include in=id_token

# ---------------------------------------------------------------------------
# Provider: Google
# ---------------------------------------------------------------------------
# Uncomment this block for Google deployments
#
# provider          = "google"
# client_id         = "<google-oauth-client-id>"
# client_secret     = "<google-oauth-client-secret>"
# scope             = "openid email profile"
#
# Google notes:
#   - Google does NOT provide groups in OIDC tokens
#   - Use OIDC_EMAIL_CONNECTION_MAP on the HyperDX side for email-based mapping
#   - X-Forwarded-Email will be set, X-Forwarded-Groups will be empty

# ---------------------------------------------------------------------------
# Endpoints
# ---------------------------------------------------------------------------
# These paths are used by nginx auth_request
# /oauth2/auth    - returns 202 if authenticated, 401 if not
# /oauth2/start   - initiates the OIDC login flow
# /oauth2/callback - handles the OIDC callback
