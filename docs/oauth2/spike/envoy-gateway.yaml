# Envoy Gateway configuration for HyperDX with native OIDC authentication
#
# Replaces BOTH nginx-ingress AND oauth2-proxy with a single component.
# Envoy Gateway has built-in OIDC support via SecurityPolicy — no separate
# oauth2-proxy deployment required.
#
# Prerequisites:
#   - Envoy Gateway installed: https://gateway.envoyproxy.io/docs/install/
#   - GatewayClass "envoy-gateway" exists (created by Envoy Gateway install)
#   - HyperDX services deployed in the monitoring namespace
#
# Refs:
#   - https://gateway.envoyproxy.io/docs/tasks/security/oidc/
#   - https://developer.cyberark.com/blog/ingress-nginx-is-retiring-our-practical-journey-to-gateway-api/

---
# ---------------------------------------------------------------------------
# Gateway — entry point for all external traffic
# ---------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hyperdx-gateway
  namespace: monitoring
spec:
  gatewayClassName: envoy-gateway
  listeners:
    # HTTPS for UI and API (authenticated)
    - name: https
      protocol: HTTPS
      port: 443
      hostname: observability.hyperi.io
      tls:
        mode: Terminate
        certificateRefs:
          - name: hyperdx-tls
      allowedRoutes:
        namespaces:
          from: Same

---
# ---------------------------------------------------------------------------
# OIDC Secret — client credentials for the IdP
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: hyperdx-oidc-secret
  namespace: monitoring
type: Opaque
stringData:
  client-secret: "<your-oidc-client-secret>"

---
# ---------------------------------------------------------------------------
# SecurityPolicy — native OIDC authentication (replaces oauth2-proxy)
# ---------------------------------------------------------------------------
# Attach this to the HTTPRoute. Envoy Gateway handles the full OIDC flow:
#   - Redirects unauthenticated users to the IdP
#   - Validates tokens
#   - Extracts claims and forwards them as headers to upstream
#
# Supported providers: Entra ID, Okta, Google, any OIDC-compliant IdP
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: hyperdx-oidc
  namespace: monitoring
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: hyperdx-authenticated
  oidc:
    provider:
      # --- Entra ID ---
      issuer: "https://login.microsoftonline.com/<tenant-id>/v2.0"
      # --- Okta ---
      # issuer: "https://<org>.okta.com"
      # --- Google ---
      # issuer: "https://accounts.google.com"

    clientID: "<app-client-id>"
    clientSecret:
      name: hyperdx-oidc-secret
    scopes:
      - openid
      - email
      - profile
      # Okta: add "groups" scope
      # Entra ID: groups come via token config, no extra scope needed
    redirectURL: "https://observability.hyperi.io/oauth2/callback"
    logoutPath: "/oauth2/logout"

---
# ---------------------------------------------------------------------------
# HTTPRoute — authenticated routes (UI + API + ClickHouse proxy)
# ---------------------------------------------------------------------------
# The SecurityPolicy above attaches to this route, so all paths require
# OIDC authentication. Envoy injects identity headers before forwarding
# to HyperDX.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hyperdx-authenticated
  namespace: monitoring
spec:
  parentRefs:
    - name: hyperdx-gateway
  hostnames:
    - observability.hyperi.io
  rules:
    # HyperDX API (includes /clickhouse-proxy — where oidc-connection middleware runs)
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: hyperdx-api
          port: 8000
    # ClickHouse proxy (explicit route for clarity)
    - matches:
        - path:
            type: PathPrefix
            value: /clickhouse-proxy
      backendRefs:
        - name: hyperdx-api
          port: 8000
    # HyperDX UI (catch-all)
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: hyperdx-app
          port: 8080

---
# ---------------------------------------------------------------------------
# OTLP ingestion — internal only, no auth, no Gateway
# ---------------------------------------------------------------------------
# Pods push telemetry to this ClusterIP service directly on the cluster
# network. This must NOT be exposed through the Gateway.
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: monitoring
spec:
  type: ClusterIP
  ports:
    - name: otlp-grpc
      port: 4317
      targetPort: 4317
    - name: otlp-http
      port: 4318
      targetPort: 4318
  selector:
    app: otel-collector

---
# ---------------------------------------------------------------------------
# Header forwarding — Envoy filter to pass OIDC claims as X-Forwarded-*
# ---------------------------------------------------------------------------
# Envoy Gateway's OIDC filter sets claims on the request context. This
# EnvoyPatchPolicy extracts them into HTTP headers that the HyperDX
# oidc-connection middleware expects.
#
# Note: The exact mechanism depends on your Envoy Gateway version.
# In newer versions, SecurityPolicy may support extractFrom directly.
# If not, use an EnvoyPatchPolicy with a Lua filter:
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyPatchPolicy
metadata:
  name: oidc-header-forwarding
  namespace: monitoring
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: Gateway
    name: hyperdx-gateway
  type: JSONPatch
  jsonPatches:
    - type: "type.googleapis.com/envoy.config.listener.v3.Listener"
      name: monitoring/hyperdx-gateway/https
      operation:
        op: add
        path: "/filter_chains/0/filters/0/typed_config/http_filters/0"
        value:
          name: envoy.filters.http.lua
          typed_config:
            "@type": "type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua"
            inline_code: |
              -- Extract OIDC claims from JWT and set as X-Forwarded-* headers
              -- These headers are read by the HyperDX oidc-connection middleware
              function envoy_on_request(request_handle)
                local jwt = request_handle:streamInfo():dynamicMetadata():get("envoy.filters.http.jwt_authn")
                if jwt then
                  local email = jwt["email"]
                  local groups = jwt["groups"]
                  local user = jwt["preferred_username"] or jwt["sub"]

                  if user then
                    request_handle:headers():add("X-Forwarded-User", user)
                  end
                  if email then
                    request_handle:headers():add("X-Forwarded-Email", email)
                  end
                  if groups then
                    -- groups may be a table (array) — join with commas
                    if type(groups) == "table" then
                      request_handle:headers():add("X-Forwarded-Groups", table.concat(groups, ","))
                    else
                      request_handle:headers():add("X-Forwarded-Groups", tostring(groups))
                    end
                  end
                end
              end
