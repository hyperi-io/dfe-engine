# Project:   DFE Engine
# File:      .github/workflows/pr-base-guard.yml
# Purpose:   Fast pull-request guards: a base that is not main, and a stray gitlink
#
# License:   BUSL-1.1
# Copyright: (c) 2026 HYPERI PTY LIMITED

name: PR fast guards

"on":
  pull_request:
    branches: ["**"]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  pr-base:
    name: PR base
    runs-on: ubuntu-latest
    steps:
      - name: Require a base of main
        # ci.yml fires pull_request only for a base of main and a skipped required check counts as satisfied, so a stacked PR reads green with nothing run.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          if [ "$BASE_REF" = "main" ]; then
            echo "Base is main -- ci.yml runs Quality, Test, Build and Commit messages for this PR."
            exit 0
          fi

          {
            echo "### This PR has not been checked"
            echo
            echo "Base branch: \`$BASE_REF\`."
            echo
            echo "\`.github/workflows/ci.yml\` fires \`pull_request\` only for a base of \`main\`."
            echo "This PR gets the branch \`push\` run instead, which plans \`run-checks=false\`,"
            echo "so Quality, Test, Build and Commit messages all report \`skipped\` and the run"
            echo "still concludes \`success\`. A skipped required check also counts as satisfied."
            echo
            echo "Retarget to main before review or merge: \`gh pr edit <number> --base main\`,"
            echo "then push the branch so the \`pull_request\` run actually fires."
            echo
            echo "Stacking rules: see \`CONTRIBUTING.md\`, \"Stacked pull requests\"."
          } >> "$GITHUB_STEP_SUMMARY"

          echo "::error title=PR base is not main::This PR targets '$BASE_REF', so ci.yml never ran -- Quality, Test, Build and Commit messages are skipped, not passed. Retarget to main and push before review or merge."
          exit 1

  gitlink:
    name: No gitlink
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Refuse a mode-160000 index entry
        # tests/unit/test_index_has_no_gitlink.py asserts the same property, but inside the 2h26m suite; a gitlink breaks the release checkout's credential cleanup, so the report has to arrive before then.
        run: |
          set -euo pipefail

          # Split on TAB: the path follows one, and awk's default FS would break
          # a path containing a space into fields.
          gitlinks="$(git ls-files --stage | awk -F'\t' '$1 ~ /^160000 / { print $2 }')"

          if [ -z "$gitlinks" ]; then
            echo "No index entry is a gitlink."
            exit 0
          fi

          # Flattened: GitHub reads only the first line of an ::error, so a second
          # gitlink and the hint itself would drop out of the annotation.
          echo "::error title=Gitlink in the index::$(echo "$gitlinks" | tr '\n' ' ')-- remove with git rm --cached <path>; actions/checkout's post-job credential cleanup fails on a gitlink with no .gitmodules, which killed the release publish twice (#367)."
          exit 1
