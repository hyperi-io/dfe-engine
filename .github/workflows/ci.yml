name: CI

"on":
  push:
    branches: ["**"]
  pull_request:
    # A PR based on any other branch gets no run here, and pr-base-guard.yml fails it so the absence is visible.
    branches: [main]
  schedule:
    # Nightly at 02:37 AEST: hyperi-ci runs a schedule at the full tier, which adds the integration tests core deselects, and publishes nothing.
    - cron: "37 16 * * *"
  workflow_dispatch:
    inputs:
      tag:
        type: string
        required: false
        default: ""
        description: "Tag to re-publish (existing tag). Omit + set from-head to release HEAD."
      from-head:
        type: string
        required: false
        default: ""
        description: "'true' to release/retry the current HEAD -- the CI creates the tag (issue #35)."
      bump:
        type: string
        required: false
        default: "auto"
        description: "Version resolution for from-head: auto | patch | minor (forced) | X.Y.Z (exact version)."
      test-tier:
        type: choice
        required: false
        default: "core"
        options: [core, full]
        description: "full also runs the tests core deselects (integration, e2e). core never lowers a scheduled run."

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  ci:
    uses: hyperi-io/hyperi-ci/.github/workflows/python-ci.yml@refactor/s4-setup-runtime-switch-v2
    with:
      tag: ${{ inputs.tag || '' }}
      from-head: ${{ inputs.from-head || '' }}
      bump: ${{ inputs.bump || 'auto' }}
      test-tier: ${{ inputs.test-tier || 'core' }}
      runner-test: arc-native-16cpu
      # The producer-contract pin checks read GitHub; anonymous calls from shared runners hit the rate limit.
      test-github-token: true
    secrets: inherit
