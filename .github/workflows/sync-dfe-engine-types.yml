# Project:      dfe-engine
# File:         .github/workflows/sync-dfe-engine-types.yml
# Purpose:      Sync the OpenAPI specs to the dfe-ui types package
#
# How it runs and what it needs: docs/control-plane/type-safety-sync.md.

name: Sync dfe-engine-types

on:
  push:
    branches: ["main", "master"]
    paths:
      - "openapi/openapi.json"
      - "openapi/openapi.e2e.json"
  workflow_dispatch:

jobs:
  push-to-dfe-ui:
    name: Create PR in dfe-ui (OpenAPI)
    permissions:
      pull-requests: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 26.13.0

      # Node 25 and later no longer bundle Corepack. Yarn's version comes from dfe-ui's packageManager pin.
      - name: Enable Yarn via Corepack
        run: npm install -g corepack@0.36.0 && corepack enable

      - name: Resolve the dfe-ui repo
        id: target
        env:
          DFE_UI_REPO: ${{ vars.DFE_UI_REPO || 'hyperi-io/dfe-ui' }}
        run: |
          echo "owner=${DFE_UI_REPO%%/*}" >> "$GITHUB_OUTPUT"
          echo "name=${DFE_UI_REPO#*/}" >> "$GITHUB_OUTPUT"

      - name: Mint a dfe-ui token from the GitHub App
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create PR with dfe-engine-types sync in dfe-ui
        env:
          DFE_UI_TOKEN: ${{ steps.app-token.outputs.token }}
          DFE_UI_REPO: ${{ vars.DFE_UI_REPO || 'hyperi-io/dfe-ui' }}
        run: |
          set -e
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git clone --depth 1 "https://x-access-token:${DFE_UI_TOKEN}@github.com/${DFE_UI_REPO}.git" dfe-ui
          cd dfe-ui
          mkdir -p packages/dfe-engine-types/specs
          cp ../openapi/openapi.json packages/dfe-engine-types/specs/openapi.json
          cp ../openapi/openapi.e2e.json packages/dfe-engine-types/specs/openapi.e2e.json
          cd packages/dfe-engine-types && yarn install --immutable && yarn generate
          cd "$GITHUB_WORKSPACE/dfe-ui"
          git add packages/dfe-engine-types/

          if git diff --staged --quiet; then
            echo "dfe-engine-types unchanged, no PR needed"
            exit 0
          fi

          # Close any prior auto-sync PRs so only one types sync PR is open at a time
          export GH_TOKEN="${DFE_UI_TOKEN}"
          while IFS= read -r pr_num; do
            [ -z "$pr_num" ] && continue
            gh pr close "$pr_num" --repo "${DFE_UI_REPO}" --delete-branch \
              --comment "Superseded by newer dfe-engine-types sync from ${{ github.repository }}@${{ github.sha }}."
          # Pipe to system jq -- do not use "gh ... --jq -r ..." (-r is parsed as gh flags, not jq -r)
          done < <(gh pr list --repo "${DFE_UI_REPO}" --state open --limit 100 --json number,headRefName \
            | jq -r '.[] | select(.headRefName | startswith("sync-dfe-engine-types-") or startswith("sync-openapi-spec-")) | .number')

          BRANCH_NAME="sync-dfe-engine-types-$(echo ${{ github.sha }} | cut -c1-7)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore(dfe-engine-types): sync from dfe-engine

          Auto-generated from ${{ github.repository }}@${{ github.sha }}"
          git push origin "$BRANCH_NAME"
          gh pr create \
            --repo "${DFE_UI_REPO}" \
            --head "$BRANCH_NAME" \
            --title "chore(dfe-engine-types): sync from dfe-engine" \
            --body "Auto-generated from ${{ github.repository }}@${{ github.sha }}

          This PR syncs openapi.json and openapi.e2e.json from the dfe-engine repository."
