# DFE Engine Default Configuration
# This file provides default values for all configuration options.
# Values can be overridden via environment variables or config files.
# Environment variables take precedence: ENV > config file > defaults

# ClickHouse connection settings
clickhouse:
  host: "localhost"
  # The HTTP port: the client is clickhouse-connect over HTTP, never native 9000.
  port: 8123
  username: "default"
  password: ""
  database: "default"
  secure: true
  # null -> follow the SCALO_TLS_VERIFY escape valve (cert verification ON by
  # default). Set false (DFE_CLICKHOUSE_VERIFY) only for self-signed dev/test CH.
  verify: null
  connections_min: 10
  connections_max: 300

# Hunt scheduler settings
hunts:
  log_path: "hunt_log_path"
  checkpoint_path: ""
  cron_task_timeout: 300

# Artifactory settings for downloading templates
artifactory:
  url: ""
  username: ""
  password: ""
  templates_version: "latest"

# Kafka connection settings
kafka:
  bootstrap_servers: "localhost:9092"
  security_protocol: "PLAINTEXT"

# Storage settings for artifacts and templates
# Supports local filesystem, S3, and HTTP backends
# Type is auto-detected from path if set to "auto":
#   - s3://bucket/path -> S3 backend
#   - http(s)://... -> HTTP backend
#   - /path or ./path -> Local filesystem
storage:
  type: "auto"
  path: "./artifacts"
  s3_bucket: ""
  s3_region: ""

# Authorization settings
auth:
  # ON, to match env's default "production" posture. With it off, api/deps.py
  # hands an unauthenticated request the admin role -- so the previous
  # production + auth-off default granted anonymous admin out of the box.
  # Dev and test set DFE_AUTH_ENABLED=false together with a dev DFE_ENV.
  enabled: true
  local:
    enabled: true
    admin_name: "admin"
    admin_password: "changeme"
    operator_password: "changeme"
    viewer_password: "changeme"
    org_id: "default"
