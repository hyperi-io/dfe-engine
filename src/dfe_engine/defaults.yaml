# Defaults under a config file and the environment: settings.py is the reference.

clickhouse:
  host: "localhost"
  # The HTTP port: the client is clickhouse-connect over HTTP, never native 9000.
  port: 8123
  username: "default"
  password: ""
  database: "default"
  secure: true
  # null follows SCALO_TLS_VERIFY, which verifies by default.
  verify: null
  connections_max: 300

artifactory:
  url: ""
  username: ""
  password: ""
  templates_version: "latest"

kafka:
  bootstrap_servers: "localhost:9092"
  security_protocol: "PLAINTEXT"

# auto picks S3, HTTP or the local filesystem from the path's scheme.
storage:
  type: "auto"
  path: "./artifacts"
  s3_region: ""

auth:
  # Off hands an anonymous request the admin role, so it stays on outside dev.
  enabled: true
  local:
    enabled: true
    admin_name: "admin"
    admin_password: "changeme"
