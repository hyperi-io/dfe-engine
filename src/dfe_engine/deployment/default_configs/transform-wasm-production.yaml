# DFE Transform WASM — Production Deployment
# KEDA enabled, medium sizing, autoscaling

size: medium
replicas: 2
image: ghcr.io/hyperi-io/dfe-transform-wasm
image_tag: latest

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

keda:
  enabled: true
  min_replicas: 2
  max_replicas: 8
  polling_interval: 30
  cooldown_period: 300
  kafka_trigger: null
  cpu_trigger: null
  fallback_replicas: 2

hpa:
  enabled: false
  min_replicas: 1
  max_replicas: 8
  target_cpu_percent: 80

pod:
  annotations: {}
  labels: {}
  node_selector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 8080
  metrics_port: 9090

config_secret:
  name: ""
  key: ""

extra_env: {}

source_file_volumes: []
