# DFE Fetcher -- Production Deployment
# KEDA disabled (no Kafka consumer trigger), small sizing

size: small
replicas: 2
image: ghcr.io/hyperi-io/dfe-fetcher
image_tag: latest

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

keda:
  enabled: false
  min_replicas: 1
  max_replicas: 4
  polling_interval: 30
  cooldown_period: 300
  kafka_trigger: null
  cpu_trigger: null
  fallback_replicas: 2

hpa:
  enabled: false
  min_replicas: 1
  max_replicas: 4
  target_cpu_percent: 80

pod:
  annotations: {}
  labels: {}
  node_selector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 8080
  metrics_port: 9090

config_secret:
  name: ""
  key: ""

extra_env: {}

source_file_volumes: []
