# DFE Transform Vector — Development Deployment
# KEDA disabled, xs sizing, single replica

size: xs
replicas: 1
image: harbor.hyperi.io/dfe/dfe-transform-vector
image_tag: latest

resources:
  requests:
    cpu: "250m"
    memory: "512Mi"
  limits:
    cpu: "500m"
    memory: "1Gi"

keda:
  enabled: false
  min_replicas: 1
  max_replicas: 8
  polling_interval: 30
  cooldown_period: 300
  kafka_trigger:
    consumer_group: dfe-transform-vector
    topic: ""
    lag_threshold: 500
    authentication_ref: ""
  cpu_trigger: null
  fallback_replicas: 2

hpa:
  enabled: false
  min_replicas: 1
  max_replicas: 4
  target_cpu_percent: 80

pod:
  annotations: {}
  labels: {}
  node_selector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 8080
  metrics_port: 9090

config_secret:
  name: ""
  key: ""

extra_env: {}

extra_yaml_volumes: []
source_file_volumes: []
