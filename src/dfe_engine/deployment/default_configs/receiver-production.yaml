# DFE Receiver — Production Deployment
# KEDA enabled, small sizing (500m-1 CPU, 1Gi-2Gi mem)

size: small
replicas: 2
image: ghcr.io/hyperi-io/dfe-receiver
image_tag: latest

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "2Gi"

keda:
  enabled: true
  min_replicas: 2
  max_replicas: 10
  polling_interval: 30
  cooldown_period: 300
  kafka_trigger: null
  cpu_trigger: null
  fallback_replicas: 2

hpa:
  enabled: false
  min_replicas: 1
  max_replicas: 4
  target_cpu_percent: 80

pod:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
  labels: {}
  node_selector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 8080
  metrics_port: 9090

config_secret:
  name: dfe-receiver-secrets
  key: config.yaml

extra_env: {}
