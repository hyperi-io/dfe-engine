# DFE Loader — Production Deployment
# KEDA enabled, medium sizing (1-2 CPU, 2Gi-4Gi mem)

size: medium
replicas: 2
image: ghcr.io/hyperi-io/dfe-loader
image_tag: latest

resources:
  requests:
    cpu: "1"
    memory: "2Gi"
  limits:
    cpu: "2"
    memory: "4Gi"

keda:
  enabled: true
  min_replicas: 2
  max_replicas: 8
  polling_interval: 30
  cooldown_period: 300
  kafka_trigger: null
  cpu_trigger: null
  fallback_replicas: 2

hpa:
  enabled: false
  min_replicas: 1
  max_replicas: 4
  target_cpu_percent: 80

pod:
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "9090"
    prometheus.io/path: /metrics
  labels: {}
  node_selector: {}
  tolerations: []
  affinity: {}

service:
  type: ClusterIP
  port: 9000
  metrics_port: 9090

config_secret:
  name: dfe-loader-secrets
  key: config.yaml

extra_env: {}
