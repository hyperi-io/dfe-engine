service: dfe-archiver
description: "Kafka-to-object-storage archiver with compression"
config_surface:
  config.kafka.bootstrap_servers:
    type: string
    description: "Kafka bootstrap servers"
  config.kafka.group_id:
    type: string
    description: "Kafka consumer group ID"
    default: "dfe-archiver"
  config.storage.backend:
    type: string
    description: "Storage backend (s3, minio, gcs, azure, file)"
    default: "s3"
  config.storage.bucket:
    type: string
    description: "Target bucket or directory"
  config.storage.prefix:
    type: string
    description: "Object key prefix"
    default: ""
  config.compression.codec:
    type: string
    description: "Compression codec (zstd, lz4, snappy, none)"
    default: "zstd"
  config.compression.level:
    type: integer
    description: "Compression level"
    default: 3
  config.archive.max_file_bytes:
    type: integer
    description: "Maximum archive file size before roll"
    default: 268435456
  config.archive.max_age_seconds:
    type: integer
    description: "Maximum archive file age before roll"
    default: 300
metrics_surface:
  - name: files_created_total
    type: counter
    group: custom
    description: "Total archive files created"
  - name: files_closed_total
    type: counter
    group: custom
    description: "Total archive files closed (rolled)"
  - name: archive_roll_total
    type: counter
    group: custom
    description: "Archive file roll events by trigger"
    labels:
      - trigger
  - name: archive_file_size_bytes
    type: histogram
    group: custom
    description: "Final compressed archive file sizes at roll time"
  - name: hot_buffers_active
    type: gauge
    group: custom
    description: "Number of active hot buffers"
  - name: hot_buffers_bytes
    type: gauge
    group: custom
    description: "Total bytes in hot buffers"
  - name: compression_ratio
    type: gauge
    group: custom
    description: "Running compression ratio (compressed/uncompressed)"
  - name: compression_duration_seconds
    type: histogram
    group: custom
    description: "Time to compress a buffer flush"
  - name: bytes_compressed_total
    type: counter
    group: custom
    description: "Total bytes written (post-compression)"
  - name: pipeline_last_batch_timestamp_seconds
    type: gauge
    group: custom
    description: "Unix timestamp of last completed batch"
