service: dfe-archiver
description: "Kafka-to-object-storage archiver with compression"
config_surface:
  config.kafka.bootstrap_servers:
    type: string
    description: "Kafka bootstrap servers"
  config.kafka.group_id:
    type: string
    description: "Kafka consumer group ID"
    default: "dfe-archiver"
  config.storage.backend:
    type: string
    description: "Storage backend (s3, minio, gcs, azure, file)"
    default: "s3"
  config.storage.bucket:
    type: string
    description: "Target bucket or directory"
  config.storage.prefix:
    type: string
    description: "Object key prefix"
    default: ""
  config.compression.codec:
    type: string
    description: "Compression codec (zstd, lz4, snappy, none)"
    default: "zstd"
  config.compression.level:
    type: integer
    description: "Compression level"
    default: 3
  config.archive.max_file_bytes:
    type: integer
    description: "Maximum archive file size before roll"
    default: 268435456
  config.archive.max_age_seconds:
    type: integer
    description: "Maximum archive file age before roll"
    default: 300
metrics_surface:
  - name: dfe_archiver_files_created_total
    type: counter
    group: sink
    description: "Total archive files created"
  - name: dfe_archiver_files_closed_total
    type: counter
    group: sink
    description: "Total archive files closed and uploaded"
  - name: dfe_archiver_archive_roll_total
    type: counter
    group: buffer
    description: "Archive file roll events"
    labels:
      - trigger
  - name: dfe_archiver_archive_file_size_bytes
    type: histogram
    group: sink
    description: "Archive file sizes at close"
  - name: dfe_archiver_hot_buffers_active
    type: gauge
    group: buffer
    description: "Number of active hot buffers"
  - name: dfe_archiver_hot_buffers_bytes
    type: gauge
    group: buffer
    description: "Total bytes across active hot buffers"
  - name: dfe_archiver_compression_ratio
    type: gauge
    group: app
    description: "Current compression ratio"
  - name: dfe_archiver_compression_duration_seconds
    type: histogram
    group: app
    description: "Compression operation latency"
  - name: dfe_archiver_bytes_compressed_total
    type: counter
    group: app
    description: "Total bytes compressed"
  - name: dfe_archiver_pipeline_last_batch_timestamp_seconds
    type: gauge
    group: app
    description: "Timestamp of most recent batch (staleness detection)"
manifest_url: "http://dfe-archiver.dfe-prod.svc.cluster.local:9090/metrics/manifest"
