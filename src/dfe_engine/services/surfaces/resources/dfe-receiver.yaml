service: dfe-receiver
description: "High-throughput Rust ingest endpoint"
config_surface:
  config.kafka.bootstrap_servers:
    type: string
    description: "Kafka bootstrap servers"
  config.server.listen_address:
    type: string
    description: "HTTP listen address"
    default: "0.0.0.0:8080"
  config.buffer.max_bytes:
    type: integer
    description: "Buffer size limit in bytes"
    default: 67108864
  config.server.max_body_bytes:
    type: integer
    description: "Maximum request body size in bytes"
    default: 10485760
  config.otlp.enabled:
    type: boolean
    description: "Enable OTLP ingest endpoint"
    default: false
metrics_surface:
  - name: records_received_total
    type: counter
    group: platform
    description: "Records received from all sources"
