service: dfe-receiver
description: "High-throughput Rust ingest endpoint"
config_surface:
  config.kafka.brokers:
    type: array
    description: "Kafka broker addresses, as host:port"
    default: []
  config.server.bind_address:
    type: string
    description: "HTTP listen address"
    default: "0.0.0.0:8080"
  config.buffer.memory_limit:
    type: integer
    description: "Buffer memory limit in bytes. 0 sizes it from the container's memory limit"
    default: 0
  config.server.max_body_size:
    type: integer
    description: "Maximum request body size in bytes"
    default: 10485760
  config.otlp.enabled:
    type: boolean
    description: "Enable OTLP ingest endpoint"
    default: false
metrics_surface:
  - name: records_received_total
    type: counter
    group: platform
    description: "Records received from all sources"
