service: dfe-receiver
description: "High-throughput Rust ingest endpoint"
config_surface:
  config.kafka.bootstrap_servers:
    type: string
    description: "Kafka bootstrap servers"
  config.server.listen_address:
    type: string
    description: "HTTP listen address"
    default: "0.0.0.0:8080"
  config.buffer.max_bytes:
    type: integer
    description: "Buffer size limit in bytes"
    default: 67108864
  config.server.max_body_bytes:
    type: integer
    description: "Maximum request body size in bytes"
    default: 10485760
  config.otlp.enabled:
    type: boolean
    description: "Enable OTLP ingest endpoint"
    default: false
metrics_surface:
  - name: dfe_receiver_requests_total
    type: counter
    group: app
    description: "Total requests received"
    labels:
      - transport
  - name: dfe_receiver_request_duration_seconds
    type: histogram
    group: app
    description: "Request processing latency"
    labels:
      - transport
  - name: dfe_receiver_active_connections
    type: gauge
    group: app
    description: "Current active connections"
    labels:
      - transport
  - name: dfe_receiver_body_size_rejected_total
    type: counter
    group: app
    description: "Requests rejected for oversized body"
  - name: dfe_receiver_messages_spilled_total
    type: counter
    group: app
    description: "Messages spilled to disk spool"
  - name: dfe_receiver_messages_drained_total
    type: counter
    group: app
    description: "Messages drained from disk spool"
manifest_url: "http://dfe-receiver.dfe-prod.svc.cluster.local:8080/metrics/manifest"
