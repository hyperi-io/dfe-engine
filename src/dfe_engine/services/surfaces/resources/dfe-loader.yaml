service: dfe-loader
description: "Kafka-to-ClickHouse batch loader"
config_surface:
  config.kafka.bootstrap_servers:
    type: string
    description: "Kafka bootstrap servers"
  config.kafka.group_id:
    type: string
    description: "Kafka consumer group ID"
    default: "dfe-loader"
  config.clickhouse.host:
    type: string
    description: "ClickHouse host"
    default: "localhost"
  config.clickhouse.port:
    type: integer
    description: "ClickHouse native port"
    default: 9000
  config.clickhouse.database:
    type: string
    description: "Target ClickHouse database"
    default: "default"
  config.buffer.max_bytes:
    type: integer
    description: "Per-table buffer size limit in bytes"
    default: 67108864
  config.buffer.max_age_seconds:
    type: integer
    description: "Maximum buffer age before flush"
    default: 10
metrics_surface:
  - name: rows_inserted_total
    type: counter
    group: custom
    description: "Total rows inserted to ClickHouse"
  - name: batches_flushed_total
    type: counter
    group: custom
    description: "Total batches flushed to ClickHouse"
  - name: clickhouse_insert_duration_seconds
    type: histogram
    group: custom
    description: "ClickHouse insert batch latency"
  - name: buffer_records
    type: gauge
    group: buffer
    description: "Current buffered record count"
  - name: buffer_bytes
    type: gauge
    group: buffer
    description: "Current buffer size in bytes"
  - name: dfe_loader_routing_field_absent_total
    type: counter
    group: custom
    description: "Records on a source topic that named no table and fell back to the default"
