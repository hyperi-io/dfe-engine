service: dfe-loader
description: "Kafka-to-ClickHouse batch loader"
config_surface:
  config.kafka.brokers:
    type: array
    description: "Kafka broker addresses, as host:port"
    default: ["localhost:9092"]
  config.kafka.group:
    type: string
    description: "Kafka consumer group"
    default: "dfe-loader"
  config.clickhouse.hosts:
    type: array
    description: "ClickHouse HTTP endpoints, as host:port. The loader refuses the native protocol"
    default: ["localhost:8123"]
  config.clickhouse.database:
    type: string
    description: "Target ClickHouse database"
    default: "dfe"
  config.buffer.flush_bytes:
    type: integer
    description: "Buffered bytes that trigger a flush"
    default: 1048576
  config.buffer.flush_age_secs:
    type: integer
    description: "Maximum buffer age before a flush, in seconds"
    default: 5
metrics_surface:
  - name: rows_inserted_total
    type: counter
    group: custom
    description: "Total rows inserted to ClickHouse"
  - name: batches_flushed_total
    type: counter
    group: custom
    description: "Total batches flushed to ClickHouse"
  - name: clickhouse_insert_duration_seconds
    type: histogram
    group: custom
    description: "ClickHouse insert batch latency"
  - name: buffer_records
    type: gauge
    group: buffer
    description: "Current buffered record count"
  - name: buffer_bytes
    type: gauge
    group: buffer
    description: "Current buffer size in bytes"
  - name: dfe_loader_routing_field_absent_total
    type: counter
    group: custom
    description: "Records on a source topic that named no table and fell back to the default"
