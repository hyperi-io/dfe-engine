# DFE Receiver -- Production (K8s)
# TLS + bearer auth, K8s service DNS, tuned for throughput
#
# K8s resource sizing (medium):
#   requests: { cpu: 500m, memory: 512Mi }
#   limits:   { cpu: 2000m, memory: 1Gi }
# KEDA scaling:
#   min_replicas: 2
#   max_replicas: 10
#   trigger: kafka consumer lag on dfe_receiver_dlq (threshold: 100)

server:
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760  # 10 MB
  request_timeout_ms: 30000
  tls:
    enabled: true
    cert_file: /etc/tls/tls.crt
    key_file: /etc/tls/tls.key
    ca_file: /etc/tls/ca.crt
    client_auth: none
    refresh_interval_secs: 3600
  auth:
    mode: bearer
    accepted_headers:
      - name: x-hyperi-agent
        values: ["1.0"]
    bearer:
      secret_source: "vault:secret/dfe/receiver:bearer_tokens"
      refresh_interval_secs: 300

grpc:
  enabled: false
  bind_address: "0.0.0.0:6000"

validation:
  require_json: true
  required_fields: []
  dlq_on_invalid: true

routing:
  source_rules: []  # compiled from Source definitions by the engine
  default_source: main
  topic_suffix: _land
  source_to_topic: {}
  dlq:
    enabled: true
    topic: dfe_receiver_dlq

destinations:
  default: kafka
  rules: []

kafka:
  brokers:
    - kafka-bootstrap.kafka.svc.cluster.local:9092
  client_id: dfe-receiver
  sasl:
    enabled: true
    mechanism: scram_sha_512
    username: ""
    password: ""
  tls:
    enabled: true
    ca_file: /etc/tls/kafka-ca.crt
  producer:
    batch_size: 8388608  # 8 MB
    batch_messages: 10000
    linger_ms: 20
    compression: lz4
    acks: all
    retries: 5

loader:
  address: "dfe-loader.dfe.svc.cluster.local:6000"
  transport: kafka
  timeout_ms: 20000  # inside the 25 s a listener holds its answer

buffer:
  memory_limit: 0  # auto-detect from K8s cgroup limits
  pressure_threshold: 0.85

metrics:
  enabled: true
  address: "0.0.0.0:9090"
  path: /metrics
