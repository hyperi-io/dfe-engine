# DFE Receiver -- Production (K8s)
# TLS + bearer auth, tuned for throughput
#
# K8s resource sizing (medium):
#   requests: { cpu: 500m, memory: 512Mi }
#   limits:   { cpu: 2000m, memory: 1Gi }
# KEDA scaling:
#   min_replicas: 2
#   max_replicas: 10
#   trigger: kafka consumer lag on dfe_receiver_dlq (threshold: 100)

server:
  bind_address: "0.0.0.0:8080"
  max_body_size: 10485760  # 10 MB
  request_timeout_ms: 30000
  tls:
    enabled: true
    cert_file: /etc/tls/tls.crt
    key_file: /etc/tls/tls.key
    ca_file: /etc/tls/ca.crt
    client_auth: none
    refresh_interval_secs: 3600
  # Each bearer listener reads the <id>:<token> lines the engine writes for every
  # ingest credential it accepts, under the engine's KV mount (DFE_SECRETS_MOUNT).
  auth:
    mode: bearer
    bearer:
      secret_source: "vault:dfe/ingest/bearer-tokens/http:value"
      refresh_interval_secs: 60

grpc:  # bind_address is the receiver's own default
  enabled: false
  auth:
    mode: bearer
    bearer:
      secret_source: "vault:dfe/ingest/bearer-tokens/grpc:value"
      refresh_interval_secs: 60

otlp:
  enabled: false
  auth:
    mode: bearer
    bearer:
      secret_source: "vault:dfe/ingest/bearer-tokens/otlp:value"
      refresh_interval_secs: 60

splunk_hec:
  enabled: false
  auth:
    mode: bearer
    bearer:
      secret_source: "vault:dfe/ingest/bearer-tokens/splunk_hec:value"
      refresh_interval_secs: 60

prometheus_rw:
  enabled: false
  auth:
    mode: bearer
    bearer:
      secret_source: "vault:dfe/ingest/bearer-tokens/prometheus_rw:value"
      refresh_interval_secs: 60

validation:
  require_json: true
  required_fields: []
  dlq_on_invalid: true

# The rules and ingest_bindings sections are compiled by the engine from the
# Source definitions and the ingest credentials.
routing:
  default_source: main
  default_org_id: default
  topic_suffix: _land
  source_to_topic: {}
  dlq:
    enabled: true
    topic: dfe_receiver_dlq

destinations:
  default: kafka

kafka:
  brokers: []  # every deployment names its own brokers
  client_id: dfe-receiver
  sasl:
    enabled: true
    mechanism: scram_sha_512
    username: ""
    password: ""
  tls:
    enabled: true
    ca_file: /etc/tls/kafka-ca.crt
  producer:
    batch_size: 8388608  # 8 MB
    batch_messages: 10000
    linger_ms: 20
    compression: lz4
    acks: all
    retries: 5

loader:  # address is the app manifest's loader push listener
  transport: kafka
  timeout_ms: 20000  # inside the 25 s a listener holds its answer

buffer:
  memory_limit: 0  # auto-detect from K8s cgroup limits
  pressure_threshold: 0.85

metrics:
  enabled: true
  address: "0.0.0.0:9090"
  path: /metrics
