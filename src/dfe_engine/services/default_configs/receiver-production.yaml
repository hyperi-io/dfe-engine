# DFE Receiver -- Production (K8s)
# TLS on the HTTP listener, SASL+TLS to Kafka. Each bearer listener's auth block
# is added when the file is seeded, on the engine's own secrets backend.

server:
  tls:
    enabled: true
    cert_file: /etc/tls/tls.crt
    key_file: /etc/tls/tls.key
    ca_file: /etc/tls/ca.crt

kafka:
  sasl:
    enabled: true
    mechanism: scram_sha_512
    username: ""
    password: ""
  tls:
    enabled: true
    ca_file: /etc/tls/kafka-ca.crt

buffer:
  pressure_threshold: 0.85
