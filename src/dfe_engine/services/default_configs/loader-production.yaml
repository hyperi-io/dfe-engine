# DFE Loader -- Production (K8s)
# Tuned buffers, SASL+TLS, JSON logging

# Transport: kafka or grpc.
transport: kafka

kafka:
  brokers: []  # every deployment names its own brokers
  group: dfe-loader
  topics: []  # empty = auto-discover every *_load / *_land topic
  client_id: dfe-loader
  sasl:
    enabled: true
    mechanism: scram_sha_512
    username: ""
    password: ""
  tls:
    enabled: true
    ca_cert_file: /etc/tls/kafka-ca.crt

# HTTP on 8123, never native 9000: the loader's ClickHouse client has no TCP row fetch.
clickhouse:
  hosts: []  # every deployment names its own HTTP endpoints
  database: default
  username: default
  password: ""
  protocol: http

# dfe-loader's RoutingConfig keys only: serde ignores any other key without an error.
routing:
  table_fields:
    - _source
  default_db: dfe
  default_table: main
  org_id_field: _org_id
  default_org_id: default
  org_routes: []
  source_to_table: {}
  topic_suffixes:
    - _land
    - _load
  dlq:
    enabled: true
    topic: dfe_loader_dlq
    topic_suffix: .dlq

buffer:
  flush_bytes: 4194304  # 4 MB
  flush_rows: 50000
  flush_age_secs: 5

memory:
  limit_bytes: 0  # auto-detect from K8s cgroup limits
  pressure_threshold: 0.8

metrics:
  enabled: true
  address: "0.0.0.0:9090"

logging:
  level: info
  format: json

timestamp_dq:
  enabled: true
  max_future_seconds: 600
  max_past_seconds: 0
  invalid_action: replace_with_now
  correct_known_bad: true

field_sanitization:
  strip_at_prefix: true
  handle_numeric_prefix: true
  numeric_prefix: col_
  collapse_underscores: true
  trim_underscores: true
  collision_strategy: last_wins

metadata:
  inject_timestamp_load: true
  extract_timestamp_collector: true
  collector_timestamp_path: tags.collector.timestamp
  tags_fields:
    - tags
    - _tags
    - meta
    - metadata.tags
  tags_output: _tags
  drop_tags: false
  json_output: _json
  capture_raw: true
  raw_source_fields: []
  raw_output: _raw
  remove_routing_fields: true

schema:
  cache_ttl_secs: 300
  refresh_on_error: true
