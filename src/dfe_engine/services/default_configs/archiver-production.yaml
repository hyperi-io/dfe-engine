# DFE Archiver -- Production (K8s)
# S3 archive destination, large buffers, SASL+TLS, tuned compression

kafka:
  brokers: []  # every deployment names its own brokers
  group_id: dfe-archiver
  batch_size: 10000
  max_poll_interval_ms: 300000
  session_timeout_ms: 30000
  security_protocol: SASL_SSL
  sasl_mechanism: SCRAM-SHA-512
  sasl_username: ""
  sasl_password: ""

archive:
  destination: "s3://dfe-archive"
  path_template: "{year}/{month}/{day}/{hour}"
  file_extension: jsonl
  roll_size_bytes: 1073741824
  s3:
    region: ""
    bucket: dfe-archive

buffer:
  flush_bytes: 134217728
  flush_age_secs: 60
  flush_records: 100000
  writer_parallelism: 8

compression:
  codec: zstd
  level: 6  # higher compression for cold storage
  enabled: true
