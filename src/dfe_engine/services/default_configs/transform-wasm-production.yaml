# DFE Transform WASM -- Production defaults
# Kafka-to-Kafka transform using WASM modules

kafka:
  consumer:
    brokers: []  # every deployment names its own brokers
    group: dfe-transform-wasm
    topics: []
    client_id: dfe-transform-wasm
    sasl:
      enabled: true
      mechanism: scram_sha_512
      username: ""
      password: ""
    tls:
      enabled: true
  producer:
    brokers: []  # every deployment names its own brokers
    client_id: dfe-transform-wasm
    compression: lz4
    batch_size: 8388608
    linger_ms: 20
    sasl:
      enabled: true
      mechanism: scram_sha_512
      username: ""
      password: ""
    tls:
      enabled: true

sources: []

extra_env: {}

ipc:
  enabled: false
  transport: memory
  address: ""

memory:
  limit_bytes: 2147483648
  pressure_threshold: 0.8
  tracking_enabled: true

metrics:
  enabled: true
  address: "0.0.0.0:9090"
  path: /metrics

logging:
  level: info
  format: json
