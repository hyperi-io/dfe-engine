# DFE Fetcher -- Production defaults
# SaaS API fetcher -- pulls from cloud APIs and routes to Kafka

kafka:
  brokers: []  # every deployment names its own brokers
  client_id: dfe-fetcher
  sasl:
    enabled: true
    mechanism: scram_sha_512
    username: ""
    password: ""
  tls:
    enabled: true

metrics:
  enabled: true
  address: "0.0.0.0:9090"
