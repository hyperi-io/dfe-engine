# DFE Loader — Development defaults
# Smaller buffers and debug logging for fast dev iteration
# See: dfe-loader/config.dev.yaml

# Transport backend: kafka or grpc. Matches the dfe-loader serde default
# (src/config/loader.rs:112) and dfe-loader/config.dev.yaml, which consumes
# from Kafka. For a receiver -> loader direct-gRPC profile, set transport: grpc
# and give grpc.listen a bind address; the kafka block is then unused.
transport: kafka

kafka:
  brokers:
    - localhost:9092
  group: dfe-loader
  topics: []  # empty = auto-discover every *_load / *_land topic
  client_id: dfe-loader

# http on the 8123 port, never native on 9000: the loader's pinned ClickHouse
# client has no TCP row fetch, so every message stalls pending schema (#115).
clickhouse:
  hosts:
    - localhost:8123
  database: default
  username: default
  password: ""
  protocol: http

# Every key here is one dfe-loader's RoutingConfig deserialises
# (src/config/pipeline.rs) -- serde ignores anything else without complaint,
# so an invented key routes to the loader's own default instead of failing.
routing:
  db_fields: []
  table_fields:
    - _source
  default_db: dfe
  default_table: main
  org_id_field: org_id
  org_routes: []
  source_to_table: {}
  topic_suffixes:
    - _land
    - _load
  compat_v2_source: false
  dlq:
    enabled: true
    topic: dfe_loader_dlq
    topic_suffix: .dlq

buffer:
  flush_bytes: 524288  # 512 KB — smaller for dev
  flush_rows: 1000
  flush_age_secs: 2

memory:
  limit_bytes: 67108864  # 64 MB fixed cap
  pressure_threshold: 0.8
  tracking_enabled: true

metrics:
  enabled: true
  address: "0.0.0.0:9090"
  path: /metrics

logging:
  level: debug
  format: text

timestamp_dq:
  enabled: true
  max_future_seconds: 600
  max_past_seconds: 0
  invalid_action: replace_with_now
  correct_known_bad: true

field_sanitization:
  strip_at_prefix: true
  handle_numeric_prefix: true
  numeric_prefix: col_
  collapse_underscores: true
  trim_underscores: true
  collision_strategy: last_wins

metadata:
  inject_timestamp_load: true
  extract_timestamp_collector: true
  collector_timestamp_path: tags.collector.timestamp
  tags_fields:
    - tags
    - _tags
    - meta
    - metadata.tags
  tags_output: _tags
  drop_tags: false
  capture_json: true
  json_output: _json
  capture_raw: true
  raw_source_fields:
    - logoriginal
  raw_output: _raw
  disable_json_tables: []
  disable_raw_tables: []
  remove_routing_fields: true

coercion:
  unknown_type_fallback: String
  null_handling: default
  default_timezone: UTC
  timezone_fields:
    - tags_collector_timezone
  array_to_json: true
  strict: false

schema:
  cache_ttl_secs: 60  # shorter for dev iteration
  refresh_on_error: true
