# DFE Transform Vector -- Production defaults
# Kafka-to-Kafka transform using vector.dev pipelines

source:
  brokers: []  # every deployment names its own brokers
  group_id: dfe-transform-vector
  sasl:
    enabled: true
    mechanism: scram_sha_512
    username: ""
    password: ""
  tls:
    enabled: true

sink:
  brokers: []  # every deployment names its own brokers
  sasl:
    enabled: true
    mechanism: scram_sha_512
    username: ""
    password: ""
  tls:
    enabled: true

metrics:
  address: "0.0.0.0:9090"

logging:
  level: info
  format: json
