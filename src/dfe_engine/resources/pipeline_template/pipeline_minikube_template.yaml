image:
  repository: timberio/vector
  pullPolicy: IfNotPresent
  # Overrides the image tag, the default is `{image.version}-{image.base}`.
  tag: "0.42.0-debian"
  # Overrides the image version, the default is the Chart appVersion.
  version: ""
  base: "debian"

updateStrategy:
 type: RollingUpdate
# Only used when updateStrategy is set to "RollingUpdate".
maxUnavailable: 1

extraVolumes:
  - name: {{NAME}}-volume-mount
    persistentVolumeClaim:
      claimName: {{NAME}}-config-pvc

extraVolumeMounts:
  - name: {{NAME}}-volume-mount
    mountPath: /etc/vector-config

env: 
  {% for env_var in env_vars %}- name: {{ env_var }}
    valueFrom:
      configMapKeyRef:
        name: vector-worker-default
        key: {{ env_var }}
  {% endfor %}


args:
  - --watch-config
  - --verbose
  - --no-graceful-shutdown-limit
  {% for step in steps %}- --config
  - {{ step }}
  {% endfor %}


extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: vector-worker-default
      namespace: {{NAME}}
    data:
      {% for key, value in config_maps.items() %}{{ key }}: {% if not value is mapping %}{{ value }}
      {% else %}{% for sub_key, sub_value in value.items() %}{{ sub_key }}: {{ sub_value}}{% endfor %}
      {% endif %}{% endfor %}

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: {{NAME}}-config-pvc
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 10Gi
      storageClassName: csi-hostpath-sc

  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: {{NAME}}-config-pv
    spec:
      capacity:
        storage: 10Gi
      accessModes:
        - ReadWriteOnce
      persistentVolumeReclaimPolicy: Retain
      storageClassName: csi-hostpath-sc
      hostPath:
        path: /data/vector-config/
