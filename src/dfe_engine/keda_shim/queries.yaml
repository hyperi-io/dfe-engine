# dfe-keda-shim's query catalogue, overridable by DFE_ENGINE_KEDA_SHIM_QUERY_CONFIG: docs/deployment/keda-scaling.md.
# A list in the override replaces the built-in list rather than extending it.
# __DB__ is the validated data database, and params and binds are ClickHouse binds.

queries:
  # Matching, series and reduction: docs/deployment/keda-scaling.md.
  pressure:
    database: otel
    sql: >
      SELECT toUInt32(round(coalesce(max(series), 0)))
      FROM (
        SELECT avg(Value) AS series
        FROM __DB__.otel_metrics_gauge
        WHERE ServiceName = {service:String}
          AND __PRESSURE_MATCH__
          AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
        GROUP BY MetricName, cityHash64(Attributes), ResourceAttributes['service.instance.id']
      )
    params: [service]
    binds:
      window_seconds: 120
    result_field: 0
    clamp_min: 0
    clamp_max: 100
    cold_hold: 0
    timeout_seconds: 5
  backlog:
    database: data
    builtin: hunt_backlog
    result_field: 0
    clamp_min: 0
    cold_hold: 0
    timeout_seconds: 5
