# Operational query catalogue for the app-management layer. Same conventions as
# keda_shim/queries.yaml - `database` resolves otel|data to the engine's effective
# data database, `__DB__` is substituted with the validated identifier, and `params`
# become ClickHouse-native bind placeholders so nothing is string-interpolated.
#
# Column names come from dfe-schemas tables/otel/*.yaml, which is the DDL SSoT.
# Every query filters ServiceName then MetricName then TimeUnix, matching the
# metrics tables' ORDER BY prefix so the primary key does the work.
#
# Per-query keys:
#   database         otel | data | <literal db>
#   table            the otel table to read
#   sql              ClickHouse SQL; __DB__ is the resolved database.
#                    __PRESSURE_MATCH__ and __PRESSURE_NAME__ are replaced with the
#                    one rule that matches the scaling-pressure gauge under any
#                    namespace prefix (dfe_engine/scaling_pressure.py).
#   params           request params bound into the SQL (validated identifiers)
#   binds            fixed CH bind params
#   timeout_seconds  ClickHouse max_execution_time
queries:
  # One row per gauge carrying its most recent reading, so the whole gauge set
  # costs one round trip rather than one per metric.
  # Scaling pressure is matched by rule rather than by name and reported under the
  # canonical bare name, so an app that prefixes its gauge still reports a reading.
  # Each series - one metric name, one attribute set, one pod, the KEDA shim's key -
  # is read at its own latest timestamp and the MAX across series is returned, so the
  # hottest pod sets each reading.
  # A pushed row names its pod in the resource (service.instance.id) once the app
  # runs scalo-rs#331 and none before it, a scraped row in its attributes; rows that
  # name no pod share one series.
  latest_gauges:
    database: otel
    sql: >
      SELECT metric, max(value) AS value
      FROM (
        SELECT __PRESSURE_NAME__ AS metric, argMax(Value, TimeUnix) AS value
        FROM __DB__.otel_metrics_gauge
        WHERE ServiceName = {service:String}
          AND (MetricName IN {names:Array(String)} OR __PRESSURE_MATCH__)
          AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
        GROUP BY MetricName, cityHash64(Attributes), ResourceAttributes['service.instance.id']
      )
      GROUP BY metric
    params: [service]
    binds:
      window_seconds: 300
    timeout_seconds: 10

  # Counters as a per-second rate for the instance as a whole, summed from each
  # series' own rate so pods exporting in different seconds are never subtracted from
  # one another. A series is keyed as latest_gauges keys it, and replicas pushing
  # without a pod id share one.
  # Each cumulative stream in a series (one StartTimeUnix) is differenced on its own,
  # so two streams under one name never read their alternation as restarts. A reading
  # below the one before it in a stream is a restart and counts from zero, and a
  # stream's first reading in the window is its baseline.
  # A series' streams are summed over the series' whole span, so a restart's new
  # stream does not double the pod, and a series with one reading adds nothing.
  counter_rates:
    database: otel
    sql: >
      SELECT MetricName, sum(if(span_seconds > 0, increase / span_seconds, 0)) AS value
      FROM (
        SELECT
          MetricName,
          sum(stream_increase) AS increase,
          dateDiff('second', min(first_reading), max(last_reading)) AS span_seconds
        FROM (
          SELECT
            MetricName,
            cityHash64(Attributes) AS attribute_set,
            ResourceAttributes['service.instance.id'] AS pod,
            arraySort(groupArray((TimeUnix, Value))) AS points,
            arrayMap(point -> point.2, points) AS readings,
            arraySum(arrayMap((diff, reading) -> if(diff < 0, reading, diff),
                              arrayDifference(readings), readings)) AS stream_increase,
            min(TimeUnix) AS first_reading,
            max(TimeUnix) AS last_reading
          FROM __DB__.otel_metrics_sum
          WHERE ServiceName = {service:String}
            AND MetricName IN {names:Array(String)}
            AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
          GROUP BY MetricName, cityHash64(Attributes), ResourceAttributes['service.instance.id'], StartTimeUnix
        )
        GROUP BY MetricName, attribute_set, pod
      )
      GROUP BY MetricName
    params: [service]
    binds:
      window_seconds: 300
    timeout_seconds: 10

  # The request-duration histogram's first and last cumulative state per series in
  # the window. A series is one attribute set on one process run, so a restart or a
  # second replica is differenced on its own rather than against another.
  http_request_histogram:
    database: otel
    sql: >
      SELECT
        startsWith(Attributes['http.response.status_code'], '5') AS server_error,
        any(ExplicitBounds) AS bounds,
        argMin(BucketCounts, TimeUnix) AS first_buckets,
        argMax(BucketCounts, TimeUnix) AS last_buckets,
        argMin(Count, TimeUnix) AS first_count,
        argMax(Count, TimeUnix) AS last_count,
        dateDiff('second', min(TimeUnix), max(TimeUnix)) AS span_seconds,
        min(StartTimeUnix) >= now() - INTERVAL {window_seconds:UInt32} SECOND AS started_in_window
      FROM __DB__.otel_metrics_histogram
      WHERE ServiceName = {service:String}
        AND MetricName = 'http.server.request.duration'
        AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
      GROUP BY cityHash64(Attributes, ResourceAttributes['service.instance.id'], StartTimeUnix), server_error
    params: [service]
    binds:
      window_seconds: 300
    timeout_seconds: 10

  # Bucketed resource usage for graphing. Each bucket aggregates ACROSS every pod
  # reporting for this instance, so max_value is the hottest pod's sample in it.
  # A per-config app deploys each config as its own service name, so querying one
  # instance already scopes to one config.
  # p95 rides alongside min/max/avg because a ceiling set from the average
  # under-provisions anything with a spiky profile.
  # Scaling pressure buckets under its canonical bare name whatever prefix the app
  # emitted, so one series is graphed rather than one per namespace.
  resource_series:
    database: otel
    sql: >
      SELECT
        toStartOfInterval(TimeUnix, INTERVAL {bucket_seconds:UInt32} SECOND) AS bucket,
        __PRESSURE_NAME__ AS metric,
        min(Value) AS min_value,
        max(Value) AS max_value,
        avg(Value) AS avg_value,
        quantile(0.95)(Value) AS p95_value,
        count() AS samples
      FROM __DB__.otel_metrics_gauge
      WHERE ServiceName = {service:String}
        AND (MetricName IN {names:Array(String)} OR __PRESSURE_MATCH__)
        AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
      GROUP BY bucket, metric
      ORDER BY bucket
    params: [service]
    binds:
      window_seconds: 3600
      bucket_seconds: 60
    timeout_seconds: 20

  # The loader's per-table counter, one row per series, for the ONE table a
  # source's records land in. `loader_messages_by_table_total` carries the table as
  # an OTel attribute (dfe-loader src/metrics/mod.rs:217), and the loader is the
  # only stage counting a record against a table.
  # Each series is differenced as counter_rates does it, stream by stream and summed
  # over the series' span, with ServiceName in the key because several loader
  # instances can answer, and the caller sums the series.
  # last_increase is the epoch second of the series' latest rise, 0 if it never rose.
  # ServiceName is bound to the deployed loader instances so the query still hits
  # the metrics tables' ORDER BY prefix (ServiceName, MetricName, ...).
  source_landing_counter:
    database: otel
    sql: >
      SELECT
        sum(stream_increase) AS increase,
        dateDiff('second', min(first_reading), max(last_reading)) AS span_seconds,
        max(stream_last_increase) AS last_increase
      FROM (
        SELECT
          ServiceName,
          cityHash64(Attributes) AS attribute_set,
          ResourceAttributes['service.instance.id'] AS pod,
          arraySort(groupArray((TimeUnix, Value))) AS points,
          arrayMap(point -> point.2, points) AS readings,
          arrayMap((diff, reading) -> if(diff < 0, reading, diff),
                   arrayDifference(readings), readings) AS increments,
          arraySum(increments) AS stream_increase,
          min(TimeUnix) AS first_reading,
          max(TimeUnix) AS last_reading,
          arrayMax(arrayMap((point, step) -> if(step > 0, toUnixTimestamp(point.1), 0),
                            points, increments)) AS stream_last_increase
        FROM __DB__.otel_metrics_sum
        WHERE ServiceName IN {services:Array(String)}
          AND MetricName = 'loader_messages_by_table_total'
          AND Attributes['table'] = {table:String}
          AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
        GROUP BY ServiceName, cityHash64(Attributes), ResourceAttributes['service.instance.id'], StartTimeUnix
      )
      GROUP BY ServiceName, attribute_set, pod
    params: [services, table]
    binds:
      window_seconds: 300
    timeout_seconds: 10

  # Every scalo app emits `info`, so a recent row means the app is reporting.
  # `samples` is what decides that, not max(TimeUnix): ClickHouse answers max()
  # over no matching rows with one row carrying the type's default (the epoch),
  # never NULL, so a name that has never emitted would otherwise read reporting.
  # Replica count is absent because a pushed row names no pod until the app runs
  # scalo-rs#331 (service.instance.id on the resource).
  liveness:
    database: otel
    sql: >
      SELECT max(TimeUnix) AS last_seen, count() AS samples
      FROM __DB__.otel_metrics_gauge
      WHERE ServiceName = {service:String}
        AND MetricName = 'info'
        AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
    params: [service]
    binds:
      window_seconds: 300
    timeout_seconds: 10
