# App-management query catalogue, in keda_shim/queries.yaml's format. Columns follow
# dfe-schemas tables/otel/, and each query filters in the metrics tables' ORDER BY order.

queries:
  # Each gauge's latest reading in one round trip, the MAX across series so the hottest pod sets it.
  # A gauge in `summed` reads as the sum of the series seen within `fresh_seconds` of the newest.
  latest_gauges:
    database: otel
    sql: >
      SELECT
        metric,
        if(metric IN {summed:Array(String)},
           sumIf(value, seen + {fresh_seconds:UInt32} >= newest),
           max(value)) AS value
      FROM (
        SELECT metric, value, seen, max(seen) OVER (PARTITION BY metric) AS newest
        FROM (
          SELECT __PRESSURE_NAME__ AS metric,
                 argMax(Value, (TimeUnix, StartTimeUnix)) AS value,
                 max(TimeUnix) AS seen
          FROM __DB__.otel_metrics_gauge
          WHERE ServiceName = {service:String}
            AND (MetricName IN {names:Array(String)} OR __PRESSURE_MATCH__)
            AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
          GROUP BY MetricName, cityHash64(Attributes), ResourceAttributes['service.instance.id']
        )
      )
      GROUP BY metric
    params: [service]
    binds:
      fresh_seconds: 90
      window_seconds: 300
    timeout_seconds: 10

  # Per-second rates, differenced per stream (one StartTimeUnix) and summed, so restarts and replicas never subtract.
  counter_rates:
    database: otel
    sql: >
      SELECT MetricName, sum(if(span_seconds > 0, increase / span_seconds, 0)) AS value
      FROM (
        SELECT
          MetricName,
          sum(stream_increase) AS increase,
          dateDiff('second', min(first_reading), max(last_reading)) AS span_seconds
        FROM (
          SELECT
            MetricName,
            cityHash64(Attributes) AS attribute_set,
            ResourceAttributes['service.instance.id'] AS pod,
            arraySort(groupArray((TimeUnix, Value))) AS points,
            arrayMap(point -> point.2, points) AS readings,
            arraySum(arrayMap((diff, reading) -> if(diff < 0, reading, diff),
                              arrayDifference(readings), readings)) AS stream_increase,
            min(TimeUnix) AS first_reading,
            max(TimeUnix) AS last_reading
          FROM __DB__.otel_metrics_sum
          WHERE ServiceName = {service:String}
            AND MetricName IN {names:Array(String)}
            AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
          GROUP BY MetricName, cityHash64(Attributes), ResourceAttributes['service.instance.id'], StartTimeUnix
        )
        GROUP BY MetricName, attribute_set, pod
      )
      GROUP BY MetricName
    params: [service]
    binds:
      window_seconds: 300
    timeout_seconds: 10

  # The duration histogram's first and last state per series, so each run is differenced on its own.
  http_request_histogram:
    database: otel
    sql: >
      SELECT
        startsWith(Attributes['http.response.status_code'], '5') AS server_error,
        any(ExplicitBounds) AS bounds,
        argMin(BucketCounts, TimeUnix) AS first_buckets,
        argMax(BucketCounts, TimeUnix) AS last_buckets,
        argMin(Count, TimeUnix) AS first_count,
        argMax(Count, TimeUnix) AS last_count,
        dateDiff('second', min(TimeUnix), max(TimeUnix)) AS span_seconds,
        min(StartTimeUnix) >= now() - INTERVAL {window_seconds:UInt32} SECOND AS started_in_window
      FROM __DB__.otel_metrics_histogram
      WHERE ServiceName = {service:String}
        AND MetricName = 'http.server.request.duration'
        AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
      GROUP BY cityHash64(Attributes, ResourceAttributes['service.instance.id'], StartTimeUnix), server_error
    params: [service]
    binds:
      window_seconds: 300
    timeout_seconds: 10

  # Each counter's increase over the window. A stream that starts in the window counts from zero, and a drop is a reset.
  counter_increases:
    database: otel
    sql: >
      SELECT MetricName, sum(increase) AS value
      FROM (
        SELECT
          MetricName,
          arraySort(groupArray((TimeUnix, Value))) AS points,
          arrayMap(point -> point.2, points) AS readings,
          arraySum(arrayMap((diff, reading) -> if(diff < 0, reading, diff),
                            arrayDifference(readings), readings))
            + if(min(StartTimeUnix) >= now() - INTERVAL {window_seconds:UInt32} SECOND,
                 readings[1], 0) AS increase
        FROM __DB__.otel_metrics_sum
        WHERE ServiceName = {service:String}
          AND MetricName IN {names:Array(String)}
          AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
        GROUP BY MetricName, cityHash64(Attributes), ResourceAttributes['service.instance.id'],
                 cityHash64(StartTimeUnix, MetricDescription)
      )
      GROUP BY MetricName
    params: [service]
    timeout_seconds: 30

  # CPU seconds per stream as for counter_increases, so a stuck stream beside the live one adds nothing.
  cpu_seconds_increase:
    database: otel
    sql: >
      SELECT sum(increase) AS value
      FROM (
        SELECT
          arrayMap(point -> point.2, arraySort(groupArray((TimeUnix, Value)))) AS readings,
          arraySum(arrayMap((diff, reading) -> if(diff < 0, reading, diff),
                            arrayDifference(readings), readings))
            + if(min(StartTimeUnix) >= now() - INTERVAL {window_seconds:UInt32} SECOND,
                 readings[1], 0) AS increase
        FROM __DB__.otel_metrics_gauge
        WHERE ServiceName = {service:String}
          AND MetricName = {cpu_seconds:String}
          AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
        GROUP BY cityHash64(Attributes), ResourceAttributes['service.instance.id'],
                 cityHash64(StartTimeUnix, MetricDescription)
      )
      HAVING count() > 0
    params: [service]
    timeout_seconds: 30

  # Bucketed usage across every pod of the instance. p95 rides with min/max/avg because an average under-sizes a spiky app.
  # CPU seconds is cumulative, so a restart or a repeated timestamp yields no sample. bucket_seconds 0 is one bucket.
  resource_series:
    database: otel
    sql: >
      SELECT
        bucket,
        metric,
        min(value) AS min_value,
        max(value) AS max_value,
        avg(value) AS avg_value,
        quantile(0.95)(value) AS p95_value,
        count() AS samples
      FROM (
        SELECT
          if({bucket_seconds:UInt32} = 0,
             now() - INTERVAL {window_seconds:UInt32} SECOND,
             toStartOfInterval(TimeUnix, INTERVAL greatest({bucket_seconds:UInt32}, 1) SECOND)) AS bucket,
          __PRESSURE_NAME__ AS metric,
          Value AS value
        FROM (
          SELECT MetricName, Attributes, ResourceAttributes, TimeUnix,
                 argMax(Value, StartTimeUnix) AS Value
          FROM __DB__.otel_metrics_gauge
          WHERE ServiceName = {service:String}
            AND ((MetricName IN {names:Array(String)} AND MetricName != {cpu_seconds:String})
                 OR __PRESSURE_MATCH__)
            AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
          GROUP BY MetricName, Attributes, ResourceAttributes, TimeUnix
        )
        UNION ALL
        SELECT
          if({bucket_seconds:UInt32} = 0,
             now() - INTERVAL {window_seconds:UInt32} SECOND,
             toStartOfInterval(sample.1, INTERVAL greatest({bucket_seconds:UInt32}, 1) SECOND)) AS bucket,
          {cpu_seconds:String} AS metric,
          sample.2 AS value
        FROM (
          SELECT
            arraySort(groupArray((TimeUnix, Value))) AS points,
            arrayPopFront(arrayMap(point -> point.1, points)) AS ends,
            arrayPopFront(arrayDifference(arrayMap(point -> point.2, points))) AS used,
            arrayPopFront(arrayDifference(arrayMap(point -> toInt64(toUnixTimestamp(point.1)), points))) AS spans,
            arrayJoin(arrayMap(step -> (step.1, step.2 / step.3),
                               arrayFilter(step -> step.3 > 0 AND step.2 >= 0,
                                           arrayZip(ends, used, spans)))) AS sample
          FROM (
            SELECT Attributes, ResourceAttributes, TimeUnix,
                   argMax(Value, StartTimeUnix) AS Value
            FROM __DB__.otel_metrics_gauge
            WHERE ServiceName = {service:String}
              AND MetricName = {cpu_seconds:String}
              AND has({names:Array(String)}, {cpu_seconds:String})
              AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
            GROUP BY Attributes, ResourceAttributes, TimeUnix
          )
          GROUP BY cityHash64(Attributes), ResourceAttributes['service.instance.id']
        )
      )
      GROUP BY bucket, metric
      ORDER BY bucket
    params: [service]
    binds:
      window_seconds: 3600
      bucket_seconds: 60
    timeout_seconds: 20

  # The gauge table's TTL clause, which bounds how far back resource_series can read.
  gauge_retention:
    database: otel
    sql: >
      SELECT engine_full FROM system.tables
      WHERE database = {database:String} AND name = 'otel_metrics_gauge'
    params: [database]
    timeout_seconds: 5

  # The loader's per-table counter, differenced as counter_rates does. last_increase is the epoch second of its latest rise.
  # ServiceName is bound to the loader instances so the query keeps the ORDER BY prefix.
  source_landing_counter:
    database: otel
    sql: >
      SELECT
        sum(stream_increase) AS increase,
        dateDiff('second', min(first_reading), max(last_reading)) AS span_seconds,
        max(stream_last_increase) AS last_increase
      FROM (
        SELECT
          ServiceName,
          cityHash64(Attributes) AS attribute_set,
          ResourceAttributes['service.instance.id'] AS pod,
          arraySort(groupArray((TimeUnix, Value))) AS points,
          arrayMap(point -> point.2, points) AS readings,
          arrayMap((diff, reading) -> if(diff < 0, reading, diff),
                   arrayDifference(readings), readings) AS increments,
          arraySum(increments) AS stream_increase,
          min(TimeUnix) AS first_reading,
          max(TimeUnix) AS last_reading,
          arrayMax(arrayMap((point, step) -> if(step > 0, toUnixTimestamp(point.1), 0),
                            points, increments)) AS stream_last_increase
        FROM __DB__.otel_metrics_sum
        WHERE ServiceName IN {services:Array(String)}
          AND MetricName = 'loader_messages_by_table_total'
          AND Attributes['table'] = {table:String}
          AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
        GROUP BY ServiceName, cityHash64(Attributes), ResourceAttributes['service.instance.id'], StartTimeUnix
      )
      GROUP BY ServiceName, attribute_set, pod
    params: [services, table]
    binds:
      window_seconds: 300
    timeout_seconds: 10

  # `samples` decides liveness, because max() over no rows answers the epoch, not NULL.
  # Replica count is absent: a pushed row from an older app names no pod.
  liveness:
    database: otel
    sql: >
      SELECT max(TimeUnix) AS last_seen, count() AS samples
      FROM __DB__.otel_metrics_gauge
      WHERE ServiceName = {service:String}
        AND MetricName = 'info'
        AND TimeUnix >= now() - INTERVAL {window_seconds:UInt32} SECOND
    params: [service]
    binds:
      window_seconds: 300
    timeout_seconds: 10
