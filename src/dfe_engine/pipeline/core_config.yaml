global_settings:
  output: ./pipelines/core
  vector_files:
    standard: ./hs_artefacts/src/standard_mappings
    geoip: ./hs_artefacts/src/geoip_mappings
    core: ./hs_artefacts/src/core_templates
    custom: ./hs_artefacts/src/custom_templates
  helm_template: ./pipeline_template.yaml
  vector_config_mount_path: /etc/vector_config/src

default_env_vars:
  PROMETHEUS_EXPORTER: 0.0.0.0:9090
  COERCE_CSV: hypersec-transform-coerce-types.csv
  DLQ_EVENT_CATEGORY_CSV: hypersec-enrichment-dlq-event-category.csv
  EVENT_CATEGORY_MAP_CSV: hypersec-receiver-event-category-map.csv
  EVENT_SUBSCHEMA_CSV: all-load-os-ch-event-subschema-map.csv
  EXTRACT_FIELDS_CSV: hypersec-enrichment-extract-fields.csv
  FIELD_SETTER_ITERATION_GROUP: finalise
  FILTER_CSV: filter-core-load-ch.csv
  FILTER_ITERATION_GROUP: iterator
  GEOIP_ASN: GeoLite2-ASN.mmdb
  GEOIP_CITY: GeoLite2-City.mmdb
  GEOIP_COUNTRY: GeoLite2-Country.mmdb
  IP_FIELDS: hypersec-enrichment-ip-fields.csv
  JSON_FIELDS: hypersec-enrichment-json-fields.csv
  KAFKA_TLS_PATH: /etc/vector_tls
  KAFKA_MTLS_PATH: /etc/vector_tls
  MAXMIND_ENRICHMENT: hypersec-enrichment-maxmind-list.csv
  REMAP_FIELDS: hypersec-enrichment-ch-remap-fields.csv
  SUPPORTED_TIMESTAMP_FORMAT: '["%FT%X%.3fZ", "%FT%X%.6fZ", "%FT%X%.9fZ", "%F %X%.3f",
    "%F %X%.6f", "%F %X%.9f","%FT%X%.3f", "%FT%X%.6f", "%FT%X%.9f","%FT%XZ","%FT%X","%F
    %X", "%FT%X"]'
  TS_TZ_MATCH: hypersec-enrichment-ts-match-tz.csv
  TZ_OFFSET_MAPPING: hypersec-enrichment-tz-offset-mapping.csv
  TS_TO_EPOCH_MS_CSV: hypersec-enrichment-timestamp-to-epoch-fields.csv
  TIMEZONES_DB: hypersec-enrichment-timezones.csv
  DOMAIN_FIELDS_CSV: hypersec-enrichment-domain-fields.csv
  TIME_FIELDS: hypersec-enrichment-time-fields.csv
  VECTOR_BUFFER_SIZE: '12000000000'
  VECTOR_DATA_DIR: /vector-data-dir
  VECTOR_ENRICHMENT_PATH: standard_mappings
  VECTOR_GEOIP_PATH: geoip_mappings
  VECTOR_MTLS_PATH: /etc/vector_tls
  VECTOR_OPENSSL_LEGACY_PROVIDER: 'false'
  _202_SINK_KAFKA_DLQ_AWS_SAAS_TOPIC_SUFFIX: load_dlq
  _156_TRANSFORM_ARRAY_FIELDS_SOURCE_TYPE_LIST: '["logs_beats_heartbeat", "logs_beats_auditbeat",
    "logs_beats_filebeat", "logs_beats_metricbeat", "logs_beats_filebeat_dns_windows",
    "logs_beats_winlogbeat"]'
  _156_TRANSFORM_ARRAY_FIELDS_CONCAT_ALL_ARRAYS: 'false'
  _156_TRANSFORM_ARRAY_FIELDS_DELIMETER: ','
  _152_TRANSFORM_TIMESTAMP_PROGRESS_CHECKPOINT_FIELD_NAME: timestamp_finalise
  MAX_REPLICAS: 3
  KAFKA_LAG_THRESHOLD: '1000000'
  PVC_THRESHOLD: '0.6'
  CPU_UTILIZATION_THRESHOLD: '130'
  MEMORY_UTILIZATION_THRESHOLD: '130'

ingestion_pipelines:

  vector-all-prep-ch-load:
    env:
      KAFKA_SOURCE_TOPIC_LIST:
      - ^(logs)_.*_load$
      _202_SINK_KAFKA_AWS_SAAS_TOPIC_SUFFIX: load_ch
      _202_SINK_KAFKA_AWS_SAAS_TOPIC_PREFIX: tags_event_category
      SINK_NAME: 202-sink-kafka-sasl-scram
    meta:
      EXPECTED_EPS: 1500
      MIN_REPLICAS: 1
      HA_MULTIPLIER: 1
      VA_MULTIPLIER: 1
    steps:
    - id: hs-xdr-vector-ct-all-main.yml
    - id: hs-xdr-vector-ct-all-prometheus.yml
    - id: 003-source-kafka-sasl-scram.yml
    - id: 101-transform-flatten-message.yml
    - id: 115-transform-timestamp-collector-field.yml
    - id: 156-transform-array-fields.yml
    - id: 115-transform-timestamp-load-field.yml
    - id: 102-transform-remap-fields.yml
    - id: 116-transform-fields-to-snake-case.yml
    - id: 109-transform-ch-custom-transformations.yml
    - id: 118-transform-ch-subschema-mapping.yml
    - id: 142-transform-coerce-types.yml
    - id: 159-transform-dlq-event-category.yml
    - id: 202-sink-kafka-sasl-scram.yml
      input:
        - 159_transform_dlq_event_category.route_clickhouse_sink
    - id: 202-sink-dlq-kafka-sasl-scram.yml
      input:
        - 159_transform_dlq_event_category.route_kafka_sink

  vector-load-ch:
    env:
      KAFKA_SOURCE_TOPIC_LIST:
      - ^(logs)_.*_load_ch$
    meta:
      EXPECTED_EPS: 2500
      SINK_NAME: 201-sink-clickhouse-saas
      MIN_REPLICAS: 1
    steps:
    - id: hs-xdr-vector-ct-all-prometheus.yml
    - id: hs-xdr-vector-ct-all-main.yml
    - id: 003-source-kafka-sasl-scram.yml
    - id: 101-transform-flatten-message.yml
    - id: 201-sink-clickhouse-saas.yml

  vector-all-load-s3:
    env:
      KAFKA_SOURCE_TOPIC_LIST:
      - ^(logs|context)_.*_load$
      # Per-deployment: the 207 sink refuses to start until the deployer sets both.
      _207_SINK_AWS_S3_BUCKET_NAME: ''
      _207_SINK_AWS_S3_REGION: ''
    steps:
    - id: hs-xdr-vector-ct-all-main.yml
    - id: hs-xdr-vector-ct-all-prometheus.yml
    - id: 003-source-kafka-sasl-scram.yml
    - id: 101-transform-flatten-message.yml
    - id: 138-transform-filter.yml
    - id: 115-transform-timestamp-load-field.yml
    - id: 207-sink-aws-s3.yml

  vector-logs-hypercol-metric-finalise:
    env:
      KAFKA_SOURCE_TOPIC_LIST:
      - logs_hypercol_metric_land
    steps:
    - id: hs-xdr-vector-ct-all-main.yml
    - id: hs-xdr-vector-ct-all-prometheus.yml
    - id: 003-source-kafka-sasl-scram.yml
    - id: 101-transform-flatten-message.yml
    - id: 105-transform-junk-filter.yml
    - id: 124-transform-hypercol-metric.yml
    - id: 119-transform-split-ip-field.yml
    - id: 116-transform-fields-to-snake-case.yml
    - id: 129-transform-event-hash-field.yml
    - id: 152-transform-timestamp-progress-checkpoint.yml
    - id: 157-transform-epoch-timestamp-conversion.yml
    - id: 202-sink-kafka-sasl-scram.yml

  vector-receiver:
    env:
      VECTOR_THREADS: '8'
      PVC_SIZE: 128Gi
      VECTOR_BUFFER_SIZE: 32000000000
      RECEIVER_EVENT_MAP_CSV_PATH: hypersec-receiver-event-category-map.csv
      FIELD_SETTER_ITERATION_GROUP: receiver
      HYPERSEC_RECEIVER_SINK_INPUT: 08_transform_final
      HYPERSEC_RECEIVER_TRANSFORM_EVENT_CATEGORY_INPUT: 01_collector
      HYPERSEC_RECEIVER_TRANSFORM_TIMESTAMP_INPUT: 07_transform_event_category
    steps:
    - id: hs-xdr-vector-ct-all-main.yml
    - id: hs-xdr-vector-ct-all-prometheus.yml
    - id: hypersec-receiver-source-v2.yml
    - id: hypersec-receiver-transform-mux.yml
    - id: hypersec-receiver-transform-event-category-mux.yml
    - id: hypersec-receiver-transform-timestamp-mux.yml
    - id: hypersec-receiver-sink.yml
