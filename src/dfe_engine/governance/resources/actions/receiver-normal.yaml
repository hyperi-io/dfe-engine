name: receiver-normal
description: >-
  Return the receiver to its tier's own KEDA ceiling after a surge (the
  counterpart of receiver-surge), by removing the maxReplicaCount override so
  the tier profile applies again.
required_action: action:invoke:receiver-normal
changes:
  - cls: helmvars
    name: dfe-receiver-default-values
    path: keda.maxReplicaCount
    value:
      $unset: true
