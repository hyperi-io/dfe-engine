name: storage-layout
description: >-
  Decided at deploy and refused afterwards. Where the data lives (mode), how it
  is laid out on disk (storageModel), which object store or cold volume holds
  it, and how big the disk is are all one decision made once: changing any of
  them on a live deployment strands the rows and segments already written, and
  a size or class change additionally needs every PVC patched and the
  StatefulSet recreated, because volumeClaimTemplates are immutable. Holders of
  helmvars:override can still make a deliberate exception.
protected:
  - "infravars:*:clickhouse.mode"
  - "infravars:*:clickhouse.storageModel"
  - "infravars:*:clickhouse.objectStore.*"
  - "infravars:*:clickhouse.tieredBlock.*"
  - "infravars:*:clickhouse.storage.size"
  - "infravars:*:clickhouse.storage.storageClass"
  - "infravars:*:kafka.mode"
  - "infravars:*:kafka.storageModel"
  - "infravars:*:kafka.objectStore.*"
  - "infravars:*:kafka.tieredObject.*"
  - "infravars:*:kafka.storage.size"
  - "infravars:*:kafka.storage.storageClass"
  # The pre-vocabulary spellings of the same three blocks, kept because a lock
  # that matches nothing costs nothing while a missing one silently permits.
  # Drop them once no supported chart renders these keys.
  - "infravars:*:clickhouse.s3.*"
  - "infravars:*:clickhouse.tiered.*"
  - "infravars:*:kafka.tiered.*"
