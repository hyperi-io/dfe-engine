roles:
  admin:
    description: "Full access to all resources and all orgs"
    resource_type: core
    permissions:
      - "*"
  data_analyst:
    description: "Hunt, query, source, fieldmap CRUD"
    resource_type: core
    permissions:
      - "hunt:*"
      - "query:*"
      - "source:*"
      - "sampler:read"
      - "synthetic-data:*"
      - "fieldmap:*"
      - "alert:*"
      - "rule:*"
      - "schema:read"
      - "schema:write"
      - "transforms:*"
      - "org:read"
  data_analyst_viewer:
    description: "Same scope as data_analyst, read-only"
    resource_type: core
    permissions:
      - "hunt:read"
      - "query:read"
      - "query:execute"
      - "source:read"
      - "sampler:read"
      - "synthetic-data:read"
      - "fieldmap:read"
      - "alert:read"
      - "rule:read"
      - "schema:read"
      - "org:read"
  data_viewer:
    description: "HyperDX dashboards and query execution"
    resource_type: core
    permissions:
      - "query:execute"
      - "source:read"
      - "sampler:read"
      - "dashboard:read"
      - "org:read"
  infra_admin:
    description: "Service configs, deployments, helm, Argo CD, orgs, groups, Governed Ops"
    resource_type: core
    permissions:
      - "config:*"
      - "service:*:config:*"
      - "service:*:metrics:read"
      - "helm:*"
      - "helmvars:*"
      - "library:*"
      # A dry run is two grants: executing authored code, and reading the sampled
      # events it runs over. This role authors transforms, so it holds both.
      - "dryrun:execute"
      - "sampler:read"
      - "governance:*"
      - "action:invoke:*"
      - "deployment:*"
      - "argo:*"
      - "org:*"
      - "group:*"
      - "repository:*"
  dfe_operator:
    description: "Curated operational dials - invoke shipped actions, read governed state"
    resource_type: core
    permissions:
      - "governance:read"
      - "action:invoke:*"
      - "deployment:read"
      - "library:read"
      - "service:*:metrics:read"
  infra_viewer:
    description: "Infrastructure read-only"
    resource_type: core
    permissions:
      - "config:read"
      - "service:*:config:read"
      - "service:*:metrics:read"
      - "helm:compile"
      - "deployment:read"
      - "argo:applications:get"
      - "argo:projects:get"
      - "service-surface:read"
      - "service:read"
      - "org:read"
  org_viewer:
    description: "Org-restricted data viewer"
    resource_type: core
    permissions:
      - "query:execute"
      - "source:read"
      - "sampler:read"
      - "dashboard:read"
    scoped: true
