roles:
  admin:
    description: "Full access to all resources and all orgs"
    resource_type: core
    permissions:
      - "*"
    hyperdx:
      access: full
      tenant_scoped: false
  data_analyst:
    description: "Hunt, query, source, fieldmap CRUD"
    resource_type: core
    permissions:
      - "hunt:*"
      - "query:*"
      - "source:*"
      - "sampler:read"
      - "fieldmap:*"
      - "alert:*"
      - "rule:*"
      - "sigma:*"
      - "cel:check"
      - "schema:read"
      - "schema:write"
      - "transform:*"
      - "org:read"
    hyperdx:
      access: full
      tenant_scoped: false
  data_analyst_ro:
    description: "Same scope as data_analyst, read-only"
    resource_type: core
    permissions:
      - "hunt:read"
      - "query:read"
      - "query:execute"
      - "source:read"
      - "sampler:read"
      - "fieldmap:read"
      - "alert:read"
      - "rule:read"
      - "sigma:read"
      - "schema:read"
      - "org:read"
    hyperdx:
      access: full
      tenant_scoped: false
  data_viewer:
    description: "HyperDX dashboards and query execution"
    resource_type: core
    permissions:
      - "query:execute"
      - "source:read"
      - "sampler:read"
      - "dashboard:read"
      - "org:read"
    hyperdx:
      access: full
      tenant_scoped: false
  infra:
    description: "Hunts, service configs, deployments, helm, Argo CD, orgs, groups"
    resource_type: core
    permissions:
      - "hunt:*"
      - "config:*"
      - "service:*:config:*"
      - "service:*:metrics:read"
      - "helm:*"
      - "deployment:*"
      - "argo:*"
      - "lifecycle:*"
      - "service:read"
      - "org:*"
      - "group:*"
      - "repository:*"
    hyperdx:
      access: otel
      tenant_scoped: false
  infra_ro:
    description: "Infrastructure read-only"
    resource_type: core
    permissions:
      - "config:read"
      - "service:*:config:read"
      - "service:*:metrics:read"
      - "helm:compile"
      - "deployment:read"
      - "argo:applications:get"
      - "argo:projects:get"
      - "lifecycle:read"
      - "service-surface:read"
      - "service:read"
      - "org:read"
    hyperdx:
      access: otel
      tenant_scoped: false
  org_analyst:
    description: "Org-restricted data viewer"
    resource_type: core
    permissions:
      - "query:execute"
      - "source:read"
      - "sampler:read"
      - "dashboard:read"
    scoped: true
    hyperdx:
      access: org-scoped
      tenant_scoped: true
