# What each backing service's provider key means to the engine: docs/deployment/backing-services.md.

services:
  kafka:
    external:
      read_only:
        - replicas
        - storage
        - storageModel
        - resources
        - objectStore
        - tieredObject
        - sizing
        - controllerPool
    providers:
      strimzi:
        managed_by: dfe
      redpanda:
        managed_by: dfe
      msk:
        managed_by: provider
        set_in: deployment
        read_only: &kafka_sizing
          - mode
          - replicas
          - storage
          - storageModel
          - resources
          - objectStore
          - tieredObject
          - sizing
          - controllerPool
      confluent-cloud:
        managed_by: provider
        set_in: deployment
        read_only: *kafka_sizing
      redpanda-cloud:
        managed_by: provider
        set_in: provider
        read_only: *kafka_sizing

  clickhouse:
    external:
      read_only:
        - replicas
        - keeper.replicas
        - storage
        - storageModel
        - resources
        - objectStore
        - tieredBlock
    providers:
      in_cluster:
        managed_by: dfe
      clickhouse-cloud:
        managed_by: provider
        set_in: provider
        read_only:
          - mode
          - replicas
          - keeper.replicas
          - storage
          - storageModel
          - resources
          - objectStore
          - tieredBlock
      external:
        managed_by: external
