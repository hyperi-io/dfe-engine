# Type Registry — Canonical primitive-to-ClickHouse type mapping
#
# This file is internal to the engine. Data SMEs do NOT edit this file.
# They use simplified primitives in their schema YAML definitions.
# See docs/data-plane/schema.md for the full specification.
#
# Maintained by: dfe-engine

primitives:
  string:
    ch_type: String
    codec: "ZSTD(1)"
    nullable: true

  text:
    ch_type: String
    codec: "ZSTD(3)"
    nullable: true

  integer:
    ch_type: Int64
    codec: "ZSTD(1)"
    nullable: true

  float:
    ch_type: Float64
    codec: "ZSTD(1)"
    nullable: true

  boolean:
    ch_type: Bool
    codec: LZ4
    nullable: false

  datetime:
    ch_type: "DateTime64(3,'UTC')"
    codec: "Delta, ZSTD(1)"
    nullable: true

  timestamp:
    ch_type: "DateTime64(3,'UTC')"
    codec: "Delta, LZ4"
    nullable: false

  date:
    ch_type: Date
    codec: "Delta, ZSTD(1)"
    nullable: true

  ip:
    ch_type: IPv6
    codec: LZ4
    nullable: true

  uuid:
    ch_type: UUID
    codec: ~
    nullable: true

  json:
    ch_type: JSON
    codec: "ZSTD(3)"
    nullable: true

  geo_point:
    ch_type: Point
    codec: "ZSTD(1)"
    nullable: true

  enum:
    ch_type: "Enum8(...)"
    codec: "ZSTD(1)"
    nullable: false

# Use case → valid primitive constraints (1:M)
use_cases:
  dimension:
    valid_primitives: [string, integer, boolean, enum, ip, uuid]
  fulltext:
    valid_primitives: [string, text]
  text_search:
    valid_primitives: [string, text]
  range:
    valid_primitives: [integer, float, datetime, timestamp, date, ip]
  bloom:
    valid_primitives: [string, uuid]

# Attribute → valid primitive constraints (1:M)
attributes:
  lowcardinality:
    valid_primitives: [string, text, integer, float, date, ip]
  nullable:
    valid_primitives: all
  not_null:
    valid_primitives: all
  materialized:
    valid_primitives: all
  alias:
    valid_primitives: all

# Supported ClickHouse types for ch_override validation.
# Parameterised types use regex patterns (matched at validation time).
ch_overrides:
  exact:
    - String
    - Bool
    - Date
    - Date32
    - DateTime
    - IPv4
    - IPv6
    - UUID
    - JSON
    - Point
    - Ring
    - Polygon
    - MultiPolygon
    - Dynamic
    - Int8
    - Int16
    - Int32
    - Int64
    - Int128
    - Int256
    - UInt8
    - UInt16
    - UInt32
    - UInt64
    - UInt128
    - UInt256
    - Float32
    - Float64
  parameterised:
    - "FixedString\\(\\d+\\)"
    - "DateTime64\\(\\d+(,'[^']+'){0,1}\\)"
    - "Decimal\\(\\d+,\\d+\\)"
    - "Decimal32\\(\\d+\\)"
    - "Decimal64\\(\\d+\\)"
    - "Decimal128\\(\\d+\\)"
    - "Enum8\\(.+\\)"
    - "Enum16\\(.+\\)"
    - "Array\\(.+\\)"
    - "Map\\(.+,.+\\)"
    - "Tuple\\(.+\\)"
    - "Nested\\(.+\\)"
    - "Variant\\(.+\\)"
    - "AggregateFunction\\(.+\\)"
    - "SimpleAggregateFunction\\(.+\\)"
