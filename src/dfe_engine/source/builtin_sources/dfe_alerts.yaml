# Built-in Source: DFE Alerts (Hunt Detection Results)
#
# Represents the hunt detection results table as a queryable Source.
# Enables correlation hunts that query previous detection output,
# field mapping views, and schema DDL generation.
#
# Table: dfe_hunts.detection
# Profile: timeseries (minus _raw, _tags) + detection columns

source: dfe_alerts
display_name: DFE Alerts
description: >-
  Hunt detection results — matched records from scheduled detection rules.
  Contains matched_uuid linking back to the original source record,
  plus rule metadata (rule_id, rule_name, hunt_name, severity).
state: active
deployed_version: "1.0.0"
current: "1.0.0"

versions:
  "1.0.0":
    date_time: "2026-01-15"
    header:
      type: time_series
      version: "1.0.0"
    match:
      field: _source
      value: dfe_alerts
    schema:
      ttl_days: 365
      engine: MergeTree
      additional_fields: hunt-results/detection.yaml
    views:
      - standard: sigma
