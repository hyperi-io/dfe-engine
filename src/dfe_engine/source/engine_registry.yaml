# Engine Registry — Canonical set of permitted ClickHouse table engines.
#
# This file is internal to the engine. Data SMEs do NOT edit this file.
# They select an engine in their source schema config; that engine must be
# one of the names listed here. Mirrors type_registry.yaml, but for the
# table-level ENGINE clause instead of column primitives.
#
# Engines are emitted bare (ENGINE = Name()), so only parameterless
# MergeTree-family engines belong here. Parameterised engines
# (ReplacingMergeTree(ver), ReplicatedMergeTree('/path','replica'), ...)
# are out of scope for now.
#
# Maintained by: dfe-engine

engines:
  - MergeTree
  - ReplacingMergeTree
  - SummingMergeTree
  - AggregatingMergeTree
  - CollapsingMergeTree
  - VersionedCollapsingMergeTree
  - GraphiteMergeTree
  - CoalescingMergeTree
