# Engine Registry — Canonical set of permitted ClickHouse table engines.
#
# This file is internal to the engine. Data SMEs do NOT edit this file.
# They select an engine in their source schema config; that engine must be
# one of the names listed here. Mirrors type_registry.yaml, but for the
# table-level ENGINE clause instead of column primitives.
#
# List the MergeTree-family VARIANTS only. Validation gates the variant (the
# token before any "("), so a parameterised form the SME chooses -
# ReplacingMergeTree(version_col), SummingMergeTree(a, b) - is accepted: the
# variant must be listed here, the params are theirs.
#
# Do NOT list the Replicated/Shared prefix forms (ReplicatedMergeTree,
# SharedMergeTree). That prefix is added at DDL time by the engine resolver from
# the deployment topology (single vs Replicated/Shared db vs Cloud) - it is an
# infra concern, never declared in a source's config.
#
# Maintained by: dfe-engine

engines:
  - MergeTree
  - ReplacingMergeTree
  - SummingMergeTree
  - AggregatingMergeTree
  - CollapsingMergeTree
  - VersionedCollapsingMergeTree
  - GraphiteMergeTree
  - CoalescingMergeTree
