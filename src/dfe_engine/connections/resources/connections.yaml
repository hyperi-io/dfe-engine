# Fixed CH users by privilege (the custom-settings tenant model). Each role maps
# to exactly one connection; the connection carries the CH user + a password_env.
# The reconciler MINTS dfe_analyst / dfe_analyst_ro / dfe_tenant_reader (secrets
# seam -> the *_PASSWORD env vars). The `default`/admin connection uses the
# deployment's CH superuser (dfe_admin identity) - deliberately NOT minted, so the
# admin connection + discovery authenticate even before the first reconcile.
connections:
  default:
    host: localhost
    port: 8123
    database: dfe
    user: default
    password_env: CH_DEFAULT_PASSWORD

  analyst:
    host: localhost
    port: 8123
    database: dfe
    user: dfe_analyst
    password_env: CH_ANALYST_PASSWORD

  analyst_ro:
    host: localhost
    port: 8123
    database: dfe
    user: dfe_analyst_ro
    password_env: CH_ANALYST_RO_PASSWORD

  tenant_reader:
    host: localhost
    port: 8123
    database: dfe
    user: dfe_tenant_reader
    password_env: CH_TENANT_READER_PASSWORD

role_connections:
  admin: default
  infra: default
  data_analyst: analyst
  data_analyst_ro: analyst_ro
  data_viewer: analyst_ro
  infra_ro: analyst_ro
  org_analyst: tenant_reader
