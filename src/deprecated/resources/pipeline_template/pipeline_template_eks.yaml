# HyperSec DFE Vector Helm Template
# DFE Deployment Types: AWS, SaaS
# Based on Vector Helm Chart deployment
#
# READ THIS FOR PARAMETERS 
# https://github.com/vectordotdev/helm-charts/blob/develop/charts/vector/README.md
#
# v1.1    2024-06-25    Update for new caching and storage classes
# v1.0    2023-06-29    PaaS migration for DFE 2.1
#
# (c) HyperSec 2024
#

commonLabels:
  app.kubernetes.io/component: {{NAME}}

autoscaling:
  enabled: true
  minReplicas: {{MIN_REPLICAS | default(1, true)}} # Default to 3
  maxReplicas: {{MAX_REPLICAS | default(9, true)}} # Default to 9
  targetMemoryUtilizationPercentage: 80
  targetCPUUtilizationPercentage: 80

replicas: {{REPLICAS | default(1, true)}} # Default to 3


secrets:
  generic: {}


image:
  repository: timberio/vector
  pullPolicy: IfNotPresent
  # Overrides the image tag, the default is `{image.version}-{image.base}`.
  tag: {{IMAGE_TAG | default("0.43.1-debian", true)}}
  # Overrides the image version, the default is the Chart appVersion.
  version: ""
  base: {{IMAGE_BASE | default("debian", true)}}

# Image pull secrets to use at the `Pod`s managed by `DaemonSet`.
imagePullSecrets: []

command: []

# Override the chart name used in templates.
nameOverride: ""
fullnameOverride: ""

updateStrategy:
 type: RollingUpdate
# Only used when updateStrategy is set to "RollingUpdate".
maxUnavailable: 1

# Use Liveness Probe (The Probe is using API endpoint which is disabled by default.
# You have to enable the API in the Config to expose the endpoint.)
livenessProbe:
  httpGet:
    path: /health
    port: 8686
  initialDelaySeconds: 660
  periodSeconds: 60
  timeoutSeconds: 30
  failureThreshold: 1

# Use Readyness Probe (The Probe is using API endpoint which is disabled by default.
# You have to enable the API in the Config to expose the endpoint.)
readinessProbe:
  httpGet:
    path: /health
    port: 8686
  initialDelaySeconds: 360
  periodSeconds: 30
  timeoutSeconds: 30
  failureThreshold: 5


# Change DNS Policy
dnsPolicy:

# Custom DNS configuration to be added to vector-agent pods
dnsConfig: {}

# Deploy a service resource to use Topology-aware traffic routing with topology keys.
service:
  # Whether to create service resource or not.
  enabled: false
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
    service.beta.kubernetes.io/aws-load-balancer-ip-address-type: ipv4
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
    #service.beta.kubernetes.io/aws-load-balancer-access-log-s3-bucket-name:
    #service.beta.kubernetes.io/aws-load-balancer-access-log-s3-bucket-prefix: "vector-nlb"
  type: LoadBalancer
  topologyKeys: {}

  ports:
    - name: api
      port: 8686
      protocol: TCP
      targetPort: 8686
    {% if NAME == "vector-receiver" %}
    - name: collector-sources
      port: 6000
      protocol: TCP
      targetPort: 6000
    {% endif %}

serviceAccount:
  # Specifies whether a service account should be created.
  create: true
  # Annotations to add to the service account.
  annotations:
    {% if NAME == "vector-receiver" and SERVICE_ACCOUNT_VECTOR_RECEIVER_ROLE_ARN %}
    eks.amazonaws.com/role-arn: {{SERVICE_ACCOUNT_VECTOR_RECEIVER_ROLE_ARN}}
    {% else %}
    eks.amazonaws.com/role-arn: {{SERVICE_ACCOUNT_VECTOR_ROLE_ARN}}
    {% endif %}
  # The name of the service account to use.
  # If not set and `create` is true, a name is generated using the `fullname`
  # template.
  name: "vector-sa"
  # Automount API credentials for a service account.
  automountServiceAccountToken: true

# Add an annotation to the `Pod`s managed by `DaemonSet` with a random value,
# generated at Helm Chart template evaluation time.
# Enabling this will cause the `Pod`s to be recreated every time the value
# changes - effectively restarting them on each update.
podRollmeAnnotation: false

# Add an annotation to the `Pod`s managed by `DaemonSet` with a checksum of
# the Helm release values (as in `values.yaml` content and `--set` flags).
# Enabling this will cause the `Pod`s to be recreated every time values
# change.
podValuesChecksumAnnotation: false

# Annotations to add to the `Pod`s managed by `DaemonSet`.
podAnnotations: {}

# Labels to add to the `Pod`s managed by `DaemonSet`.
podLabels: {}

# Priority class name to add to the `Pod`s managed by `DaemonSet`.
podPriorityClassName: ""

# PodSecurityContext to set at the `Pod`s managed by `DaemonSet`.
podSecurityContext: {}
  # fsGroup: 2000

# Security context to set at the `vector` container at the `Pod`s managed by
# `DaemonSet`.
securityContext: {}

# Extra env vars to pass to the `vector` container.
env:
  # If the name contains -load-ch then add the following
  {% if "-load-ch" in NAME %}
  - name: CH_HOST
    valueFrom:
      secretKeyRef:
        name: vector-ch-creds
        key: ch-host

  - name: CH_USERNAME
    valueFrom:
      secretKeyRef:
        name: vector-ch-creds
        key: ch-username

  - name: CH_PASSWORD
    valueFrom:
      secretKeyRef:
        name: vector-ch-creds
        key: ch-password
  {% endif %}

  {% for env_var in env_vars %}- name: {{ env_var }}
    valueFrom:
      configMapKeyRef:
        name: vector-worker-default
        key: {{ env_var }}
  {% endfor %}

# Extra arguments to pass to the `vector` container.
# STEP 1: Define Vector config (Needs to be tested, current all vector files mounted in the yaml/mount-s3-ds.yaml daemonset are loaded)
args:
  - --watch-config
  - --verbose
  - --no-graceful-shutdown-limit
  {% for step in steps %}- --config
  - {{ step }}
  {% endfor %}

# Tolerations to set for the `Pod`s managed by `DaemonSet`.
tolerations:
  # This toleration is to have the `DaemonSet` runnable on master nodes.
  # Remove it if your masters can't run pods.
  - key: dedicated
    effect: NoSchedule
    operator: Equal
    value: "vector"

# Various tweakables for the `Pod`s managed by `DaemonSet`.
resources:
  requests:
    cpu: {{CPU_REQUESTS | default(2, true)}}
    memory: {{MEMORY_REQUESTS | default("2Gi", true)}}
  limits:
    cpu: {{CPU_LIMITS | default(2, true)}}
    memory: {{MEMORY_LIMITS | default("4Gi", true)}}
nodeSelector: {}
affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: role
          operator: In
          values:
            - vector_node
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 100
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/component
            operator: In
            values:
              - vector-aggregator-syslog-load-ch
        topologyKey: topology.kubernetes.io/zone
# Additional container ports to pass to the `vector` container of the `Pod`s
# managed by `DaemonSet`.
extraContainersPorts:
  - name: api
    port: 8686
    protocol: TCP
    targetPort: 8686
  - name: metrics
    port: 9090
    protocol: TCP
    targetPort: 9090
# Additional sources to include at the `config-dir` projection of the `Pod`s
# managed by `DaemonSet`.
extraConfigDirSources: []

# Additional volumes to pass to the `Pod`s managed by `DaemonSet`.
extraVolumes:
  #- name: fuse
  #  hostPath:
  #    path: /dev/fuse
  #- name: custom-config
  #  hostPath:
  #    path: /mnt/config/vector_templates
  - name: msk-mtls
    secret:
      secretName: vector-msk-mtls
  - name: s3-config
    persistentVolumeClaim:
      claimName: s3-config-pvc

  {% if "-load-ch" in NAME %}

  - name: vector-ch-creds
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "vector-ch-creds"
  {% endif %}
    
  {% if NAME == "vector-receiver" %}
  - name: vector-tls
    csi:
      driver: secrets-store.csi.k8s.io
      readOnly: true
      volumeAttributes:
        secretProviderClass: "vector-receiver-tls"
  {% endif %}

# Additional volume mounts to pass to the `vector` container of the `Pod`s
# managed by `DaemonSet`.
extraVolumeMounts:
  #- name: custom-config
  #  mountPath: /etc/vector
  #- name: fuse
  #  mountPath: /dev/fuse
  - name: s3-config
    mountPath: /etc/vector

  {% if "-load-ch" in NAME %}
  - name: vector-ch-creds
    mountPath: /tmp/clickhouse
  {% endif %}

  - name: msk-mtls
    mountPath: "/etc/vector_mtls"
    readOnly: true


  {% if NAME == "vector-receiver" %}
  - name: vector-tls
    mountPath: "/etc/vector_tls"
    readOnly: true
  {% endif %}

# Vector will store it's data here.

persistence:
  enabled: true
  accessModes: [ "ReadWriteOnce" ]
  storageClassName: "vector-data"
  size: {{SIZE | default("48Gi", true)}}
  retentionPolicy: 
    whenDeleted: Retain
    whenScaled: Delete

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/component: {{NAME}}
    matchLabelKeys:
      - pod-template-hash
    nodeAffinityPolicy: Honor
    nodeTaintsPolicy: Honor 

rbac:
  # Whether to create rbac resources or not. Disable for non-rbac clusters.
  enabled: true

psp:
  # Whether to create `PodSecurityPolicy` or not.
  enabled: false

existingConfigMap: "dummy_val"

customConfig: {}


podMonitor:
  # Whether to add the `PodMonitor` resource or not.
  # `prometheus-operator` CRDs are necessary, otherwise you'll get an error.
  enabled: true
  # Additional labels for PodMonitor
  additionalLabels:
    release: prometheus
  # Additional relabelings to include in the `PodMonitor`.
  extraRelabelings: []
  # metricRelabelings to include in the `PodMonitor`.
  metricRelabelings: []

# Global parts of the generated `vector` config.
# DEPRECATED. Use customConfig instead
globalOptions:
  # Specifies the (in-container) data dir used by `vector`.
  dataDir: "/vector-data-dir"

# Schema part of the generated `vector` config.
# DEPRECATED. Use customConfig instead
logSchema:
  hostKey: "host"
  messageKey: "message"
  sourceTypeKey: "source_type"
  timestampKey: "timestamp"

# The Vector API.
# Will be disabled by default.
# DEPRECATED. Use customConfig instead
vectorApi:
  # Turn the Vector API on or off.
  enabled: true
  # The address to listen at.
  address: "0.0.0.0:8686"
  # Enable or disable the built-in GraphQL Playground (a web IDE for working on GraphQL queries).
  playground: true

# The "built-in" kubernetes logs source to collect logs from the `Pod`s running
# on the `Node`.
# Will be added by default, unless explicitly disabled.
# DEPRECATED. Use customConfig instead
kubernetesLogsSource:
  # Disable to omit the kubernetes logs source from being added.
  enabled: true
  # The name to use for the "built-in" kubernetes logs source.
  sourceId: kubernetes_logs
  # Additional config to embed at the kubernetes logs source.
  config: {}
    # option: "value"
  # Raw TOML config to embed at the kubernetes logs source (deprecated).
  rawConfig: null

# The "built-in" vector sink, to send the logs to the vector aggregator.
# Disabled by default when using `vector-agent` chart.
# Enabled by default when using `vector` chart, and automatically configured.
# DEPRECATED. Use customConfig instead
vectorSink:
  # Disable to omit the vector sink from being added.
  enabled: false
  # The name to use for the "built-in" vector sink.
  sinkId: vector_sink
  # Inputs of the built-in vector sink.
  inputs: null  # ["my_input_1", "my_input_2"]
  # The host of the Vector to send the data to.
  host: null  # "vector.internal"
  # The port of the Vector to send the data to.
  port: null  # 9000
  # Additional config to embed at the vector sink.
  config: {}
    # option: "value"
  # Raw TOML config to embed at the vector sink (deprecated).
  rawConfig: null

# The "built-in" internal metrics source emitting Vector's internal opertaional
# metrics.
# DEPRECATED. Use customConfig instead
internalMetricsSource:
  # Disable to omit the internal metrics source from being added.
  enabled: true
  # The name to use for the "built-in" internal metrics source.
  sourceId: internal_metrics
  # Additional config to embed at the internal metrics source.
  config: {}
    # option: "value"
  # Raw TOML config to embed at the internal metrics source (deprecated).
  rawConfig: null

# The "built-in" host metrics source emitting the metrics gathered from the node
# that Vector is executing on.
# DEPRECATED. Use customConfig instead
hostMetricsSource:
  # Disable to omit the host metrics source from being added.
  enabled: true
  # The name to use for the "built-in" host metrics source.
  sourceId: host_metrics
  # Additional config to embed at the host metrics source.
  config:
    filesystem:
      devices:
        excludes: [binfmt_misc]
      filesystems:
        excludes: [binfmt_misc]
      mountpoints:
        excludes: ["*/proc/sys/fs/binfmt_misc"]
    # option: "value"
  # Raw TOML config to embed at the host metrics source (deprecated).
  rawConfig: null

# The "built-in" prometheus sink exposing metrics in the Prometheus scraping
# format.
# When using this "built-in" sink, we automatically configure container ports,
# and ensure things are ready for discovery and scraping via Prometheus'
# `kubernetes_sd_configs` jobs.
# DEPRECATED. Use customConfig instead
prometheusSink:
  # Disable to omit the prometheus sink from being added.
  enabled: true
  # The name to use for the "built-in" prometheus sink.
  sinkId: prometheus_sink
  # Inputs of the built-in prometheus sink.
  # If you have built-in internal metrics source enabled, we'll add it as a
  # input here under the hood, so you don't have to pass it here.
  # Unless `excludeInternalMetrics` is set to `true`, in which case you're
  # responsible of wiring up the internal metrics.
  inputs: []
  # Set this to `true` to opt-out from automatically adding the built-in
  # internal metrics source to the inputs.
  excludeInternalMetrics: false
  # The address to listen at.
  listenAddress: "0.0.0.0"
  # The port to listen at.
  listenPort: "9090"
  # Additional config to embed at the prometheus sink.
  config: {}
    # option: "value"
  # Raw TOML config to embed at the prometheus sink (deprecated).
  rawConfig: null
  # Add Prometheus annotations to Pod to opt-in for Prometheus scraping.
  # To be used in clusters that rely on Pod annotations in the form of
  # `prometheus.io/scrape` to discover scrape targets.
  addPodAnnotations: true
  # Use prometheus-operator `PodMonitor` to opt-in for Prometheus scraping.
  # To be used in clusters that rely on prometheus-operator to gather metrics.
  # You might want to set `podMonitorSelectorNilUsesHelmValues=false` if you're
  # using prometheus-operator Helm chart to allow `PodMonitor` resources
  # dicovery in all namespaces.
  podMonitor:
    # Whether to add the `PodMonitor` resource or not.
    # `prometheus-operator` CRDs are necessary, otherwise you'll get an error.
    enabled: true
    # Additional labels for PodMonitor
    additionalLabels:
       release: prometheus
    # Additional relabelings to include in the `PodMonitor`.
    extraRelabelings: []
    # metricRelabelings to include in the `PodMonitor`.
    metricRelabelings: []

# Sources to add to the generated `vector` config (besides "built-in" kubernetes
# logs source).
# DEPRECATED. Use customConfig instead
sources: {}


# Transforms to add to the generated `vector` config.
# DEPRECATED. Use customConfig instead
transforms: {}


# Sinks to add to the generated `vector` config.
# DEPRECATED. Use customConfig instead
sinks: {}

extraObjects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: vector-worker-default
      namespace: {{NAME}}
    data:
      {% for key, value in config_maps.items() %}{{ key }}: {% if not value is mapping %}{{ value }}
      {% else %}{% for sub_key, sub_value in value.items() %}{{ sub_key }}: {{ sub_value}}{% endfor %}
      {% endif %}{% endfor %}
  
  - apiVersion: cert-manager.io/v1
    kind: Certificate
    metadata:
      name: vector-msk-mtls
      namespace: {{NAME}}
    spec:
      # Secret names are always required.
      secretName: vector-msk-mtls
      duration: 38640h0m0s # 90d
      renewBefore: 360h0m0s # 15d
      # The use of the common name field has been deprecated since 2000 and is
      # discouraged from being used.
      commonName: vector
      privateKey:
        algorithm: RSA
        size: 2048
      usages:
        - server auth
        - client auth
      # At least one of a DNS Name, URI, or IP address is required.
      dnsNames:
        - {{DNSNAME | default("vector", true)}}
      issuerRef:
        name: {{CLUSTER_ISSUER_NAME | default("ghostburner-cluster-issuer", true)}}
        # We can reference ClusterIssuers by changing the kind here.
        # The default value is Issuer (i.e. a locally namespaced Issuer)
        kind: {{CLUSTER_ISSUER_KIND | default("AWSPCAClusterIssuer", true)}}
        # This is optional since cert-manager will default to this value however
        # if you are using an external issuer, change this to that issuer group.
        group: {{CLUSTER_ISSUER_GROUP | default("awspca.cert-manager.io", true)}}

  - apiVersion: v1
    kind: PersistentVolume
    metadata:
      name: s3-config-pv-{{NAME}}
    spec:
      capacity:
        storage: 1200Gi # ignored, required
      accessModes:
        - ReadOnlyMany # supported options: ReadWriteMany / ReadOnlyMany
      mountOptions:
        - region ap-southeast-2
      csi:
        driver: s3.csi.aws.com # required
        volumeHandle: s3-csi-driver-volume
        volumeAttributes:
          bucketName: {{CONFIG_S3_BUCKET}}

  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: s3-config-pvc
      namespace: {{NAME}}
    spec:
      accessModes:
        - ReadOnlyMany # supported options: ReadWriteMany / ReadOnlyMany
      storageClassName: "" # required for static provisioning
      resources:
        requests:
          storage: 1200Gi # ignored, required
      volumeName: s3-config-pv-{{NAME}}
  
  # if NAME ends with "-load-ch" then add the following
  {% if "-load-ch" in NAME %}
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: vector-ch-creds
    spec:
      provider: aws
      secretObjects:
      - secretName: vector-ch-creds
        type: Opaque
        data: 
        - objectName: ch-username 
          key: ch-username
        - objectName: ch-password 
          key: ch-password
        - objectName: ch-host 
          key: ch-host
      parameters:
        objects: |
            - objectName: "{{AWS_CH_SECRET_ARN}}"
              objectType: "secretsmanager"
              objectVersionLabel: "AWSCURRENT"
              jmesPath:
                - path: ch_username
                  objectAlias: ch-username
                - path: ch_password
                  objectAlias: ch-password
                - path: ch_host
                  objectAlias: ch-host
  {% endif %}
  {% if NAME == "vector-receiver" %}
  - apiVersion: secrets-store.csi.x-k8s.io/v1
    kind: SecretProviderClass
    metadata:
      name: vector-receiver-tls
      namespace: vector-receiver
    spec:
      provider: aws
      parameters:
        objects: |
            - objectName: "{{AWS_VECTOR_TLS_CA_SECRET_ARN}}"
              objectType: "secretsmanager"
              objectVersionLabel: "AWSCURRENT"
              objectAlias: "vector-receiver-ca.crt"
            - objectName: "{{AWS_VECTOR_TLS_CERT_SECRET_ARN}}"
              objectType: "secretsmanager"
              objectVersionLabel: "AWSCURRENT"
              objectAlias: "vector-receiver.crt"
            - objectName: "{{AWS_VECTOR_TLS_KEY_SECRET_ARN}}"
              objectType: "secretsmanager"
              objectVersionLabel: "AWSCURRENT"
              objectAlias: "vector-receiver.key"
  {% endif %}

#### KEDA
  - apiVersion: v1
    kind: Secret
    metadata:
      name: keda-msk-secrets
    stringData:
      sasl: "oauthbearer"
      saslTokenProvider: "aws_msk_iam"
      tls: "enable"
      key: ""
      cert: ""
  - apiVersion: keda.sh/v1alpha1
    kind: TriggerAuthentication
    metadata:
      name: keda-trigger-auth-kafka-credential
    spec:
      secretTargetRef:
      - parameter: saslTokenProvider
        name: keda-msk-secrets
        key: saslTokenProvider
      - parameter: tls
        name: keda-msk-secrets
        key: tls
      - parameter: cert
        name: vector-msk-mtls
        key: tls.crt
      - parameter: key
        name: vector-msk-mtls
        key: tls.key

  - apiVersion: keda.sh/v1alpha1
    kind: ScaledObject
    metadata:
      name: kafka-scaledobject
      annotations:
         scaledobject.keda.sh/transfer-hpa-ownership: "true"
    spec:
      scaleTargetRef:
        apiVersion: apps/v1
        kind: StatefulSet
        name: {{NAME}}
      pollingInterval: 30
      minReplicaCount: 0
      maxReplicaCount: 1
      cooldownPeriod: 300
      advanced:
        horizontalPodAutoscalerConfig:
          name: {{NAME}}
        restoreToOriginalReplicaCount: true
        scalingModifiers:
          target: "5"
          activationTarget: "1"
          formula: >
            (kafka > 0 && pod_count == 0)? 5 :
            (kafka > 0 && pod_count > 0 && kafka <= 5)? 3 :
            (kafka > 5 && pod_count > 0)? 6 :
            0
          metricType: Value
      triggers:
      - type: kafka
        name: kafka
        metadata:
          bootstrapServers: {{KAFKA_BROKERS}}
          consumerGroup: {{NAME}} # Make sure that this consumer group name is the same one as the one that is consuming topics
          scaleToZeroOnInvalidOffset: "false"
          lagThreshold: "1"
          activationThreshold: "0"
          offsetResetPolicy: latest
          awsRegion: "ap-southeast-2"
        authenticationRef:
          name: keda-trigger-auth-kafka-credential
      - type: prometheus
        name: pod_count
        metadata:
          serverAddress: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
          query: count(kube_pod_info{created_by_kind = "StatefulSet",namespace = "{{NAME}}"})
          threshold: "1"
          activationThreshold: "0"
      - type: prometheus
        name: pvc_avg
        metadata:
          serverAddress: http://prometheus-kube-prometheus-prometheus.prometheus.svc:9090
          query: avg(kubelet_volume_stats_used_bytes{namespace="{{NAME}}"}/kubelet_volume_stats_capacity_bytes{namespace="{{NAME}}"}) 
          threshold: "0.8"
          activationThreshold: "0"
      - type: cpu
        metricType: Utilization
        metadata:
          value: "80"
      - type: memory
        metricType: Utilization
        metadata:
          value: "85"