size: small
replicas: 1
image: harbor.hyperi.io/dfe/dfe-receiver
image_tag: latest
resources:
keda:
  enabled: false
  min_replicas: 2
  max_replicas: 10
  polling_interval: 30
  cooldown_period: 300
  kafka_trigger:
    consumer_group: dfe-receiver
    topic: ''
    lag_threshold: 100
    authentication_ref: ''
  cpu_trigger:
  prometheus_trigger:
  extra_triggers: []
  fallback_replicas: 2
hpa:
  enabled: false
  min_replicas: 1
  max_replicas: 4
  target_cpu_percent: 80
pod:
  annotations: {}
  labels: {}
  node_selector: {}
  tolerations: []
  affinity: {}
service:
  type: ClusterIP
  port: 8080
  metrics_port: 9090
config_secret:
  name: ''
  key: ''
extra_env: {}
