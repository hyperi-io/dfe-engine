# Project false positives for gitleaks: https://github.com/gitleaks/gitleaks#configuration

[extend]
useDefault = true

[allowlist]
description = "Project-specific false positive allowlist"

paths = [
    '''tests/.*\.py''',
    '''tests/fixtures/.*''',
    '''.env.example''',
]

regexes = [
    '''test-token''',
    '''example\.com''',
    '''llamatron''',
    # The API key in the docs' examples.
    '''dfe_ak_live_8a3f''',
    # The Makefile's curl -u takes shell variables, not a credential. History holds both forms.
    '''DFE_ENGINE_CLICKHOUSE_USERNAME:-default\}:\$\$\{DFE_ENGINE_CLICKHOUSE_PASSWORD''',
    '''\$\$ch_user:\$\$ch_pass''',
]

stopwords = ["example", "sample", "test", "mock", "fake", "dummy", "placeholder"]
