# Development services for DFE Engine API
#
# Prism mock server — frontend devs can develop against the API contract
# without running the real backend:
#
#   docker compose -f docker-compose.dev.yaml up prism
#
# Then point dfe-ui at http://localhost:4010 instead of :8000
#
# TypeScript type generation (run from host):
#   npx openapi-typescript openapi-spec/openapi.json -o types.ts

services:
  prism:
    # Digest-pinned (#106 P3.2) so the floating major tag cannot be repointed.
    image: stoplight/prism:5@sha256:3f6d29e31bfe0b99587f0f6f79c423858dd6a2ea7e1e4658273ed930a78a9acf
    command: mock /spec/openapi.json --host 0.0.0.0
    ports:
      - "4010:4010"
    volumes:
      - ./openapi-spec:/spec:ro
    # Bounded so a runaway mock cannot take the dev host down (#106 P3.2).
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
