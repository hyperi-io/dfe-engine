[project]
name = "dfe-engine"
version = "1.0.0"
description = "DFE Engine - Core library for Data Fusion Engine"
authors = [{ name = "HyperSec", email = "engineering@hypersec.io" }]
requires-python = ">=3.12.0,<4"
readme = "README.md"

dependencies = [
    # hs-lib for logging and common utilities
    "hs-lib>=0.1.0",
    # Data processing
    "pyarrow>=15.0.0",
    "pandas>=2.2",
    "numpy>=1.26.2",
    # Database connections
    "clickhouse-connect>=0.6.4",
    "clickhouse-driver>=0.2.6",
    "clickhouse-pool>=0.5.3",
    "sqlalchemy>=2.0.43",
    # Configuration and parsing
    "PyYAML>=6.0.3",
    "ruamel-yaml>=0.18.6",
    "python-dotenv>=1.0.1",
    "pydantic>=2.9.0",
    "sqlparse>=0.5.0",
    # AWS
    "boto3>=1.34.108",
    # Scheduling
    "apscheduler>=3.10.4",
    "aiocron>=1.8",
    "croniter>=2.0.5",
    # OpenSearch / HTTP
    "httpx>=0.28.1",
    "urllib3>=2.2.2",
    # Templating
    "Jinja2>=3.1.2",
    # Sigma rules
    "pysigma>=0.11.19",
    "valhallaapi>=0.6.0",
    # Utilities
    "python-dateutil>=2.8.2",
    "tabulate>=0.9.0",
    "pyparsing>=3.1.4",
    "platformdirs>=3.11.0",
    "psutil>=5.9.8",
    "importlib-metadata>=8.4.0",
    "gitpython>=3.1.44",
    # Kafka
    "confluent-kafka>=2.11.0",
]

[project.urls]
Repository = "https://github.com/hypersec-io/dfe-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfe_engine"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "pytest-asyncio>=0.23.6",
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.14.0",
    "coverage>=7.0.0",
    "requests>=2.28.1",
    "defusedxml>=0.7.1",
    "moto[s3]>=5.0.7",
    "ruff>=0.4.4",
    "Faker>=19.1.0",
]

[tool.pytest.ini_options]
python_paths = ["src/dfe_engine", "tests"]
minversion = "6.0"
log_cli = true
log_cli_level = "INFO"
python_files = "test_*.py"
addopts = "-vv --cov=src/dfe_engine --cov-report=term --cov-report=xml:cov.xml"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = ["S101", "S608"]  # S101=assert in tests, S608=SQL (ClickHouse queries)

[[tool.uv.index]]
name = "hypersec-repo"
url = "https://hypersec.jfrog.io/artifactory/api/pypi/hypersec-pypi-local/simple"
publish-url = "https://hypersec.jfrog.io/artifactory/api/pypi/hypersec-pypi-local"
explicit = true

[tool.uv.sources]
hs-lib = { index = "hypersec-repo" }
