[project]
name = "dfe-engine"
version = "1.3.35"
description = "DFE Engine - Core library for Data Fusion Engine"
authors = [{ name = "HyperSec", email = "engineering@hypersec.io" }]
license = { text = "LicenseRef-HyperSec-EULA" }
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # hs-pylib for logging and common utilities
    "hs-pylib>=2.15.2",
    # Data processing
    "pyarrow>=22.0.0",
    "pandas>=2.2.3",
    "numpy>=2.3.5",
    # Database connections
    "clickhouse-connect>=0.10.0",
    "sqlalchemy>=2.0.43",
    # Configuration and parsing
    "ruamel-yaml>=0.18.6",
    "pydantic>=2.12.0",
    "sqlparse>=0.5.4",
    # AWS
    "boto3>=1.42.4",
    # Scheduling
    "apscheduler>=3.11.1",
    "aiocron>=2.1",
    "croniter>=6.0.0",
    # HTTP clients
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "urllib3>=2.6.3",
    # Templating
    "Jinja2>=3.1.6",
    # Sigma rules
    "pysigma>=1.0.2",
    "valhallaapi>=0.6.0",
    # Utilities
    "python-dateutil>=2.9.0",
    "tabulate>=0.9.0",
    "pyparsing>=3.2.5",
    "platformdirs>=4.5.1",
    "psutil>=7.1.3",
    "importlib-metadata>=8.7.0",
    "gitpython>=3.1.45",
    "deepdiff>=8.0.0",
]

[project.urls]
Repository = "https://github.com/hypersec-io/dfe-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfe_engine"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-benchmark>=5.1.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.5.0",
    "coverage>=7.6.0",
    "defusedxml>=0.7.1",
    "moto[s3]>=5.1.20",
    "werkzeug>=3.1.5",  # Explicit constraint to fix CVE in moto's transitive dep
    "ruff>=0.8.0",
    "Faker>=33.0.0",
    "types-requests>=2.32.0",
    "psycopg[binary]>=3.2.0",
    "python-dotenv>=1.0.0",
]

[tool.pytest.ini_options]
python_paths = ["src/dfe_engine", "tests"]
minversion = "6.0"
log_cli = true
log_cli_level = "INFO"
python_files = "test_*.py"
addopts = "-vv -n 4 --cov=src/dfe_engine --cov-report=term-missing --cov-report=xml:cov.xml -m 'not integration'"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require ClickHouse/OpenSearch)",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except Exception as e:",  # Exclude generic exception handlers
]

[tool.coverage.run]
omit = ["**/custom_exceptions.py"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S"]
ignore = [
    "S101",  # S101=assert in tests
    "S608",  # S608=SQL (ClickHouse queries)
    "S105",  # S105=hardcoded passwords (test fixtures)
    "S110",  # S110=try-except-pass
    "S603",  # S603=subprocess shell (CI scripts)
    "S607",  # S607=subprocess partial exec (CI scripts)
    "B017",  # B017=pytest.raises without match (legacy tests)
    "B904",  # B904=raise from (TEMP: too many to fix now)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]  # Allow all security checks in tests
"src/dfe_engine/sigma/*" = ["S701"]  # Jinja2 autoescape (controlled templates)

[[tool.uv.index]]
name = "hypersec-repo"
url = "https://pypi.repo.hypersec.io/simple/"
explicit = true

[tool.uv.sources]
hs-pylib = { index = "hypersec-repo" }

[tool.bandit]
# Skip B608 (hardcoded SQL) - This is a database library that generates SQL queries.
# All queries use internal data from configuration/templates, not user input.
# Skip B701 (jinja2_autoescape_false) - We generate YAML/SQL configs, not HTML.
# XSS is not applicable; autoescape would break template output.
skips = ["B608", "B701"]
