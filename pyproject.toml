[project]
name = "dfe-engine"
# Placeholder: the real version is computed by semantic-release and stamped in
# CI at release time (hyperi-ci#105). Never hand-bump this -- a committed
# version here is a stale seed that a release can pick up by mistake.
version = "0.0.0"
description = "Config control plane for the HyperI Data Fusion Engine. Renders operator intent to git as YAML, Helm values and ClickHouse DDL for Argo CD to apply."
authors = [{ name = "HYPERI PTY LIMITED", email = "engineering@hyperi.com.au" }]
license = { text = "BUSL-1.1" }
requires-python = ">=3.14"
readme = "README.md"

dependencies = [
    # scalo (Apache-2.0) for logging + common utils
    # >=2.29.5:  scalo.crypto CryptoProfile posture + TLS escape valves (SCALO_TLS_*)
    # >=2.29.6:  scalo.resilience ReconnectingResilience (+ OutageState/ResilienceConfig/ServiceUnavailable)
    # >=2.29.12: expression.validate() enforces the CEL profile as an ALLOWLIST.
    #            Below this, a function in neither the allowed nor the disallowed
    #            set reached no check at all and validate() returned no errors, so
    #            a misspelt filter passed the UI's live validation (which calls
    #            straight through dfe_engine.cel.check_syntax) and then failed in
    #            the pipeline.
    # >=2.29.15: [metrics] now carries the OTel SDK, so a missing SDK no longer
    #            leaves a disabled backend that still reports backend=opentelemetry.
    #            This is the fix for the metrics bug the extras note below describes.
    # >=2.30.2:  SecretsConfig.exclude_rules, and scalo's internal Kafka consumer
    #            group ids derived from config.
    # >=2.30.7:  gauges export as OTel Gauges on every collection, so app status
    #            keeps seeing the engine's info and start time; ResourceMetrics
    #            (memory, CPU, fds) and HttpServerMetricsMiddleware, which api/app.py
    #            imports.
    # >=2.31.3:  deployment contract schema 4, the version the scalo-service
    #            library chart validates the published thin chart against.
    # >=2.31.4:  secrets: enabled=False disables every cache tier, and an OpenBao
    #            login that is rate limited, redirected or unreachable raises
    #            ProviderError rather than AuthenticationError.
    # >=2.31.5:  a retried HTTP error keeps the socket error under it, which
    #            http_errors.describe_http_error reads as transport_failure.
    # >=2.31.8:  OpenTelemetry spans flush on exit, bounded at 2s. Under SDK 1.45
    #            earlier releases flushed nothing, so the last spans were lost.
    # >=2.31.9:  importing scalo loads no .env, so init_scalo_logger loads it
    #            through get_config() before it reads LOG_LEVEL and LOG_FORMAT.
    # >=2.31.10: each OTel metrics backend takes its meter from its own provider,
    #            so a second metrics manager no longer lands on the first's readers.
    # >=2.31.11: scalo.logger.filters.is_credential_name, the one credential-name
    #            matcher appmgmt/contract.py and source/models.py ask.
    # >=2.31.12: scalo.logger.filters.mask_url_userinfo, the URL password masker
    #            dfe_engine.masking calls.
    # >=2.31.13: scalo.logger.filters.url_passwords, which dfe_engine.masking reads
    #            a written URL's passwords with.
    # >=2.31.14: the AWS secrets provider takes kms_key_id and recovery_window_days,
    #            has no us-east-1 default region, and raises SecretPendingDeletionError.
    # Upper bound: <3 is the API-stability boundary. An unbounded `>=` is invisible
    # to Renovate -- the constraint is satisfied by every future release, so no PR
    # is ever raised and the version moves silently in the lock.
    # [metrics]: scalo's default metrics backend dual-exports -- Prometheus (/metrics)
    # AND OTLP -- and from 2.29.15 the single [metrics] extra pulls in both
    # prometheus_client and the OTel SDK, so it honours both. WITHOUT it scalo logs
    # "Prometheus metrics disabled (prometheus_client not installed)" yet still reports
    # "backend=prometheus" -- the engine looks instrumented while exporting nothing and
    # /metrics 404s, and self-monitoring (one of the two default E2E acceptance tests)
    # goes green while reporting nothing. [opentelemetry] is no longer a separate
    # extra: [metrics] carries the SDK.
    "scalo[expression,http,metrics]>=2.31.17,<3",
    # The DFE schema trees as package data under dfe_schemas/data/, replacing
    # the `schemas` git submodule. schema_loader resolves them through
    # importlib.resources; the Dockerfile bakes its seed from the installed
    # wheel. Floor is the release whose filebeat meta schema promotes
    # data_stream.dataset to its own column, the identifier a beats source routes
    # on; uv.lock pins the hash.
    # Upper bound: <1 is the API-stability boundary while dfe-schemas is 0.x.
    "dfe-schemas>=0.2.13,<1",
    # Data processing
    "pandas>=3.0.3",
    "numpy>=2.5.4",
    # Database connections
    "clickhouse-connect>=1.10.0",
    # Configuration and parsing
    "ruamel-yaml>=0.19.1",
    "pydantic>=2.14.1",
    # AWS
    "boto3>=1.43.113",
    # Scheduling
    "croniter>=6.2.2",
    # HTTP clients
    # 0.28.1 (2024-12) is the latest stable. 1.0 is dev-only on PyPI (dev6, 2026-08-31) and upstream is active.
    # Imported by the dfe CLI client (cli/auto/client.py) and required by scalo's http extra.
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    # Templating
    # 3.1.6 (2025-03) is the latest release. Imported by pipeline/pipeline.py and required by pysigma.
    "Jinja2>=3.1.6",
    # Sigma rules
    # Held below 2.0 for GA: the Sigma translation core, upgraded post-GA with its backends.
    "pysigma>=1.4.0,<2",
    # Utilities
    "tabulate>=0.10.0",
    "pyparsing>=3.3.2",
    "platformdirs>=4.13.0",
    "psutil>=7.2.2",
    # Git (deploy-repo gitops bridge) -- same lib scalo uses internally
    "dulwich>=1.2.7",
    # Authentication
    "bcrypt>=5.0.0",
    # OIDC relying-party (external IdP termination) + SCIM identity schema
    "authlib>=1.9.0",
    # authlib's HTTP client imports httpx2 first and warns on every start when it falls back to httpx.
    "httpx2>=2.13.1",
    # Signs the OIDC RP session cookie (SessionMiddleware / Authlib OAuth state+nonce)
    # Starlette's SessionMiddleware imports it and does not require it, so this is the only thing that installs it.
    # 2.2.0 (2024-04) is the latest release, and pallets/itsdangerous last committed 2025-06.
    "itsdangerous>=2.2.0",
    # Held on 0.6 for GA: later 0.x minors change the SCIM models' API.
    "scim2-models>=0.6.12,<0.7",
    # Document store for control-plane state (accounts now; preferences, teams
    # later) over FerretDB / mongo wire protocol. Sync client on purpose -- the
    # engine is a low-volume control plane, so no async driver is warranted.
    "pymongo>=4.18.3",
    # Alerting / notifications
    # Held below 2.0 for GA: notification delivery, upgraded post-GA with alerting.
    "apprise>=1.11.0,<2",
    # Transitive floor (apprise -> requests-oauthlib): CVE-2026-49265, PKCE verifier timing compare, fixed in 4.0.0.
    "oauthlib>=4.0.0",
    # API server
    # Floor 0.142: the apps pass FastAPI(telemetry=...), which earlier releases reject.
    "fastapi>=0.143.0",
    "python-multipart>=0.0.32",
    "starlette>=1.8.0",
    # Floor 50: GHSA PKCS#7 Bleichenbacher oracle, vulnerable >=44,<50.
    "cryptography>=50.0.0",
    "uvicorn[standard]>=0.54.0",
    # Must stay >=2.14.0: CVE-2026-102274, one malformed JWK aborts parsing of the whole JWK Set.
    "PyJWT[crypto]>=2.15.1",
    "sse-starlette>=3.4.5",
    # Transitive override: diskcache pulled in by pySigma for MITRE ATT&CK caching.
    # 5.6.3 (2023-08) is the latest release and the repo's last commit is 2024-03, so it is unmaintained.
    # CVE-2025-69872 (unsafe pickle, CVSS 9.8): no upstream fix — maintainer unresponsive
    # since Aug 2023, community PR #359 unreviewed. The irony: a security tool's dependency
    # chain introduces a critical CVE. Accepted risk — dfe-engine never imports diskcache
    # directly, cache dir has 0700 perms, and K8s pods provide filesystem isolation.
    "diskcache>=5.6.3",
    "msal>=1.37.0",
    "google-auth>=2.62.0",
    "google-api-python-client>=2.198.0",
    # dfe CLI: click is the command framework, jmespath backs the --query
    # projection (promoted from transitive to direct deps for the auto-CLI).
    "click>=8.4.2",
    "jmespath>=1.1.0",
    # Kafka topic admin: a source deploy creates its own _land/_load topics rather
    # than leaving them to the broker's auto-create. Ships manylinux wheels for
    # x86_64 and aarch64, so neither image platform builds librdkafka from source.
    "confluent-kafka>=2.16.0",
    # Sampler smart (the default) and anomaly modes. [enhanced] adds fuzzy dedup, which
    # SamplerSettings.level (default enhanced) uses. >=3.5.3: every dependency ships a wheel
    # (no drain3 sdist), which the image's UV_NO_BUILD=1 install needs.
    "logreducer[enhanced]>=3.5.3",
    "faker>=40.43.0",
    "sqlglot>=30.22.0",
]

[project.urls]
Repository = "https://github.com/hyperi-io/dfe-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfe_engine"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/config",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "pytest-xdist>=3.8.0",
    "coverage>=7.14.3",
    "moto[s3,secretsmanager]>=5.2.4",
    "werkzeug>=3.1.9",
    "ruff>=0.17.0",
    "Faker>=40.43.0",
    "types-requests>=2.33.0.20261006",
    "python-dotenv>=1.2.2",
    # 2.4.0 (2025-05) is the latest release and the repo is active (commit 2026-10-15).
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
minversion = "9.1.1"
log_cli = true
log_cli_level = "INFO"
python_files = "test_*.py"
# /tmp is a shared tmpfs with a fixed inode cap: keep only failed-test dirs, one per name.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# No worker count here on purpose: hyperi-ci derives it from the host it runs
# on, and a number pinned here is correct on exactly one machine (hyperi-ci#152).
addopts = "-vv --cov=src/dfe_engine --cov-report=term-missing --cov-report=xml:cov.xml -m 'not integration and not live and not upstream'"
testpaths = ["tests"]
asyncio_mode = "auto"
# Permanent hang guard (pytest-timeout): fail ANY test running longer than
# `timeout` seconds and dump every thread's stack, so a wedged test (blocked
# socket / gRPC / ClickHouse connect, OTLP exporter shutdown-block) fails fast
# with a traceback instead of stalling the run to the CI job wall-clock. The
# `thread` method is REQUIRED here: the block can sit in a worker thread (the
# anyio lifespan-startup thread, an OTLP export thread) that the `signal`
# method (main-thread SIGALRM only, and unusable under `-n` xdist) cannot
# interrupt. 300s clears the slowest legit path (integration docker CH pull
# ~240s on first image fetch) yet still catches a real hang.
timeout = 300
timeout_method = "thread"
filterwarnings = [
    # starlette 1.x deprecates httpx-0.x under TestClient and points at httpx2; the
    # httpx2 migration is a separate follow-up (test-infra only; prod unaffected).
    "ignore:Using .httpx. with .starlette.testclient",
    # pytest-benchmark can't run under xdist and the suite always runs -n 4, so
    # benchmarks are intentionally disabled here (run them with -p no:xdist).
    "ignore:Benchmarks are automatically disabled because xdist plugin is active",
    # Deliberate signal: {customer_filters} only handles 0/1 surrounding spaces;
    # the test documents that known limitation on purpose.
    "ignore:LIMITATION DETECTED",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require ClickHouse)",
    "e2e: End-to-end tests",
    "live: Against a REAL system, never in CI: a deployed DFE (needs DFE_E2E_* env) or a Google Workspace (needs DFE_LIVE_GOOGLE_* env, or DFE_GOOGLE_SA_JSON and DFE_OIDC_GOOGLE_FIXTURE_USER for the service account path). Skipped without that env, and the full tier excludes it by name",
    "upstream: Validates the importer against LIVE external schema repos (elastic/beats etc.; network, CI-excluded)",
    "slow: Slow running tests",
    "smoke: Startup smoke tests (mandatory, every push)",
    "requires_schemas: Tests that need the dfe-schemas package installed",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except Exception as e:",  # Exclude generic exception handlers
]
fail_under = 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.

[tool.coverage.run]
omit = [
    "**/__init__.py",
    "**/custom_exceptions.py"
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "config",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "I", "UP", "N", "PT", "RUF", "PIE", "T20"]
ignore = [
    "S105",  # hardcoded passwords (false positives: sentinel values, masking strings, sigma tokens)
    "S112",  # try-except-continue (intentional skip of invalid configs)
    "S603",  # subprocess shell (CI scripts)
    "S607",  # subprocess partial exec (CI scripts)
    "B017",  # pytest.raises without match (legacy tests)
    "B904",  # raise from (TEMP: too many to fix now)
    "B008",  # Depends in defaults (idiomatic FastAPI)
    "RUF013",  # implicit-optional (TEMP: needs unsafe-fixes)
    "RUF002",  # ambiguous-unicode-character-docstring (en-dash false positives)
    "RUF012",  # mutable-class-default (Pydantic/SQLModel pattern)
    "UP042",  # replace-str-enum (TEMP: migration needed)
    "N805",   # invalid-first-argument-name (Pydantic validators)
    "N818",   # error-suffix-on-exception-name
    "UP046",  # non-pep695-generic-class (TEMP: 3.12+ migration)
    "RUF022", # unsorted-dunder-all (TEMP: needs unsafe-fixes)
    "RUF046", # unnecessary-cast-to-int (TEMP)
    "RUF059", # unused-unpacked-variable (TEMP)
    "PIE810", # multiple-starts-ends-with (stylistic)
    "E402",   # module-import-not-at-top (conditional imports)
    "T201",   # print (TEMP: needs audit)
    "RUF005", # collection-literal-concatenation
]
# vulture's own codes, which vulture reads from `# noqa` (V105: a method only a framework calls).
external = ["V"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/dfe_engine/sigma/*" = ["S701"]  # Jinja2 autoescape (controlled templates)
# Vendored Apache-2.0 files (aws-cli/botocore) - kept as close to upstream as
# possible; do not modernise idioms the upstream still uses. See vendor/NOTICE.
"src/dfe_engine/cli/auto/vendor/*" = [
    "UP031",  # percent-format (upstream style)
    "B905",   # zip() without strict= (upstream targets older Python)
    "UP032",
    "C401",
    "SIM",
]
"tests/**/*.py" = [
    "S101",
    "S106",  # test fixtures use hardcoded passwords
    "S311",  # seeded RNGs in tests are not cryptographic
    "S108",  # /tmp and fixed paths in tests are intentional
    "S110",  # fixture teardown swallows errors from objects already gone
    "S608",  # tests build SQL against throwaway test databases
    "S701",  # tests render SQL rule templates, not HTML
    "PT011",  # broad pytest.raises in tests (ValueError/Exception)
    "PT012",  # multi-statement raises blocks (patch/setup inside raises)
    "PT017",  # assertions on exception in except (acceptable in tests)
]

[tool.ty.environment]
# Tests import shared helpers as `common.*` from tests/, the path pytest's pythonpath adds.
extra-paths = ["tests"]


[project.scripts]
# Order matters: hyperi-ci's generate-artefacts build step invokes the FIRST
# entry here (deployment/manifest.py python_entry_point) as `<script>
# generate-artefacts`. That MUST be the scalo daemon `dfe-engine`, which carries
# deployment_contract()/generate-artefacts. The auto-CLI `dfe` (OpenAPI-generated)
# has no such subcommand, so listing it first breaks the release Build. Keep the
# daemon first.
dfe-engine = "dfe_engine.api:run_dev_server"
dfe = "dfe_engine.cli.auto.main:main"
dfe-hunt-runner = "dfe_engine.hunt_runner.cli:main"
dfe-keda-shim = "dfe_engine.keda_shim.cli:main"

[project.entry-points."dfe_engine.services"]
receiver = "dfe_engine.services.plugins_builtin.receiver:plugin"
loader = "dfe_engine.services.plugins_builtin.loader:plugin"
archiver = "dfe_engine.services.plugins_builtin.archiver:plugin"
transform-vector = "dfe_engine.services.plugins_builtin.transform_vector:plugin"
transform-vrl = "dfe_engine.services.plugins_builtin.transform_vrl:plugin"
transform-wasm = "dfe_engine.services.plugins_builtin.transform_wasm:plugin"
fetcher = "dfe_engine.services.plugins_builtin.fetcher:plugin"

[tool.bandit]
# Skip B608 (hardcoded SQL) - This is a database library that generates SQL queries.
# All queries use internal data from configuration/templates, not user input.
# Skip B701 (jinja2_autoescape_false) - We generate YAML/SQL configs, not HTML.
# XSS is not applicable; autoescape would break template output.
skips = [
    "B104",  # B104=hardcoded_bind_all_interfaces — 0.0.0.0 is intentional for containerised service
    "B608",  # B608=hardcoded_sql — queries use internal config/template data, not user input
    "B701",  # B701=jinja2_autoescape_false — we generate YAML/SQL configs, not HTML
]
