[project]
name = "dfe-engine"
# A placeholder: CI stamps the release version. Never set it by hand.
version = "0.0.0"
description = "The DFE control plane: an API and CLI that turn operator changes into git commits a deployment runs from."
authors = [{ name = "HYPERI PTY LIMITED", email = "engineering@hyperi.com.au" }]
license = { text = "BUSL-1.1" }
requires-python = ">=3.14"
readme = "README.md"

dependencies = [
    # [kafka] supplies genson to scalo.kafka.providers. Without [metrics], /metrics 404s.
    "scalo[api,cli,expression,http,kafka,metrics,secrets-kubernetes]>=2.32.8,<3",
    # Floor: query_log_archive 1.1.0, the CPU columns the smoother reads.
    "dfe-schemas>=0.2.32,<1",
    "pandas>=3.0.3",
    "numpy>=2.5.4",
    "clickhouse-connect>=1.10.0",
    "ruamel-yaml>=0.19.1",
    # libyaml, for the source catalogue's file count: ruamel's pure-Python parser is too slow there.
    "pyyaml>=6.0.3",
    "pydantic>=2.14.1",
    "boto3>=1.43.113",
    "croniter>=6.2.2",
    # scalo's http extra needs it.
    "httpx>=0.28.1",
    "requests>=2.34.2",
    "urllib3>=2.7.0",
    "Jinja2>=3.1.6",
    "pysigma>=2.0.2,<3",
    # LGPL-3.0: the one ClickHouse backend for pySigma.
    "pysigma-backend-clickhouse>=1.1.1",
    "tabulate>=0.10.0",
    "pyparsing>=3.3.2",
    "platformdirs>=4.13.0",
    "psutil>=7.2.2",
    "dulwich>=1.2.7",
    "bcrypt>=5.0.0",
    "authlib>=1.9.4",
    # authlib's HTTP client imports httpx2 first and warns on every start when it falls back to httpx.
    "httpx2>=2.13.1",
    # Starlette's SessionMiddleware signs the OIDC session cookie with it and does not install it.
    "itsdangerous>=2.2.0",
    # Held on 0.6: later 0.x minors change the SCIM models' API the engine is written against.
    "scim2-models>=0.6.12,<0.7",
    # Held below 2.0: the notification code is written against the 1.x API.
    "apprise>=1.11.0,<2",
    # Transitive floor (apprise -> requests-oauthlib): CVE-2026-49265 and CVE-2026-49272.
    "oauthlib>=4.0.1",
    # The apps pass FastAPI(telemetry=...), which earlier releases reject.
    "fastapi>=0.143.0",
    "python-multipart>=0.0.32",
    "starlette>=1.8.0",
    # Floor: the PKCS#7 Bleichenbacher oracle advisory.
    "cryptography>=50.0.0",
    "uvicorn[standard]>=0.54.0",
    # Floor: CVE-2026-102274, one malformed JWK aborts parsing of the whole JWK Set.
    "PyJWT[crypto]>=2.15.1",
    "sse-starlette>=3.4.5",
    "msal>=1.37.0",
    "google-auth>=2.62.0",
    "google-api-python-client>=2.198.0",
    # Kafka topic admin: a source deploy creates its _land and _load topics.
    "confluent-kafka>=2.16.0",
    # The sampler's smart and anomaly modes. [enhanced] adds the fuzzy dedup SamplerSettings.level uses.
    "logreducer[enhanced]>=3.5.6",
    "faker>=40.43.0",
    "sqlglot>=30.22.0",
]

[project.urls]
Repository = "https://github.com/hyperi-io/dfe-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfe_engine"]

[tool.hatch.build.targets.sdist]
exclude = [
    "/config",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark>=5.2.3",
    "pytest-xdist>=3.8.0",
    "coverage>=7.14.3",
    "moto[s3,secretsmanager]>=5.2.4",
    "werkzeug>=3.1.9",
    "ruff>=0.17.0",
    "Faker>=40.43.0",
    "types-requests>=2.33.0.20261006",
    "python-dotenv>=1.2.2",
    "pytest-timeout>=2.4.0",
]

[tool.uv]
# Same-org packages are exempt from any uv release-age gate, so a fresh dfe-schemas or scalo release resolves at once.
exclude-newer-package = { dfe-schemas = false, scalo = false }

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
minversion = "9.1.1"
log_cli = true
log_cli_level = "INFO"
python_files = "test_*.py"
# /tmp is a shared tmpfs with a fixed inode cap: keep only failed-test dirs, one per name.
tmp_path_retention_policy = "failed"
tmp_path_retention_count = 1
# No worker count: hyperi-ci sizes it to the host.
addopts = "-vv --cov=src/dfe_engine --cov-report=term-missing --cov-report=xml:cov.xml -m 'not integration and not live'"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Hang guard. `thread`, not `signal`: a hang can sit in a worker thread, and
# SIGALRM reaches only the main thread and does not work under xdist.
timeout = 300
timeout_method = "thread"
filterwarnings = [
    # starlette 1.x deprecates httpx-0.x under TestClient and points at httpx2.
    "ignore:Using .httpx. with .starlette.testclient",
    # Benchmarks need -p no:xdist.
    "ignore:Benchmarks are automatically disabled because xdist plugin is active",
    # A test reports the {customer_filters} spacing limit on purpose.
    "ignore:LIMITATION DETECTED",
]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require ClickHouse)",
    "e2e: End-to-end tests",
    "live: Against a REAL system, never in CI: a deployed DFE (needs DFE_E2E_* env) or a Google Workspace (needs DFE_LIVE_GOOGLE_* env, or DFE_GOOGLE_SA_JSON and DFE_OIDC_GOOGLE_FIXTURE_USER for the service account path). Skipped without that env, and the full tier excludes it by name",
    "slow: Slow running tests",
    "smoke: Startup smoke tests (mandatory, every push)",
    "requires_schemas: Tests that need the dfe-schemas package installed",
    "own_clickhouse: Holds a ClickHouse of its own: it creates or sweeps server-wide roles, users, row policies or profiles, which the run's shared server cannot isolate",
]
# Names the shared test containers and labels them (scalo.deployment.test_support).
shared_service_repo = "dfe-engine"

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except Exception as e:",  # Exclude generic exception handlers
]
fail_under = 70

[tool.coverage.run]
omit = [
    "**/__init__.py",
    "**/custom_exceptions.py"
]

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = [
    "config",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "I", "UP", "N", "PT", "RUF", "PIE", "T20"]
ignore = [
    "S105",  # hardcoded passwords (false positives: sentinel values, masking strings, sigma tokens)
    "S112",  # try-except-continue (intentional skip of invalid configs)
    "S603",  # subprocess shell (CI scripts)
    "S607",  # subprocess partial exec (CI scripts)
    "B017",  # pytest.raises without match (legacy tests)
    "B904",  # raise from (TEMP: too many to fix now)
    "B008",  # Depends in defaults (idiomatic FastAPI)
    "RUF013",  # implicit-optional (TEMP: needs unsafe-fixes)
    "RUF002",  # ambiguous-unicode-character-docstring (en-dash false positives)
    "RUF012",  # mutable-class-default (Pydantic/SQLModel pattern)
    "UP042",  # replace-str-enum (TEMP: migration needed)
    "N805",   # invalid-first-argument-name (Pydantic validators)
    "N818",   # error-suffix-on-exception-name
    "UP046",  # non-pep695-generic-class (TEMP: 3.12+ migration)
    "RUF022", # unsorted-dunder-all (TEMP: needs unsafe-fixes)
    "RUF046", # unnecessary-cast-to-int (TEMP)
    "RUF059", # unused-unpacked-variable (TEMP)
    "PIE810", # multiple-starts-ends-with (stylistic)
    "E402",   # module-import-not-at-top (conditional imports)
    "T201",   # print (TEMP: needs audit)
    "RUF005", # collection-literal-concatenation
    "D105",   # magic methods: the protocol defines what each one does
    "D107",   # __init__: Google style documents the arguments on the class
]
# vulture's own codes, which vulture reads from `# noqa` (V105: a method only a framework calls).
external = ["V"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
# hyperi-ci's `--select D` re-enables `ignore`, so D105 and D107 stay off here.
"src/**/*.py" = ["D105", "D107"]
"src/dfe_engine/sigma/*" = ["S701"]  # Jinja2 autoescape (controlled templates)
# Each entry is a bare attribute access, which is how vulture sees a use.
"src/vulture_whitelist.py" = ["B018"]
"tests/**/*.py" = [
    "S101",
    "S106",  # test fixtures use hardcoded passwords
    "S311",  # seeded RNGs in tests are not cryptographic
    "S108",  # /tmp and fixed paths in tests are intentional
    "S110",  # fixture teardown swallows errors from objects already gone
    "S608",  # tests build SQL against throwaway test databases
    "S701",  # tests render SQL rule templates, not HTML
    "PT011",  # broad pytest.raises in tests (ValueError/Exception)
    "PT012",  # multi-statement raises blocks (patch/setup inside raises)
    "PT017",  # assertions on exception in except (acceptable in tests)
]

[tool.ty.environment]
# Tests import shared helpers as `common.*` from tests/, the path pytest's pythonpath adds.
extra-paths = ["tests"]

# hyperi-ci runs `vulture src/`, so src/vulture_whitelist.py is scanned with the package.
[tool.vulture]
# Frameworks call these through registration, which leaves no caller in the source.
ignore_decorators = [
    "@router.*",  # FastAPI routes
    "@app.*",  # FastAPI app routes and exception handlers
    "@*.command",  # click and typer commands
    "@field_validator",  # pydantic
    "@model_validator",
    "@field_serializer",
    "@register_adapter",  # query datasource adapters, looked up by name
]
# pydantic reads model_config off the class.
ignore_names = ["model_config"]

[project.scripts]
# Keep the daemon first: hyperi-ci runs the FIRST entry as `<script>
# generate-artefacts`, which only `dfe-engine` carries.
dfe-engine = "dfe_engine.api:run_dev_server"
dfe = "dfe_engine.cli.auto.main:main"
dfe-hunt-runner = "dfe_engine.hunts.runner_cli:main"
dfe-keda-shim = "dfe_engine.keda_shim.cli:main"

[tool.bandit]
# B608: the SQL is built from config and templates. B701: the templates render YAML and SQL, not HTML.
skips = [
    "B104",  # B104=hardcoded_bind_all_interfaces — 0.0.0.0 is intentional for containerised service
    "B608",  # B608=hardcoded_sql — queries use internal config/template data, not user input
    "B701",  # B701=jinja2_autoescape_false — we generate YAML/SQL configs, not HTML
]
