[project]
name = "dfe-engine"
version = "1.6.9-dev.2"
description = "DFE Engine - Core library for Data Fusion Engine"
authors = [{ name = "HyperSec", email = "engineering@hypersec.io" }]
license = { text = "LicenseRef-HyperSec-EULA" }
requires-python = ">=3.12"
readme = "README.md"

dependencies = [
    # hyperi-pylib for logging and common utilities
    "hyperi-pylib[expression,http]>=2.24.3",
    # Data processing
    "pyarrow>=23.0.1",
    "pandas>=3.0.1",
    "numpy>=2.4.2",
    # Database connections
    "clickhouse-connect>=0.13.0",
    # Configuration and parsing
    "ruamel-yaml>=0.19.1",
    "pydantic>=2.12.5",
    # AWS
    "boto3>=1.42.60",
    # Scheduling
    "apscheduler>=3.11.2",
    "aiocron>=2.1",
    "croniter>=6.0.0",
    # HTTP clients
    "httpx>=0.28.1",
    "requests>=2.32.5",
    "urllib3>=2.6.3",
    # Templating
    "Jinja2>=3.1.6",
    # Sigma rules
    "pysigma>=1.1.1",
    "valhallaapi>=0.6.2",
    # Utilities
    "python-dateutil>=2.9.0",
    "tabulate>=0.9.0",
    "pyparsing>=3.3.2",
    "platformdirs>=4.9.2",
    "psutil>=7.2.2",
    "deepmerge>=2.0",
    # Authentication
    "bcrypt>=5.0.0",
    # Alerting / notifications
    "apprise>=1.9.7",
    # API server
    "fastapi>=0.135.1",
    "uvicorn[standard]>=0.41.0",
    "python-jose[cryptography]>=3.5.0",
    "cryptography>=46.0.5",  # CVE fix: subgroup attack on SECT curves (>=46.0.5)
    "sse-starlette>=3.3.2",
    # Transitive override: diskcache pulled in by pySigma.
    # CVE-2025-69872 (unsafe pickle) acknowledged — no upstream patch available.
    # Acceptable: cache files are not writable by untrusted parties in our deployment.
    "diskcache>=5.6.3",
]

[project.urls]
Repository = "https://github.com/hyperi-io/dfe-engine"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dfe_engine"]

[tool.hatch.build.targets.sdist]
exclude = [
    # /.claude, /hyperi-ai, /ci excluded automatically by hyperi-ci build handler
    "/config",
    "/schemas",
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-benchmark>=5.2.3",
    "pytest-mock>=3.15.1",
    "pytest-xdist>=3.8.0",
    "coverage>=7.13.4",
    "defusedxml>=0.7.1",
    "moto[s3]>=5.1.21",
    "werkzeug>=3.1.6",
    "ruff>=0.15.4",
    "Faker>=40.5.1",
    "types-requests>=2.32.4",
    "psycopg[binary]>=3.3.3",
    "python-dotenv>=1.2.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
minversion = "6.0"
log_cli = true
log_cli_level = "INFO"
python_files = "test_*.py"
addopts = "-vv -n 4 --cov=src/dfe_engine --cov-report=term-missing --cov-report=xml:cov.xml -m 'not integration'"
testpaths = ["tests"]
markers = [
    "unit: Unit tests (no external dependencies)",
    "integration: Integration tests (require ClickHouse)",
    "e2e: End-to-end tests",
    "slow: Slow running tests",
    "requires_schemas: Tests that need the dfe-schemas submodule checked out",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "except Exception as e:",  # Exclude generic exception handlers
]

[tool.coverage.run]
omit = [
    "**/__init__.py",
    "**/custom_exceptions.py"
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "S", "I", "UP", "N", "PT", "RUF", "PIE", "T20"]
ignore = [
    "S101",  # S101=assert in tests (TEMP: remove after hyperi-ci two-tier quality released)
    "S105",  # S105=hardcoded passwords (false positives: sentinel values, masking strings, sigma tokens)
    "S608",  # S608=SQL (ClickHouse queries)
    "S110",  # S110=try-except-pass
    "S112",  # S112=try-except-continue (intentional skip of invalid configs)
    "S603",  # S603=subprocess shell (CI scripts)
    "S607",  # S607=subprocess partial exec (CI scripts)
    "S701",  # S701=jinja2 autoescape (controlled templates)
    "B017",  # B017=pytest.raises without match (legacy tests)
    "B904",  # B904=raise from (TEMP: too many to fix now)
    "B008",  # B008=Depends in defaults (idiomatic FastAPI pattern)
    "RUF013",  # implicit-optional (TEMP: too many to fix now, needs unsafe-fixes)
    "RUF002",  # ambiguous-unicode-character-docstring (false positives on en-dash)
    "RUF012",  # mutable-class-default (Pydantic/SQLModel models use this pattern)
    "UP042",  # replace-str-enum (TEMP: requires migration from str,Enum to StrEnum)
    "N805",   # invalid-first-argument-name (Pydantic validators use cls)
    "N818",   # error-suffix-on-exception-name (existing exception names)
    "UP046",  # non-pep695-generic-class (TEMP: needs 3.12+ generic syntax migration)
    "RUF022", # unsorted-dunder-all (TEMP: needs unsafe-fixes)
    "RUF046", # unnecessary-cast-to-int (TEMP)
    "RUF059", # unused-unpacked-variable (TEMP)
    "PIE810", # multiple-starts-ends-with (stylistic, low value)
    "E402",   # module-import-not-at-top (conditional imports)
    "T201",   # print (TEMP: needs audit — may be intentional CLI output)
    "RUF005", # collection-literal-concatenation
    # TEMP: test-related rules — remove after hyperi-ci two-tier quality released
    "S106",   # hardcoded-password-func-arg (test fixtures)
    "S108",   # hardcoded-temp-file (test temp dirs)
    "PT003",  # fixture scope
    "PT006",  # parametrize names type
    "PT011",  # raises too broad
    "PT012",  # raises multiple statements
    "PT017",  # assert in except
    "PT018",  # composite assertion
    "N803",   # invalid argument name (test fixtures)
    "RUF003", # ambiguous unicode comment
    "RUF015", # unnecessary iterable allocation
    "RUF043", # pytest raises ambiguous
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"src/dfe_engine/sigma/*" = ["S701"]  # Jinja2 autoescape (controlled templates)
"ci/*" = ["S", "F841"]  # CI submodule (legacy, being removed)


[project.scripts]
dfe-api = "dfe_engine.api:run_dev_server"

[project.entry-points."dfe_engine.services"]
receiver = "dfe_engine.services.plugins_builtin.receiver:plugin"
loader = "dfe_engine.services.plugins_builtin.loader:plugin"
archiver = "dfe_engine.services.plugins_builtin.archiver:plugin"
transform-vector = "dfe_engine.services.plugins_builtin.transform_vector:plugin"
transform-vrl = "dfe_engine.services.plugins_builtin.transform_vrl:plugin"
transform-wasm = "dfe_engine.services.plugins_builtin.transform_wasm:plugin"
fetcher = "dfe_engine.services.plugins_builtin.fetcher:plugin"

[tool.bandit]
# Skip B608 (hardcoded SQL) - This is a database library that generates SQL queries.
# All queries use internal data from configuration/templates, not user input.
# Skip B701 (jinja2_autoescape_false) - We generate YAML/SQL configs, not HTML.
# XSS is not applicable; autoescape would break template output.
skips = [
    "B104",  # B104=hardcoded_bind_all_interfaces — 0.0.0.0 is intentional for containerised service
    "B608",  # B608=hardcoded_sql — queries use internal config/template data, not user input
    "B701",  # B701=jinja2_autoescape_false — we generate YAML/SQL configs, not HTML
]
