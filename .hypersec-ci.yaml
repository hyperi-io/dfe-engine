# HyperI CI Configuration
# Generated by: attach.sh
# Documentation: https://github.com/hypersec-io/ci/blob/main/docs/CONFIGURATION.md
#
# Only set values that differ from defaults. See docs/CONFIGURATION.md for all options.

# Build type (REQUIRED for Python projects)
# Values: app (CLI/GUI binary) or package (library wheel)
# dfe-engine is both: wheel published to Artifactory AND container image deployed to Kubernetes.
build:
  type: package

# Publishing (set by attach.sh --no-publish)
publish:
  enabled: true
  container:
    enabled: true
    registry: jfrog
    dockerfile: Dockerfile
    platforms:
      - linux/amd64
      - linux/arm64
  helm:
    enabled: true
    registry: jfrog

# Uncomment to customise quality checks
# quality:
#   python:
#     pyright: disabled    # Skip type checking
#     vulture: blocking    # Fail on dead code
