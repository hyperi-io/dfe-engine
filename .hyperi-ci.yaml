# Override defaults with HYPERCI_* env vars.
classification: product

release:
  enabled: true
  channel: release
  # Private service: ship only the GHCR container image, never a wheel to PyPI.
  destinations:
    python: false
  # The committed spec carries the version, so a release regenerates it or main fails test_openapi_spec_committed.
  stamp_cmd: uv run python scripts/generate_openapi.py
  stamp_paths:
    - openapi/openapi.json
    - openapi/openapi.e2e.json
  # The thin chart, assembled from `dfe-engine generate-artefacts`. `library` must render the contract schema the locked scalo writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.15"

test:
  min_coverage: 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.
  native_tools: [helm]
  python:
    parallel: auto
    # Peak RSS of one process in a full core run was 1206 MiB (/usr/bin/time -v, 11 workers).
    worker_mem_mb: 1280
  full:
    # A release waits on a green full-tier run.
    required_for_release: true
    python:
      # Live tests need a deployed DFE. The full tier runs everything else.
      markers: "not live"
      # Skips the full tier accepts, each for something CI cannot provide.
      allow_skip:
        # Entra ID group sync is tested against a real tenant, never a mock.
        - "^Needs Entra sandbox$"
        # Google Workspace group sync is tested against a real tenant, never a mock.
        - "^Needs Google Workspace sandbox"
        # The case-folding account checks only apply on a case-insensitive filesystem. CI's is not.
        - "^this filesystem tells names apart by case$"
        # The HyperDX client tests need a running HyperDX, which CI does not stand up.
        - "^Requires running HyperDX instance$"

quality:
  python:
    # semgrep: warn matches hyperi-ci's own default (quality/semgrep.py:36), so
    # this is a deliberate pin rather than a downgrade. Its 38 findings are
    # Flask and Django rules firing on a FastAPI codebase -- the SQL-injection
    # hit is api/v1/queries.py:232, a raw-query endpoint behind
    # require_action(query_execute), where taking a caller's SQL is the point.
    semgrep: warn
    # Above hyperi-ci's warn default: these three are at zero, so a new finding fails the PR.
    vulture: blocking
    ty: blocking
    ruff_docstrings: blocking
  dep_licenses:
    # These wheels ship no licence file. The texts are upstream's, taken at the same version.
    overrides:
      - {name: dnspython, version: "2.9.0", licence: ISC, reason: "upstream LICENSE at tag v2.9.0", licence_file: third_party/dnspython-2.9.0-LICENSE}
      - {name: loguru, version: "0.7.3", licence: MIT, reason: "upstream LICENSE at tag 0.7.3", licence_file: third_party/loguru-0.7.3-LICENSE}
      - {name: scim2-models, version: "0.6.12", licence: Apache-2.0, reason: "LICENSE from the 0.6.12 sdist", licence_file: third_party/scim2-models-0.6.12-LICENSE}
      - {name: pysigma-backend-clickhouse, version: "1.1.1", licence: LGPL-3.0-only, reason: "Q99 A: the wheel's LICENSE.md is the LGPL-3.0 text and the package metadata declares none"}
      # Their metadata says only "BSD License", so the gate cannot name the variant.
      - {name: cloudpickle, version: "3.1.2", licence: BSD-3-Clause, reason: "Q115 A: the wheel's licence text is BSD-3-Clause"}
      - {name: google-re2, version: "1.1.20251105", licence: BSD-3-Clause, reason: "Q115 A: upstream google/re2 is BSD-3-Clause"}
      - {name: requests-oauthlib, version: "2.0.0", licence: ISC, reason: "Q115 A: the wheel's metadata and upstream licence are ISC"}
      - {name: scipy, version: "1.18.1", licence: BSD-3-Clause, reason: "Q115 A: the wheel's LICENSE.txt is BSD-3-Clause, and its bundled GPL and LGPL runtimes are in the notices"}
      # Our own package, so the entry holds for every version.
      - {name: dfe-schemas, licence: LicenseRef-HyperI, reason: "Q110 A: HyperI's own package, BUSL-1.1"}
  ignore:
    - tool: pip-audit
      ids:
        - CVE-2025-69872
        - PYSEC-2026-2447
      reason: "diskcache unsafe pickle: no upstream fix (5.6.3, released 2023-08-31, is the latest); pySigma pulls it in and dfe-engine never imports it; mitigated by pod isolation."
