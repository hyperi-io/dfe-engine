# Override defaults with HYPERCI_* env vars.

build:
  type: app

publish:
  enabled: true
  target: internal
  channel: release

test:
  min_coverage: 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.

quality:
  python:
    semgrep: warn
    vulture: warn
    ty: warn
    bandit_exclude_tests: true
    # pip-audit: warn because diskcache CVE-2025-69872 (unsafe pickle) has no
    # upstream fix — 5.6.3 is the latest release. Mitigated by deployment
    # architecture (cache dir not writable by untrusted users in K8s pods).
    # All other fixable CVEs are patched (cryptography, requests, ecdsa, pyasn1, pygments).
    pip_audit: warn
