# Override defaults with HYPERCI_* env vars.

build:
  type: app

publish:
  enabled: true
  target: internal
  channel: release

test:
  min_coverage: 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.

quality:
  python:
    semgrep: warn
    vulture: warn
    ty: warn
    bandit_exclude_tests: true
    # pip-audit: warn because some CVEs have no upstream fix:
    # - diskcache CVE-2025-69872 (unsafe pickle): 5.6.3 is latest. Mitigated by K8s pod isolation.
    # - ecdsa CVE-2024-23342 (Minerva timing): fundamental design flaw, no patch. dfe-engine
    #   uses HS256 for JWT — ecdsa P-256 paths are not exercised at runtime.
    # All other fixable CVEs are patched (cryptography, requests, ecdsa DER DoS, pyasn1, pygments).
    pip_audit: warn
