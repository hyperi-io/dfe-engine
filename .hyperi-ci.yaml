# Override defaults with HYPERCI_* env vars.

release:
  enabled: true
  channel: release
  # Private service: ship only the GHCR container image, never a wheel to PyPI.
  destinations:
    python: false
  # The committed spec carries the version, so a release regenerates it or main fails test_openapi_spec_committed.
  stamp_cmd: uv run python openapi-spec/generate.py
  stamp_paths:
    - openapi-spec/openapi.json
    - openapi-spec/openapi.e2e.json
  # The thin chart, assembled from `dfe-engine generate-artefacts`. `library` must render the contract schema the locked scalo writes.
  helm:
    enabled: true
    contract: emit
    library: "2.14.15"

test:
  min_coverage: 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.
  native_tools: [helm]
  python:
    parallel: auto
    # Peak RSS of one process in a full core run was 1206 MiB (/usr/bin/time -v, 11 workers).
    worker_mem_mb: 1280
  full:
    python:
      # Live tests need a deployed DFE; the full tier runs everything else.
      markers: "not live"
      # Skips the full tier accepts, each for something CI cannot provide.
      allow_skip:
        # Entra ID group sync is tested against a real tenant, never a mock.
        - "^Needs Entra sandbox$"
        # Google Workspace group sync is tested against a real tenant, never a mock.
        - "^Needs Google Workspace sandbox"
        # The case-folding account checks only apply on a case-insensitive filesystem; CI's is not.
        - "^this filesystem tells names apart by case$"
        # The HyperDX client tests need a running HyperDX, which CI does not stand up.
        - "^Requires running HyperDX instance$"
        # The sampler/receiver parity tests run their SQL in a clickhouse-local on PATH, which the runner image does not carry. The function-drift tests run a pinned image and fail rather than skip in CI.
        - "^clickhouse-local is not on PATH$"

quality:
  python:
    # semgrep: warn matches hyperi-ci's own default (quality/semgrep.py:36), so
    # this is a deliberate pin rather than a downgrade. Its 38 findings are
    # Flask and Django rules firing on a FastAPI codebase -- the SQL-injection
    # hit is api/v1/queries.py:232, a raw-query endpoint behind
    # require_action(query_execute), where taking a caller's SQL is the point.
    semgrep: warn
    # Above hyperi-ci's warn default: these three are at zero, so a new finding fails the PR.
    vulture: blocking
    ty: blocking
    ruff_docstrings: blocking
  ignore:
    - tool: pip-audit
      ids:
        - CVE-2025-69872
        - PYSEC-2026-2447
      reason: "diskcache unsafe pickle: no upstream fix (5.6.3, released 2023-08-31, is the latest); pySigma pulls it in and dfe-engine never imports it; mitigated by pod isolation."
