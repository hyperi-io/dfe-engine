# Override defaults with HYPERCI_* env vars.

build:
  type: app

publish:
  enabled: true
  channel: release
  # Private service: ship only the GHCR container image, not a Python wheel.
  # (Legacy `target` is ignored since hyperi-ci 2.1.4 removed internal
  # publishing; destinations_oss is the real control. Requires hyperi-ci
  # >= 2.6.17 for the falsy opt-out.)
  destinations_oss:
    python: false

test:
  min_coverage: 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.

quality:
  python:
    semgrep: warn
    vulture: warn
    ty: warn
    bandit_exclude_tests: true
    # pip-audit: warn because diskcache CVE-2025-69872 (unsafe pickle) has no
    # upstream fix — 5.6.3 is the latest release. Mitigated by K8s pod isolation.
    # python-jose (ecdsa, pyasn1) eliminated — replaced by PyJWT[crypto].
    pip_audit: warn
