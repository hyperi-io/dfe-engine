# DFE Engine — HyperI CI Configuration
#
# Only set values that differ from defaults.
# Publish target: internal (JFrog hyperi-pypi-local)

build:
  type: app

publish:
  target: internal

test:
  min_coverage: 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.

quality:
  python:
    semgrep: warn
    vulture: warn
    ty: warn
    bandit_exclude_tests: true
