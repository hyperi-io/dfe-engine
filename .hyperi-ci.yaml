# Override defaults with HYPERCI_* env vars.

build:
  type: app

release:
  enabled: true
  channel: release
  # Private service: ship only the GHCR container image, never a wheel to PyPI.
  destinations:
    python: false

test:
  min_coverage: 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.
  python:
    parallel: auto

quality:
  python:
    # semgrep: warn matches hyperi-ci's own default (quality/semgrep.py:36), so
    # this is a deliberate pin rather than a downgrade. Its 38 findings are
    # Flask and Django rules firing on a FastAPI codebase -- the SQL-injection
    # hit is api/v1/queries.py:232, a raw-query endpoint behind
    # require_action(query_execute), where taking a caller's SQL is the point.
    semgrep: warn
    vulture: warn
    ty: warn
    bandit_exclude_tests: true
    pip_audit:
      mode: warn
      reason: "diskcache CVE-2025-69872 (unsafe pickle) has no upstream fix: 5.6.3, released 2023-08-31, is the latest. Mitigated by pod isolation."
