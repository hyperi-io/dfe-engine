# Override defaults with HYPERCI_* env vars.

build:
  type: app

publish:
  enabled: true
  target: internal
  channel: release

test:
  min_coverage: 70  # Current: 75%. Target: 80%. Ratchet up as coverage improves.

quality:
  python:
    semgrep: warn
    vulture: warn
    ty: warn
    bandit_exclude_tests: true
    # pip-audit: warn until diskcache CVE-2025-69872 (no upstream fix) and
    # pygments CVE-2026-4539 (no upstream fix) are resolved.
    # All fixable CVEs are patched (cryptography, requests, ecdsa, pyasn1).
    pip_audit: warn
